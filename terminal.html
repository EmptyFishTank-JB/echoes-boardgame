<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" id="fav-link">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL ENGINE // v42</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── THEME TOKENS ── */
:root{
  --theme-full:#4fc3f7;
  --theme-dim:rgba(79,195,247,0.70);
  --theme-lo:rgba(79,195,247,0.40);
  --theme-warn:#E8732A;
  --theme-denied:#ff003c;
  --theme-glitch:#ff003c;
  --theme-user:rgba(238,240,245,0.50);
  --theme-bg:rgba(8,10,14,0.85);
  --theme-border:rgba(79,195,247,0.12);
  --theme-irow:rgba(238,240,245,0.05);
  --theme-bc:rgba(79,195,247,0.36);
  --theme-bgsolid:#00080e;
  --theme-glow-a:rgba(15,55,80,0.38);
  --theme-glow-b:rgba(8,30,50,0.18);
}
body.layer-2a{
  --theme-full:#bf7c0a;--theme-dim:rgba(191,124,10,0.70);--theme-lo:rgba(191,124,10,0.45);
  --theme-warn:#c8a020;--theme-denied:#c84040;--theme-glitch:#c84040;--theme-user:rgba(191,124,10,0.55);
  --theme-bg:rgba(2,2,6,0.97);--theme-border:rgba(191,124,10,0.18);
  --theme-irow:rgba(191,124,10,0.10);--theme-bc:rgba(191,124,10,0.36);
  --theme-bgsolid:#0a0700;--theme-glow-a:rgba(80,55,15,0.32);--theme-glow-b:rgba(50,30,8,0.18);
}
body.layer-3a{
  --theme-full:#e05050;--theme-dim:rgba(224,80,80,0.70);--theme-lo:rgba(224,80,80,0.40);
  --theme-warn:#ff8800;--theme-denied:#ff0000;--theme-glitch:#6fe3ff;--theme-user:rgba(224,80,80,0.50);
  --theme-bg:rgba(0,0,0,1.0);--theme-border:rgba(180,30,30,0.18);
  --theme-irow:rgba(180,30,30,0.10);--theme-bc:rgba(224,80,80,0.36);
  --theme-bgsolid:#050000;--theme-glow-a:rgba(80,15,15,0.32);--theme-glow-b:rgba(50,8,8,0.18);
}
/* SYSTEM OVERRIDE — forced black/green, wins over whatever layer theme is
   active regardless of that theme's CSS source order (engine_config.json's
   theme-overrides <style> block is injected dynamically, so this can't rely
   on cascade position alone). */
body.override-mode{
  background:#000 !important;
  --theme-full:#00ff41 !important;--theme-dim:rgba(0,255,65,0.65) !important;
  --theme-lo:rgba(0,255,65,0.40) !important;--theme-warn:#00ff41 !important;
  --theme-denied:#ff3333 !important;--theme-user:rgba(0,255,65,0.70) !important;
  --theme-bg:rgba(0,0,0,0.97) !important;--theme-border:rgba(0,255,65,0.25) !important;
  --theme-irow:rgba(0,255,65,0.06) !important;--theme-bc:rgba(0,255,65,0.45) !important;
  --theme-bgsolid:#000000 !important;--theme-glow-a:rgba(0,120,40,0.35) !important;
  --theme-glow-b:rgba(0,80,25,0.18) !important;
}
/* SYSTEM OVERRIDE transition veil — the theme swap itself (CSS custom
   properties, innerHTML wipe) is instant; this covers it with a fade to
   black and back so the swap reads as a smooth transition rather than a
   flash. Sits above everything, inert to clicks either way. */
#override-fade{position:fixed;inset:0;z-index:9999;background:#000;opacity:0;
  pointer-events:none;transition:opacity 0.4s ease;}
#override-fade.show{opacity:1;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#000;overflow:hidden;}
body{transition:background 1.1s ease;}
/* CRT scanlines */
body::before{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 1px,transparent 4px);
  mix-blend-mode:overlay;}
/* Film grain */
body::after{content:"";position:fixed;inset:-50%;z-index:2;pointer-events:none;
  width:200%;height:200%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
  opacity:0.18;animation:grain 0.12s steps(1) infinite;}
@keyframes grain{
  0%{transform:translate(0,0);}10%{transform:translate(-3%,-4%);}
  20%{transform:translate(-6%,3%);}30%{transform:translate(4%,-2%);}
  40%{transform:translate(-2%,6%);}50%{transform:translate(-5%,-3%);}
  60%{transform:translate(3%,5%);}70%{transform:translate(6%,-4%);}
  80%{transform:translate(-4%,2%);}90%{transform:translate(2%,-6%);}
  100%{transform:translate(-3%,4%);}
}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,0.80) 100%);}
/* Power overlay */
#power-overlay{position:fixed;inset:0;z-index:9999;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  transition:opacity 0.6s ease;}
#power-overlay.hidden{opacity:0;pointer-events:none;}
#power-btn{background:transparent;border:1px solid rgba(79,195,247,0.45);color:#4fc3f7;
  font-family:'Share Tech Mono',monospace;font-size:16px;padding:18px 38px;cursor:pointer;
  letter-spacing:0.14em;text-transform:uppercase;transition:all 0.3s ease;
  box-shadow:inset 0 0 24px rgba(79,195,247,0.08),0 0 24px rgba(79,195,247,0.05);}
#power-btn:hover{background:rgba(79,195,247,0.10);border-color:#4fc3f7;
  box-shadow:inset 0 0 32px rgba(79,195,247,0.18),0 0 32px rgba(79,195,247,0.18);
  text-shadow:0 0 4px #4fc3f7;}
#power-vessel{font-family:'Share Tech Mono',monospace;font-size:26px;letter-spacing:0.5em;margin-right:-0.5em;color:rgba(79,195,247,0.85);
  text-shadow:0 0 14px rgba(79,195,247,0.35);text-align:center;}
#power-title{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:0.26em;line-height:1.9;
  color:rgba(79,195,247,0.55);text-align:center;max-width:min(92vw,640px);text-transform:uppercase;}
#power-sub{font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(79,195,247,0.28);
  letter-spacing:0.16em;text-align:center;max-width:min(92vw,640px);line-height:1.7;}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
/* Page */
#page{position:fixed;top:0;left:0;right:0;z-index:3;height:100vh;height:100dvh;
  display:flex;flex-direction:column;padding:18px 40px 24px;}
/* Header */
#t-header{display:flex;align-items:center;justify-content:space-between;
  padding:0 4px 10px;flex-shrink:0;font-family:'Share Tech Mono',monospace;
  font-size:11px;letter-spacing:0.12em;gap:18px;}
#t-title{color:var(--theme-dim);transition:color 1.1s ease,opacity 0.28s ease;flex-shrink:0;}
#t-breadcrumb{color:var(--theme-bc);transition:color 1.1s ease,opacity 0.35s ease;
  font-size:10.5px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;opacity:0;pointer-events:none;}
#t-breadcrumb.visible{opacity:1;}
#t-meta{display:flex;gap:14px;align-items:center;flex-shrink:0;}
#t-version{color:var(--theme-lo);font-size:10.5px;transition:color 1.1s ease;}
#t-clock{color:var(--theme-dim);font-size:11px;transition:color 1.1s ease;}
/* Terminal box */
#terminal-box{flex:1;display:flex;flex-direction:column;
  background:var(--theme-bg);border:1px solid var(--theme-border);
  min-height:0;overflow:hidden;transition:background 1.1s ease,border-color 1.1s ease;}
/* Output */
#t-output{flex:1;overflow-y:auto;padding:24px 28px 0;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:var(--theme-irow) transparent;
  transition:opacity 0.38s ease;}
#t-output.dim-out{opacity:0;}
#t-output::-webkit-scrollbar{width:3px;}
#t-output::-webkit-scrollbar-thumb{background:var(--theme-irow);}
/* Phosphor decay — overrideable via engine config */
@keyframes phosphorIn{0%{filter:brightness(2.4)}100%{filter:brightness(1.0)}}
.t-line.phos,.t-line .ch{animation:phosphorIn 0.45s ease-out forwards;}   /* a whole line, or each typed character */
/* Output lines */
.t-line{font-family:'Share Tech Mono',monospace;font-size:13px;line-height:1.9;flex-shrink:0;
  letter-spacing:0.04em;white-space:pre-wrap;min-height:1.9em;
  color:var(--theme-full);transition:color 1.1s ease;}
.t-line.full  {color:var(--theme-full);}
.t-line.dim   {color:var(--theme-dim);}
.t-line.lo    {color:var(--theme-lo);}
.t-line.low   {color:var(--theme-lo);}
.t-line.warn  {color:var(--theme-warn);}
.t-line.denied{color:var(--theme-denied);}
.t-line.user  {color:var(--theme-user);}
.t-line.blank {color:transparent;min-height:1.9em;}
/* Multi-color segments within one line (subsystem check lines) */
.t-line .seg-full{color:var(--theme-full);}
.t-line .seg-dim{color:var(--theme-dim);}
.t-line .seg-low,.t-line .seg-lo{color:var(--theme-lo);}
.t-line .seg-warn{color:var(--theme-warn);}
.t-line .seg-denied{color:var(--theme-denied);}
.t-line .seg-ok{color:#4fe0a1;}
.t-line .seg-commit{color:var(--theme-warn);text-shadow:0 0 7px rgba(232,115,42,0.6);}
/* Invert highlight */
.t-line.inverted{background:var(--theme-full)!important;color:#000!important;
  padding-left:4px;padding-right:4px;display:inline-block;
  align-self:flex-start;max-width:100%;font-weight:bold;transition:none;}
/* Item lines: type glyph, author eye, hover. Actionable lines only occupy their own text width so the hover
   highlight can't resize the line under the pointer. */
.t-line .gl{display:inline-block;width:2ch;color:var(--theme-lo);}
.t-line .eye{display:inline-block;width:4ch;color:var(--theme-lo);}
.t-line .eye.off{color:var(--theme-warn);}
.t-line .eye:hover{color:var(--theme-full);text-shadow:0 0 6px var(--theme-full);}
.t-line.art{white-space:pre;line-height:1.15;min-height:0;letter-spacing:0;}
.t-line.art-last{margin-bottom:0.9em;}
.t-line.act{display:inline-block;align-self:flex-start;max-width:100%;padding:0 4px;margin-left:-4px;user-select:none;}
.t-line.inverted .gl,.t-line.inverted .eye{color:#000!important;text-shadow:none;}
/* Pointer: drawn in JS from the active layer color (updateCursors) */
html,body{cursor:var(--cur,default);}
#power-btn,.t-line.act,.t-line .eye,#ctx .ci{cursor:var(--cur-act,pointer);}
#t-field{cursor:var(--cur-txt,text);}
/* Author context menu */
#ctx{position:fixed;z-index:60;min-width:210px;max-width:440px;max-height:calc(100vh - 12px);overflow-y:auto;background:rgba(2,6,10,0.98);
  border:1px solid var(--theme-bc);box-shadow:0 0 18px rgba(0,0,0,0.7),0 0 16px var(--theme-glow-a);
  font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:0.04em;padding:4px 0;}
#ctx .ch{color:var(--theme-lo);padding:4px 12px 3px;font-size:10.5px;letter-spacing:0.12em;border-bottom:1px solid var(--theme-border);margin-bottom:3px;}
#ctx .ci{display:flex;justify-content:space-between;gap:18px;padding:3px 12px;color:var(--theme-dim);}
#ctx .ci .cc{color:var(--theme-lo);}
#ctx .ci:hover{background:var(--theme-full);color:#000;}
#ctx .ci:hover .cc{color:#000;}
#ctx .cs{border-top:1px solid var(--theme-border);margin:3px 0;}
#ctx .cr{display:flex;align-items:baseline;gap:10px;padding:2px 12px;color:var(--theme-dim);}
#ctx .cr .ck{flex:0 0 11ch;color:var(--theme-lo);font-size:10.5px;letter-spacing:0.08em;}
#ctx .cr .cv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#ctx .cr.ro{color:var(--theme-lo);}
#ctx .cr .sw{display:inline-block;width:10px;height:10px;margin-right:7px;border:1px solid rgba(255,255,255,0.35);vertical-align:-1px;}
#ctx .cr.ed{cursor:var(--cur-act,pointer);}
#ctx .cr.ed::after{content:'EDIT';color:var(--theme-lo);font-size:9.5px;letter-spacing:0.12em;}
#ctx .cr.ed:hover{background:var(--theme-full);color:#000;}
#ctx .cr.ed:hover .ck,#ctx .cr.ed:hover::after{color:#000;}
/* Archive view: dashed frame plus an address bar. A running program gets a titled window with a double frame. */
#t-addr{display:none;flex-shrink:0;align-items:center;gap:8px;padding:8px 28px;min-height:35px;
  font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:0.06em;white-space:nowrap;overflow:hidden;
  border-bottom:1px dashed var(--theme-bc);color:var(--theme-dim);}
body.in-archive #terminal-box{border:1px dashed var(--theme-bc);}
body.in-archive #t-addr{display:flex;}
body.in-archive #t-breadcrumb{opacity:0!important;}
#t-addr .up{color:var(--theme-full);padding-right:6px;font-size:14px;}
#t-addr .drv,#t-addr .sep{color:var(--theme-lo);}
#t-addr .seg{color:var(--theme-dim);overflow:hidden;text-overflow:ellipsis;}
#t-addr .seg.cur{color:var(--theme-full);}
#t-addr .seg.go:hover,#t-addr .up.go:hover{color:var(--theme-full);text-shadow:0 0 6px var(--theme-full);text-decoration:underline;}
#t-addr .up.go,#t-addr .seg.go{cursor:var(--cur-act,pointer);}
#t-addr .tag{margin-left:auto;color:var(--theme-lo);padding-left:12px;}
/* Program windows: everything on screen is tinted and the window floats above it. Programs size their own window. */
#prog-layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.18s ease;}
#prog-layer.open{opacity:1;}
.prog-tint{position:absolute;inset:0;background:rgba(0,3,7,0.76);backdrop-filter:blur(2.5px) saturate(0.7);-webkit-backdrop-filter:blur(2.5px) saturate(0.7);}
.prog-win{position:relative;display:flex;flex-direction:column;max-width:96vw;max-height:92vh;background:#02070c;
  border:1px solid var(--theme-full);box-shadow:0 0 0 1px var(--theme-bc),0 0 46px var(--theme-glow-a),0 20px 64px rgba(0,0,0,0.75);
  font-family:'Share Tech Mono',monospace;transform:scale(0.985);transition:transform 0.18s ease;}
#prog-layer.open .prog-win{transform:none;}
.prog-bar{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;background:var(--theme-full);color:#02070c;font-size:12px;letter-spacing:0.14em;flex-shrink:0;}
.prog-bar .ttl{font-weight:bold;}
.prog-bar .exe,.prog-bar .sub{opacity:0.62;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prog-bar .x{margin-left:auto;padding:0 8px;cursor:var(--cur-act,pointer);}
.prog-bar .x:hover{background:#02070c;color:var(--theme-full);}
.prog-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 18px 14px;color:var(--theme-full);font-size:13px;letter-spacing:0.02em;}
.pg-btn{background:transparent;border:1px solid var(--theme-bc);color:var(--theme-full);font:inherit;letter-spacing:0.12em;padding:7px 14px;text-transform:uppercase;cursor:var(--cur-act,pointer);}
.pg-btn:hover,.pg-btn:focus-visible{background:var(--theme-full);color:#02070c;outline:none;}
.pg-input{background:transparent;border:1px solid var(--theme-bc);color:var(--theme-full);font:inherit;letter-spacing:0.12em;padding:7px 10px;text-transform:uppercase;caret-color:var(--theme-full);cursor:var(--cur-txt,text);}
.pg-input:focus{outline:none;border-color:var(--theme-full);box-shadow:0 0 14px var(--theme-glow-a);}
.pg-input::placeholder{color:var(--theme-lo);}
.t-line .col{color:var(--theme-lo);white-space:pre;}
.t-line.inverted .col{color:#000!important;}
/* AUTHOR DIALOG: a floating, movable window for editing an item or a layer. It wears the colors of the layer it edits.
   The controls inside it are styled by terminal-data/author-dialog.js. */
.ed-dlg{position:fixed;z-index:55;width:min(94vw,580px);max-height:min(90vh,780px);display:flex;flex-direction:column;background:rgba(2,6,10,0.97);
  border:1px solid var(--theme-full);box-shadow:0 0 0 1px var(--theme-bc),0 0 40px var(--theme-glow-a),0 16px 48px rgba(0,0,0,0.7);
  color:var(--theme-full);font-family:'Share Tech Mono',monospace;font-size:12.5px;letter-spacing:0.03em;}
.ed-bar{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;background:var(--theme-full);color:#02070c;letter-spacing:0.14em;font-size:12px;
  cursor:move;user-select:none;-webkit-user-select:none;flex-shrink:0;touch-action:none;}
.ed-bar .ttl{font-weight:bold;white-space:nowrap;}
.ed-bar .sub{opacity:0.62;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ed-bar .x{margin-left:auto;padding:0 8px;cursor:var(--cur-act,pointer);}
.ed-bar .x:hover{background:#02070c;color:var(--theme-full);}
.ed-body{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--theme-lo) transparent;}
.ed-foot{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--theme-border);flex-shrink:0;flex-wrap:wrap;}
.ed-foot .msg{flex:1;min-width:120px;color:var(--theme-lo);font-size:11px;letter-spacing:0.06em;}
.ed-foot .msg.bad{color:var(--theme-denied);}
.ed-foot .msg.ok{color:var(--theme-full);}
@media(max-width:768px){#t-addr{padding:7px 14px;font-size:11px;}}
/* Cursor */
.t-cursor::after{content:'_';animation:blink 0.9s step-end infinite;color:var(--theme-full);}
/* Input row */
#t-input-row{display:flex;align-items:center;gap:8px;padding:18px 28px 22px;
  flex-shrink:0;border-top:1px solid var(--theme-irow);transition:border-color 1.1s ease;}
#t-prompt{font-family:'Share Tech Mono',monospace;font-size:13px;
  color:var(--theme-full);transition:color 1.1s ease;user-select:none;}
#t-field{flex:1;background:transparent;border:none;outline:none;
  font-family:'Share Tech Mono',monospace;font-size:13px;
  color:var(--theme-full);letter-spacing:0.04em;caret-color:var(--theme-full);
  text-transform:uppercase;transition:color 1.1s ease,background 0.15s ease;padding:2px 4px;}
#t-field::placeholder{color:var(--theme-lo);letter-spacing:0.08em;text-transform:none;}
#t-field.inverted{background:var(--theme-full);color:#000;font-weight:bold;caret-color:transparent;}
#t-block-cursor{width:9px;height:14px;flex-shrink:0;background:var(--theme-full);
  animation:blink 0.9s step-end infinite;transition:background 1.1s ease;}
/* Virus */
@keyframes virusFlicker{0%,100%{opacity:1}20%{opacity:0.3}40%{opacity:1}60%{opacity:0.15;letter-spacing:0.18em}80%{opacity:1}}
#terminal-box.virus{animation:virusFlicker 0.35s ease-in-out 3;}
/* Mobile */
@media(max-width:768px){
  #page{padding:10px 14px 14px;}
  .t-line{font-size:12px;}
  #t-input-row{padding:14px 14px 16px;}
  #t-header{padding:0 4px 8px;font-size:10px;gap:3px 10px;flex-wrap:wrap;}
  /* The vessel name is long: it gets its own row. The stardate sits under it on the left; a breadcrumb, when there is one, takes a row of its own. */
  #t-title{flex:1 1 100%;}
  #t-meta{order:2;margin-right:auto;}
  #t-breadcrumb{order:3;flex:1 1 100%;text-align:left;}
  #t-breadcrumb:empty,body.in-archive #t-breadcrumb{display:none;}   /* the archive view shows the address bar instead */
  #t-breadcrumb{font-size:9.5px;}
  #t-version{display:none;}
  #t-clock{font-size:10px;}
  #power-btn{font-size:13px;padding:14px 24px;}
  #power-vessel{font-size:20px;letter-spacing:0.38em;margin-right:-0.38em;}
  #power-title{font-size:10px;letter-spacing:0.18em;}
  #power-sub{font-size:10px;}
}
</style>
</head>
<body class="layer-1c">
<canvas id="bg-canvas"></canvas>
<div id="vignette"></div>
<div id="override-fade"></div>
<div id="power-overlay">
  <div id="power-vessel">DSCF CHARON</div>
  <div id="power-title">Expedition Control Hub for Operations &amp; Environmental Systems</div>
  <button id="power-btn">[ Power On / Initialize ]</button>
  <div id="power-sub"></div>
</div>
<div id="page">
  <div id="t-header">
    <span id="t-title"></span>
    <span id="t-breadcrumb"></span>
    <div id="t-meta">
      <span id="t-version">v.&mdash;</span>
      <span id="t-clock">STARDATE 2143.000.0000</span>
    </div>
  </div>
  <div id="terminal-box">
    <div id="t-addr"></div>
    <div id="t-output"></div>
    <div id="t-input-row" style="display:none;">
      <span id="t-prompt">&gt;&nbsp;</span>
      <input id="t-field" type="text" autocomplete="off" spellcheck="false" inputmode="text">
      <div id="t-block-cursor"></div>
    </div>
  </div>
</div>
<script>
'use strict';

// ── DOM REFS ──────────────────────────────────────────────────────────────────
var output    = document.getElementById('t-output');
var inputRow  = document.getElementById('t-input-row');

// ── AUDIO ─────────────────────────────────────────────────────────────────────
var audioCtx = null;
var VOL = 0.18;
var PUNCT = {'.':1,',':1,':':1,';':1,'!':1,'?':1,'-':1,'>':1,'/':1,'_':1};

function getCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playClick(ch){
  if(ch&&PUNCT[ch]){playPunctClick();return;}
  try{
    var ctx=getCtx(),dur=0.025;
    var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    var src=ctx.createBufferSource();src.buffer=buf;
    var flt=ctx.createBiquadFilter();flt.type='bandpass';flt.frequency.value=3000+Math.random()*1000;flt.Q.value=0.8;
    var gn=ctx.createGain();gn.gain.setValueAtTime(VOL,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    src.connect(flt);flt.connect(gn);gn.connect(ctx.destination);src.start();src.stop(ctx.currentTime+dur);
  }catch(e){}
}
function playPunctClick(){
  try{var ctx=getCtx();var osc=ctx.createOscillator();osc.type='triangle';osc.frequency.value=200;var gn=ctx.createGain();gn.gain.setValueAtTime(VOL*0.55,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.04);osc.connect(gn);gn.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.04);}catch(e){}
}
function playEnter(){
  try{var ctx=getCtx(),dur=0.055;var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.25));var src=ctx.createBufferSource();src.buffer=buf;var flt=ctx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=800;var gn=ctx.createGain();gn.gain.setValueAtTime(VOL*1.2,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);src.connect(flt);flt.connect(gn);gn.connect(ctx.destination);src.start();src.stop(ctx.currentTime+dur);}catch(e){}
}
function playBackspace(){
  try{var ctx=getCtx(),dur=0.032;var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);var src=ctx.createBufferSource();src.buffer=buf;var f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=900+Math.random()*300;f.Q.value=1.2;var f2=ctx.createBiquadFilter();f2.type='lowpass';f2.frequency.value=1800;var gn=ctx.createGain();gn.gain.setValueAtTime(VOL,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);src.connect(f);f.connect(f2);f2.connect(gn);gn.connect(ctx.destination);src.start();src.stop(ctx.currentTime+dur);}catch(e){}
}
function playAlert(){
  try{var ctx=getCtx();var gn=ctx.createGain();gn.connect(ctx.destination);[440,330].forEach(function(freq,idx){var osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.value=freq;osc.connect(gn);var t=ctx.currentTime+idx*0.12;gn.gain.setValueAtTime(VOL*0.4,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.1);osc.start(t);osc.stop(t+0.1);});}catch(e){}
}
function _deniedBurst(ctx,t,vol){
  var dur=0.07;var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.8);var bs=ctx.createBufferSource();bs.buffer=buf;var lo=ctx.createBiquadFilter();lo.type='bandpass';lo.frequency.value=320;lo.Q.value=0.9;var gn=ctx.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);bs.connect(lo);lo.connect(gn);gn.connect(ctx.destination);bs.start(t);bs.stop(t+dur);
  var len2=Math.floor(ctx.sampleRate*0.008);var buf2=ctx.createBuffer(1,len2,ctx.sampleRate);var d2=buf2.getChannelData(0);for(var j=0;j<len2;j++)d2[j]=(Math.random()*2-1)*(1-j/len2);var bs2=ctx.createBufferSource();bs2.buffer=buf2;var hi=ctx.createBiquadFilter();hi.type='bandpass';hi.frequency.value=3500;hi.Q.value=1.2;var gn2=ctx.createGain();gn2.gain.setValueAtTime(vol*0.6,t);gn2.gain.exponentialRampToValueAtTime(0.001,t+0.008);bs2.connect(hi);hi.connect(gn2);gn2.connect(ctx.destination);bs2.start(t);bs2.stop(t+0.008);
}
function playDenied(){try{var ctx=getCtx();[0,0.08,0.18].forEach(function(delay,i){_deniedBurst(ctx,ctx.currentTime+delay,VOL*[0.9,0.35,0.12][i]);});}catch(e){}}
// A short soft pip when arrowing through a menu or the command history: higher going up, lower going down, and a dull tick at the end
// of the history where the arrow cannot go further (edge). It uses the master volume. Held-down keys are thinned out.
var lastPipAt = 0;
function playNavPip(dir, edge){
  var now = performance.now(); if(now - lastPipAt < 28) return; lastPipAt = now;
  try{
    var ctx = getCtx(), t = ctx.currentTime, osc = ctx.createOscillator(), gn = ctx.createGain(), dur = edge ? 0.05 : 0.04;
    osc.type = edge ? 'triangle' : 'sine';
    osc.frequency.value = edge ? 260 : (dir < 0 ? 1480 : 1120);
    gn.gain.setValueAtTime(VOL * (edge ? 0.35 : 0.4), t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gn); gn.connect(ctx.destination); osc.start(t); osc.stop(t + dur);
  }catch(e){}
}
function playLineStatic(){
  try{var ctx=getCtx(),dur=0.035;var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);var src=ctx.createBufferSource();src.buffer=buf;var flt=ctx.createBiquadFilter();flt.type='highpass';flt.frequency.value=2000;var gn=ctx.createGain();gn.gain.setValueAtTime(VOL*0.75,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);src.connect(flt);flt.connect(gn);gn.connect(ctx.destination);src.start();src.stop(ctx.currentTime+dur);}catch(e){}
}
function playThinkHum(ms){
  try{var ctx=getCtx(),dur=Math.min(ms/1000,1.2);if(dur<0.1)return;var osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=110;var gn=ctx.createGain();gn.gain.setValueAtTime(0,ctx.currentTime);gn.gain.linearRampToValueAtTime(VOL*0.12,ctx.currentTime+0.08);gn.gain.setValueAtTime(VOL*0.12,ctx.currentTime+dur-0.08);gn.gain.linearRampToValueAtTime(0,ctx.currentTime+dur);osc.connect(gn);gn.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+dur);}catch(e){}
}
function playEggTone(){
  try{var ctx=getCtx();[660,880].forEach(function(f,i){var osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=f;var gn=ctx.createGain();var t=ctx.currentTime+i*0.09;gn.gain.setValueAtTime(VOL*0.25,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.08);osc.connect(gn);gn.connect(ctx.destination);osc.start(t);osc.stop(t+0.08);});}catch(e){}
}
function playIdlePop(){
  try{var ctx=getCtx();var len=Math.floor(ctx.sampleRate*0.06);var buf=ctx.createBuffer(1,len,ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(len*0.3));var src=ctx.createBufferSource();src.buffer=buf;var flt=ctx.createBiquadFilter();flt.type='bandpass';flt.frequency.value=1200;flt.Q.value=0.5;var gn=ctx.createGain();gn.gain.setValueAtTime(VOL*0.35,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.06);src.connect(flt);flt.connect(gn);gn.connect(ctx.destination);src.start();src.stop(ctx.currentTime+0.06);}catch(e){}
}

// ── AMBIENT ───────────────────────────────────────────────────────────────────
var ambNodes = null;

function _buildL1Amb(ctx){
  var master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  var o1=ctx.createOscillator();o1.type='sine';o1.frequency.value=110;var g1=ctx.createGain();g1.gain.value=0.06;o1.connect(g1);g1.connect(master);o1.start();
  var o2=ctx.createOscillator();o2.type='sawtooth';o2.frequency.value=90;var f2=ctx.createBiquadFilter();f2.type='lowpass';f2.frequency.value=180;var g2=ctx.createGain();g2.gain.value=0.045;var lfo=ctx.createOscillator();lfo.type='sine';lfo.frequency.value=0.12;var lfoG=ctx.createGain();lfoG.gain.value=0.015;lfo.connect(lfoG);lfoG.connect(g2.gain);o2.connect(f2);f2.connect(g2);g2.connect(master);o2.start();lfo.start();
  var nBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);var nD=nBuf.getChannelData(0);for(var i=0;i<nD.length;i++)nD[i]=(Math.random()*2-1)*0.5;var nSrc=ctx.createBufferSource();nSrc.buffer=nBuf;nSrc.loop=true;var nFlt=ctx.createBiquadFilter();nFlt.type='lowpass';nFlt.frequency.value=500;var nG=ctx.createGain();nG.gain.value=0.04;nSrc.connect(nFlt);nFlt.connect(nG);nG.connect(master);nSrc.start();
  return{master:master,stop:function(){try{o1.stop();o2.stop();lfo.stop();nSrc.stop();}catch(e){}}};
}
function _buildL2Amb(ctx){
  var master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);var stops=[];
  [80,121,160,203].forEach(function(freq,i){var osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=freq;var g=ctx.createGain();g.gain.value=0.025;var lfo=ctx.createOscillator();lfo.type='sine';lfo.frequency.value=[0.02,0.035,0.05,0.06][i];var lfoG=ctx.createGain();lfoG.gain.value=0.012;lfo.connect(lfoG);lfoG.connect(g.gain);osc.connect(g);g.connect(master);osc.start();lfo.start();stops.push(osc,lfo);});
  return{master:master,stop:function(){stops.forEach(function(n){try{n.stop();}catch(e){}});}};
}
function _buildL3Amb(ctx){
  var master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);var osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=38;var g=ctx.createGain();g.gain.value=0.5;osc.connect(g);g.connect(master);osc.start();
  return{master:master,stop:function(){try{osc.stop();}catch(e){}}};
}

// A layer's ambient sound: its own settings in echo-os.json (layers.<id>.ambient), else the legacy engine_config block,
// else the built-in sound for that layer.
function ambientCfg(lvKey){
  var L = (typeof osData !== 'undefined' && osData && osData.layers && osData.layers[lvKey]) || null;
  if(L && L.ambient) return L.ambient;
  return (typeof CFG_AMBIENT !== 'undefined' && CFG_AMBIENT && CFG_AMBIENT[lvKey]) || null;
}
function buildAmbFromConfig(ctx, lvKey){
  var lvCfg = ambientCfg(lvKey);
  if(!lvCfg||!lvCfg.oscillators||!lvCfg.oscillators.length){
    if(lvKey==='l1a') return _buildL1Amb(ctx);
    if(lvKey==='l2a') return _buildL2Amb(ctx);
    return _buildL3Amb(ctx);
  }
  return buildAmbFromCfg(ctx, lvCfg);
}
// Builds the sound from an ambient block ({target_volume, oscillators[]}). Also used to preview a sound before choosing it.
function buildAmbFromCfg(ctx, lvCfg){
  var master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);var stops=[];
  lvCfg.oscillators.forEach(function(osc){
    var gainNode=ctx.createGain();gainNode.gain.value=osc.volume||0.04;
    var source;
    if(osc.type==='noise'){var bl=ctx.sampleRate*2;var buf=ctx.createBuffer(1,bl,ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;source=ctx.createBufferSource();source.buffer=buf;source.loop=true;}
    else{source=ctx.createOscillator();source.type=osc.type||'sine';source.frequency.value=osc.freq||110;}
    stops.push(source);
    var lastNode=source;
    if(osc.filter_type&&osc.filter_type!=='none'){var flt=ctx.createBiquadFilter();flt.type=osc.filter_type;flt.frequency.value=osc.filter_freq||500;source.connect(flt);lastNode=flt;}
    if(osc.lfo_rate&&osc.lfo_rate>0){var lfo=ctx.createOscillator();lfo.type='sine';lfo.frequency.value=osc.lfo_rate;var lfoG=ctx.createGain();lfoG.gain.value=osc.lfo_depth||0.012;lfo.connect(lfoG);lfoG.connect(gainNode.gain);lfo.start();stops.push(lfo);}
    lastNode.connect(gainNode);gainNode.connect(master);source.start();
  });
  return{master:master,stop:function(){stops.forEach(function(n){try{n.stop();}catch(e){}});}};
}

function crossfadeAmbient(level){
  try{
    var ctx=getCtx();var prev=ambNodes;var lvKey=level===1?'l1a':level===2?'l2a':'l3a';
    var fresh=buildAmbFromConfig(ctx,lvKey);
    var lvCfg=ambientCfg(lvKey);
    var target=lvCfg&&lvCfg.target_volume!=null?lvCfg.target_volume:(level===1?0.18:level===2?0.12:0.05);
    if(typeof CFG_VOLUME!=='undefined'&&CFG_VOLUME!=null) VOL=CFG_VOLUME;
    fresh.master.gain.setTargetAtTime(target,ctx.currentTime,0.7);
    ambNodes=fresh;
    if(prev){prev.master.gain.setTargetAtTime(0,ctx.currentTime,0.8);setTimeout(function(){try{prev.stop();prev.master.disconnect();}catch(e){}},3500);}
  }catch(e){}
}

// Previewing a sound in the author dialog: the layer's own sound ducks while the preview plays, then comes back.
var previewNodes=null, previewTimer=null, ambDucked=false;
function ambientTarget(level){
  var lvCfg=ambientCfg(level===1?'l1a':level===2?'l2a':'l3a');
  return lvCfg&&lvCfg.target_volume!=null?lvCfg.target_volume:(level===1?0.18:level===2?0.12:0.05);
}
function previewAmbient(cfg, volume){
  stopAmbientPreview(true);
  try{
    var ctx=getCtx();
    if(ambNodes&&!ambDucked){ambNodes.master.gain.setTargetAtTime(0,ctx.currentTime,0.2);ambDucked=true;}
    if(cfg&&cfg.oscillators&&cfg.oscillators.length){
      var fresh=buildAmbFromCfg(ctx,cfg);
      fresh.master.gain.setTargetAtTime(volume!=null?volume:(cfg.target_volume||0.12),ctx.currentTime,0.25);
      previewNodes=fresh;
    }
    previewTimer=setTimeout(function(){stopAmbientPreview();},12000);   // a preview never plays on forever
  }catch(e){}
}
function stopAmbientPreview(keepDuck){
  clearTimeout(previewTimer);previewTimer=null;
  var ctx;try{ctx=getCtx();}catch(e){return;}
  if(previewNodes){var n=previewNodes;previewNodes=null;n.master.gain.setTargetAtTime(0,ctx.currentTime,0.2);setTimeout(function(){try{n.stop();n.master.disconnect();}catch(e){}},1200);}
  if(ambDucked&&!keepDuck){ambDucked=false;if(ambNodes)ambNodes.master.gain.setTargetAtTime(ambientTarget(currentLevel),ctx.currentTime,0.4);}
}

// ── UTILITIES ─────────────────────────────────────────────────────────────────
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

function setActiveCursor(el){
  // Only the line the player will type on blinks. Clear every other one, including lines
  // restored from saved history that still carry the class.
  var stale=output.querySelectorAll('.t-cursor');
  for(var si=0;si<stale.length;si++) if(stale[si]!==el) stale[si].classList.remove('t-cursor');
  cursorEl=el;
  if(el) el.classList.add('t-cursor');
}

var holdScroll=false;   // true while a page is drawn: it opens at the top instead of following the last line
// The pop-in glow: brightness flash that fades to the line's normal luminosity (see updPhosphorCSS for brightness and
// duration). Lines that appear whole glow as a whole; typed characters each glow on their own (typeChat).
function glowMs(){return (typeof CFG_TIMING!=='undefined'&&CFG_TIMING&&CFG_TIMING.phosphor_duration_ms)||450;}
function glow(el){
  el.classList.remove('phos'); void el.offsetWidth; el.classList.add('phos');
  if(!el._glowEnd){ el._glowEnd=true; el.addEventListener('animationend',function(e){ if(e.target===el) el.classList.remove('phos'); }); }
  // Backstop: animationend does not fire if the line is hidden or the tab is in the background, and a line left holding
  // the class would flash again the next time its screen is shown.
  clearTimeout(el._glowT); el._glowT=setTimeout(function(){ el.classList.remove('phos'); },glowMs()+80);
}
// Puts a saved screen back. Lines that were already on screen come back settled: no flash, whole screen or per line.
function restoreOutput(html){
  output.innerHTML=html;
  output.querySelectorAll('.phos').forEach(function(e){e.classList.remove('phos');});
  output.querySelectorAll('.ch').forEach(function(e){e.classList.remove('ch');});
}
// A copy of the screen's HTML for restoring later. Glow classes are dropped: a line caught mid-glow would otherwise
// restore holding the class forever (and replay the flash).
function snapOutput(){
  var c=output.cloneNode(true);
  c.querySelectorAll('.phos').forEach(function(e){e.classList.remove('phos');});
  c.querySelectorAll('.ch').forEach(function(e){e.classList.remove('ch');});
  return c.innerHTML;
}
function addLine(cls,phosphor){
  var el=document.createElement('div');
  el.className='t-line '+(cls||'');
  if(phosphor!==false) glow(el);   // pass false for a line that will be typed character by character
  output.appendChild(el);
  if(!holdScroll) output.scrollTop=output.scrollHeight;
  return el;
}

// WHAT TYPES AND WHAT LANDS WHOLE. Every line the terminal prints has a kind, and this table says how that kind renders:
//   'chat'  typed character by character with natural speed variation and slow words (personality.json replies only)
//   'type'  typed character by character at one uniform speed (typing.base_ms), no variation
//   'whole' the line lands at once with the whole-line glow, then a short fixed pause before the next line
// Either way the glow is the same: a whole line flashes once and fades; typed characters each flash and fade on their own.
var RENDER = {
  chat:   'chat',    // free-text replies: personality responses, easter eggs, denied and admin lines, KNOCK KNOCK
  boot:   'type',    // the landing screen's text: the intro, "VERIFYING SUBSYSTEM CONNECTIONS...", the FULL ACCESS / DEGRADED verdict, fallback boot text
  check:  'whole',   // the five subsystem check lines (label, dashes, [STATUS], commit ID): each lands whole, with the static
  flavor: 'type',    // transition text, mount and unmount lines, layer enter and exit confirmations, system override and self destruct sequences
  status: 'type',    // one-line system messages: errors, confirmations, "PROGRAM CLOSED", command headings, summaries
  doc:    'type',    // body text of a document or a pulled node
  prompt: 'type',    // > AWAITING INPUT
  list:   'whole',   // [HELP] entries, [LEGEND] rows, [STATUS] results, [TREE], [LS], the echo of what you typed
  page:   'whole'    // archive pages (folders, documents, logs)
};
var LINE_MS_DEFAULT=40, PAGE_MS_DEFAULT=22;
function listMs(){var t=typeof CFG_TYPING!=='undefined'&&CFG_TYPING;return (t&&t.line_ms)||LINE_MS_DEFAULT;}
function pageMs(){var t=typeof CFG_TYPING!=='undefined'&&CFG_TYPING;return (t&&t.page_ms)||PAGE_MS_DEFAULT;}
function typeMs(){var t=typeof CFG_TYPING!=='undefined'&&CFG_TYPING;return (t&&t.base_ms)||38;}

// Types text into a line one character at a time. Each character is a span that flashes and fades on its own; once the last
// one has settled the spans fold back into plain text. delay() is how long to wait after each character.
async function typeChars(el,text,delay,line){
  line=line||el;
  line.classList.remove('phos'); clearTimeout(line._glowT);   // a typed line does not also glow as a whole
  for(var i=0;i<text.length;i++){
    if(typingAbort) return;
    var ch=document.createElement('span');ch.className='ch';ch.textContent=text[i];el.appendChild(ch);   // glows, then settles
    if(text[i]!==' '&&text[i]!=='─') playClick(text[i]);
    if(!holdScroll) output.scrollTop=output.scrollHeight;
    await sleep(delay());
  }
  setTimeout(function(){ if(el.isConnected&&el.querySelector('.ch')) el.textContent=el.textContent; },glowMs()+120);
}
// 'type': one uniform speed.
async function typeLine(el,text){ var ms=typeMs(); return typeChars(el,text,function(){return ms;}); }
// 'chat': the personality's replies. Natural variation, slower on the configured slow words.
async function typeChat(el,text){
  var sw=CFG_SLOW_WORDS||[];
  var slowed=inputSlowed||sw.some(function(w){return text.toUpperCase().indexOf(w)>=0;});
  var t=typeof CFG_TYPING!=='undefined'&&CFG_TYPING;
  var baseMs=t&&t.base_ms?t.base_ms:38;
  var variance=t&&t.variance!=null?t.variance:0.6;
  var mult=slowed?((t&&t.slow_multiplier?t.slow_multiplier:2.8)):1;
  return typeChars(el,text,function(){return baseMs*mult*(0.7+Math.random()*variance);});
}
// 'whole': the line lands at once, then a fixed pause.
async function showLine(el,text){
  if(typingAbort) return;
  el.textContent+=text;
  glow(el);
  if(text) playLineStatic();
  if(!holdScroll) output.scrollTop=output.scrollHeight;
  await sleep(listMs());
}
// A line made of colored segments (the boot checks: label, dashes, [STATUS], commit ID). It renders by the same rules
// as any other line: typed segment by segment with the click sounds, or whole with the static, per its kind.
async function putDyn(el,dr,kind){
  if(!dr.parts) return put(el,dr.text,kind);
  var mode=RENDER[kind||'status']||'type';
  if(typingAbort) return;
  if(mode==='whole'){ renderDynLine(el,dr); glow(el); playLineStatic(); if(!holdScroll) output.scrollTop=output.scrollHeight; await sleep(listMs()); return; }
  playLineStatic();
  var ms=typeMs(), uniform=function(){return ms;};
  for(var i=0;i<dr.parts.length;i++){
    var seg=document.createElement('span'); seg.className='seg-'+(dr.parts[i].cls||'dim'); el.appendChild(seg);
    await typeChars(seg,dr.parts[i].text,uniform,el);
  }
}
// The one entry point: render text into a line the way its kind says to.
async function put(el,text,kind){
  var mode=RENDER[kind||'status']||'type';
  if(mode==='chat') return typeChat(el,text);
  if(mode==='whole') return showLine(el,text);
  return typeLine(el,text);
}

async function printInstant(lines,gap){
  for(var i=0;i<lines.length;i++){
    var el=addLine(lines[i].cls||'full',true);
    if(lines[i].jump){el.textContent=lines[i].text;el.classList.add('act');el.dataset.jump=lines[i].jump;el.title='Jump here';playLineStatic();}
    else if(lines[i].cmd||lines[i].id||lines[i].glyph){buildItemLine(el,lines[i]);playLineStatic();}
    else if(lines[i].parts){renderDynLine(el,lines[i]);playLineStatic();}
    else if(lines[i].text){el.textContent=lines[i].text;playLineStatic();}
    await sleep(gap==null?listMs():gap);
  }
}

async function printTyped(lines){
  for(var i=0;i<lines.length;i++){
    var el=addLine(lines[i].cls||'full');
    // Segmented lines render instantly — the char-by-char typer can't split
    // one line across colored spans, and status lines suit a snap-in anyway.
    if(lines[i].parts){renderDynLine(el,lines[i]);playLineStatic();}
    else if(lines[i].text){playLineStatic();await put(el,lines[i].text,'flavor');}
    await sleep(40);
  }
}

// ── BOOT SCRIPT ───────────────────────────────────────────────────────────────
// File readiness checks — used to wait for async file loads before rendering
// Display labels come from L1C_ROOT body[] dynamic lines, not from here
var FILE_CHECK_MAP = [
  {key:'personality', ready:function(){return _perReady;}},
  {key:'lore',        ready:function(){return _lorReady;}},
  {key:'devlogs',     ready:function(){return _devReady;}},
  {key:'nodes',       ready:function(){return _archReady;}},
  {key:'engine',      ready:function(){return _engReady;}}
];

async function runScript(){
  typing=true;typingAbort=false;
  output.innerHTML='';inputRow.style.display='none';cursorEl=null;
  await sleep(800);

  // ── PHASE 1: BOOT_NODE body[] — header and narrative from echo-os.json ────
  var bootNode=archData&&archData.nodes&&archData.nodes['BOOT_NODE'];
  if(bootNode&&bootNode.body&&bootNode.body.length){
    for(var bi=0;bi<bootNode.body.length;bi++){
      if(typingAbort) break;
      var bline=bootNode.body[bi];
      if(bline.type==='text'){
        var bel=addLine(bline.cls||'low');
        if(bline.text){playLineStatic();await put(bel,bline.text,'boot');}
        await sleep(220);
      }else if(bline.type==='dynamic'){
        var dr0=resolveDynamic(bline);
        var del0=addLine(dr0.cls||'dim');await putDyn(del0,dr0,'boot');await sleep(220);
      }
    }
  }else if(!archData){
    var errEl=addLine('denied');await put(errEl,'> ERROR \u2014 NAVIGATION DATA UNAVAILABLE','status');
  }

  // ── PHASE 2: silent wait for all files to load or timeout ────────────────
  var failCount=0, warnCount=0;
  for(var fi=0;fi<FILE_CHECK_MAP.length;fi++){
    var fc=FILE_CHECK_MAP[fi];
    var waited=0;
    while(!fc.ready()&&waited<3000){await sleep(80);waited+=80;}
    var fst=fileState(fc.key);
    if(fst==='warn') warnCount++; else if(fst!=='ok') failCount++;
  }
  // Store result for system.boot_status dynamic variable
  window._bootFailCount=failCount; window._bootWarnCount=warnCount;

  // ── PHASE 3: find L1 chat root node and render its body[] inline ──────────
  if(!typingAbort){
    var chatNodeId=findChatRootNode('l1c');
    if(chatNodeId&&archData&&archData.nodes[chatNodeId]){
      var chatNode=archData.nodes[chatNodeId];
      if(chatNode.body&&chatNode.body.length){
        await sleep(200);
        for(var ci=0;ci<chatNode.body.length;ci++){
          if(typingAbort) break;
          var cb=chatNode.body[ci];
          if(cb.hidden) continue;
          if(cb.type==='art'){
            // Title art: ASCII rows made of colored segments (ECH bright, OES dimmer, O.S. to the right).
            // The narrow variant is used when the wide one would not fit the screen.
            var avail=Math.max(0,output.clientWidth-56);
            var av=(cb.wide&&avail>=cb.wide.cols*8)?cb.wide:(cb.narrow||cb.wide);
            for(var ar=0;ar<av.rows.length;ar++){
              if(typingAbort) break;
              var aEl=addLine('full',true);aEl.classList.add('art');if(ar===av.rows.length-1)aEl.classList.add('art-last');
              av.rows[ar].forEach(function(sg){var sp=document.createElement('span');sp.className='seg-'+sg.c;sp.textContent=sg.t;aEl.appendChild(sp);});
              playLineStatic();await sleep(90);
            }
            await sleep(160);
          }else if(cb.type==='text'){
            var cel=addLine(cb.cls||'full');
            if(cb.text){playLineStatic();await put(cel,cb.text,'boot');}
            await sleep(60);
          }else if(cb.type==='dynamic'){
            var dr1=resolveDynamic(cb);
            var del1=addLine(dr1.cls||'dim');await putDyn(del1,dr1,/^file_status\./.test(cb.variable||'')?'check':'boot');await sleep(60);
          }else if(cb.type==='command'){
            var cCls=cb.cmd_type==='navigation'?'cmd-nav':cb.cmd_type==='pull'?'cmd-pull':'dim';
            var cEl=addLine(cCls);
            if(cb.text||cb.label){
              var cTxt=(cb.text||(cb.label||'').trim());
              if(cb.cmd_type==='navigation'&&cb.label){
                var cLb=buildItemLine(cEl,{text:cTxt,glyph:glyphOf(kindOfTarget(cb.target)),cmd:cTxt.toUpperCase()});
                cLb.textContent='';playLineStatic();await put(cLb,cTxt,'boot');
              }else{playLineStatic();await put(cEl,cTxt,'boot');}
            }
            await sleep(40);
          }
        }
      }
    }else if(!typingAbort){
      // The landing screen lives in echo-os.json. If that file is missing or unusable, draw the subsystem
      // checks from code so a broken data file still reports itself instead of showing a blank terminal.
      var fbChecks=[['file_status.personality','CREW BEHAVIORAL MATRIX ------'],['file_status.lore','ARCHIVE LOG DATABASE --------'],
        ['file_status.devlogs','DEVELOPMENT RECORDS ---------'],['file_status.nodes','NAVIGATION ARCHITECTURE -----'],['file_status.engine','CORE ENGINE PARAMETERS ------']];
      var fbHead=addLine('dim');await put(fbHead,'> VERIFYING SUBSYSTEM CONNECTIONS...','boot');await sleep(120);
      for(var fbi=0;fbi<fbChecks.length;fbi++){ var c=fbChecks[fbi];
        var r=resolveDynamic({variable:c[0],display_label:c[1],valid_text:'OK',denied_text:'ERROR',label_cls:'full',value_cls:'full'});
        var fl=addLine(r.cls||'dim');await putDyn(fl,r,'check');await sleep(60);
      }
      var fbSt=resolveDynamic({variable:'system.boot_status',valid_text:'FULL ACCESS',denied_text:'DEGRADED',value_cls:'full'});
      await putDyn(addLine(fbSt.cls||'full'),fbSt,'boot');
    }
  }

  if(!typingAbort){
    termState='L1_NORMAL';currentMenuOpts=[];menuSelIdx=-1;
    var awEl=addLine('low');await put(awEl,'> AWAITING INPUT','prompt');
    setActiveCursor(awEl);await sleep(400);
    inputRow.style.display='flex';termInput.focus();
  }
  typing=false;
}

// The navigation file counts as loaded only if the tree has a layer 1 archive root.
function navOk(){ return !!(archData && layerRootId('l1a')); }

// Find the root chat node for a given layer
function findChatRootNode(layerId){
  if(!archData||!archData.nodes) return null;
  var found=null;
  Object.keys(archData.nodes).forEach(function(nid){
    var n=archData.nodes[nid];
    if(n.node_type==='chat'&&n.layer===layerId&&n.is_root) found=nid;
  });
  return found;
}

// ── STARDATE ──────────────────────────────────────────────────────────────────
// Intentional: this offset drifts forward with real time and must never be
// frozen. It's the only hint in the entire experience that the terminal is
// still running, still live, long after the story's events — the reader
// never gets that confirmed anywhere else. Landed on +167 so "now" reads as
// 2193 at the time this was set; do not "fix" this as inconsistent later.
function getStardate(){
  var now=new Date();var yr=now.getFullYear()+167;
  var start=new Date(now.getFullYear(),0,0);var day=Math.floor((now-start)/864e5);
  var dayStr=String(day).padStart(3,'0');
  var hh=String(now.getHours()).padStart(2,'0');var mm=String(now.getMinutes()).padStart(2,'0');
  var ss=String(now.getSeconds()).padStart(2,'0');
  return 'STARDATE '+yr+'.'+dayStr+'.'+hh+mm+'.'+ss;
}
function updateClock(){var el=document.getElementById('t-clock');if(el)el.textContent=getStardate();}
setInterval(updateClock,1000);

// ── MOBILE KEYBOARD HEIGHT FIX ───────────────────────────────────────────────
// 100dvh doesn't shrink for an on-screen keyboard on most mobile browsers — the
// keyboard just covers content. visualViewport reports the actual visible area
// (iOS Safari, modern Android Chrome); window.innerHeight is the fallback for
// browsers without visualViewport support (older Android WebViews).
//
// Shrinking the height alone isn't enough: when a focused input nears the
// bottom edge, mobile browsers pan the *visual* viewport upward to keep it
// visible, independent of any document scroll — and since #page is
// position:fixed (pinned to the *layout* viewport), that pan drags its top
// edge off-screen along with everything below it. visualViewport.offsetTop
// reports how far the browser has panned, so we translate #page by the
// negative of that offset to cancel the pan and keep the top pinned; only
// the bottom (above the keyboard) compresses.
(function(){
  var pg=document.getElementById('page');
  if(!pg) return;
  function fixHeight(){
    var vv=window.visualViewport;
    var h=(vv?vv.height:window.innerHeight);
    pg.style.height=h+'px';
    pg.style.transform=vv?('translateY('+(-vv.offsetTop)+'px)'):'';
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',fixHeight);
    window.visualViewport.addEventListener('scroll',fixHeight);
  } else {
    window.addEventListener('resize',fixHeight);
  }
  fixHeight();
})();

function decryptIfNeeded(text){
  if(text&&text.indexOf('ENCv1::')===0){try{return atob(text.substring(7));}catch(e){return text;}}
  return text;
}

// ── VERSION = COMMIT ID ───────────────────────────────────────────────────────
// Header/power-gate version is the short SHA of the latest commit touching
// terminal.html only. No fallback text — if the fetch fails, the placeholder
// dashes stay (a page that can't reach GitHub isn't being served fresh anyway).
var _commitVer=null;
var COMMITS_API='https://api.github.com/repos/EmptyFishTank-JB/echoes-boardgame/commits?per_page=1&path=';
function fetchLatestSha(path){
  return fetch(COMMITS_API+encodeURIComponent(path))
    .then(function(r){if(!r.ok)throw new Error('bad response');return r.json();})
    .then(function(d){return d&&d.length?d[0].sha.slice(0,7):null;})
    .catch(function(){return null;});
}
function applyCommitVersion(){
  if(!_commitVer) return;
  var ver=document.getElementById('t-version');if(ver)ver.textContent=_commitVer;
  var sub=document.getElementById('power-sub');
  if(sub){var parts=[];if(CFG_TITLE)parts.push(CFG_TITLE);parts.push(_commitVer);sub.textContent=parts.join(' // ');}
}
function fetchCommitVersion(){
  fetchLatestSha('terminal.html').then(function(sha){
    if(sha){_commitVer='v.'+sha;applyCommitVersion();}
  });
}

// ── DATA FILE STATUS ─────────────────────────────────────────────────────────
// Every data file ends up in one state, shown on the boot screen and in [SYSTEM OVERRIDE] [STATUS]:
//   ok       loaded, parsed, and the contents look right
//   warn     usable, but something inside is off (some entries malformed, a theme missing, ...)
//   invalid  valid JSON with the wrong contents: treated as unavailable
//   broken   fetched, but not valid JSON
//   missing  could not be fetched (not found, or the network failed)
var FILE_STATUS = {};
var FILE_LABELS = {personality:'CREW BEHAVIORAL MATRIX', lore:'ARCHIVE LOG DATABASE', devlogs:'DEVELOPMENT RECORDS', nodes:'NAVIGATION ARCHITECTURE', engine:'CORE ENGINE PARAMETERS'};
var FILE_NAMES = {personality:'personality.json', lore:'lore.json', devlogs:'dev_logs.json', nodes:'echo-os.json', engine:'engine_config.json'};
function fileState(key){ return (FILE_STATUS[key] && FILE_STATUS[key].state) || 'missing'; }
function statusLabel(state){ return (CFG_STRINGS && CFG_STRINGS['status_'+state]) || state.toUpperCase(); }
function isObj(x){ return !!x && typeof x === 'object' && !Array.isArray(x); }
function stOk(){ return {state:'ok', detail:''}; }
function stWarn(list){ return {state:'warn', detail:list.join('; ')}; }
function stBad(detail){ return {state:'invalid', detail:detail}; }
var CODE_KEY_RE = /^[A-Z0-9]{5}(-[A-Z0-9]{5}){3}$/;
function checkLogFile(d){
  if(!isObj(d)) return stBad('MUST BE AN OBJECT OF ENTRIES KEYED BY CODE');
  var keys = Object.keys(d);
  if(!keys.length) return stWarn(['NO ENTRIES']);
  var bad = keys.filter(function(k){ var e = d[k]; return !isObj(e) || typeof e.text !== 'string' || ['full','classified','virus'].indexOf(e.type) === -1; }).length;
  if(bad === keys.length) return stBad('NO USABLE ENTRIES (EACH NEEDS text AND type: full, classified OR virus)');
  var issues = [];
  if(bad) issues.push(bad+' OF '+keys.length+' ENTRIES MALFORMED');
  var badKeys = keys.filter(function(k){ return !CODE_KEY_RE.test(k); }).length;
  if(badKeys) issues.push(badKeys+' CODE(S) NOT IN THE XXXXX-XXXXX-XXXXX-XXXXX FORMAT');
  return issues.length ? stWarn(issues) : stOk();
}
var DATA_CHECKS = {
  personality: function(d){
    if(!isObj(d)) return stBad('MUST BE AN OBJECT');
    if(!Array.isArray(d.easter_eggs)) return stBad('easter_eggs MUST BE A LIST');
    if(!Array.isArray(d.denied)) return stBad('denied MUST BE A LIST');
    var a = d.admin_triggers;
    if(!isObj(a) || !Array.isArray(a.keywords) || !Array.isArray(a.responses)) return stBad('admin_triggers NEEDS keywords AND responses LISTS');
    var bad = d.easter_eggs.filter(function(e){ return !isObj(e) || !Array.isArray(e.keys) || !(Array.isArray(e.variants) || Array.isArray(e.lines)); }).length;
    return bad ? stWarn([bad+' EASTER EGG(S) MALFORMED (NEED keys AND variants)']) : stOk();
  },
  lore: checkLogFile,
  devlogs: checkLogFile,
  nodes: function(d){
    if(!isObj(d)) return stBad('MUST BE AN OBJECT');
    if(!isObj(d.tree) || !Array.isArray(d.tree.children)) return stBad('tree.children IS MISSING');
    if(!d.tree.children.some(function(c){ return isObj(c) && c.tier === 1 && c.type === 'folder'; })) return stBad('NO LEVEL 1 ARCHIVE ROOT');
    var issues = [], ids = {}, dup = 0, items = [];
    (function walk(it){ if(!isObj(it)) return; if(it.id){ if(ids[it.id]) dup++; ids[it.id] = true; } items.push(it); (it.children || []).forEach(walk); })(d.tree);
    var dangling = items.filter(function(it){ return it.type === 'gateway' && !ids[it.goto]; }).length;
    var landing = isObj(d.screens) && Object.keys(d.screens).some(function(k){ var sc = d.screens[k]; return sc && sc.node_type === 'chat' && sc.layer === 'l1c' && sc.is_root; });
    if(!landing) issues.push('NO LAYER 1 CHAT (LANDING) SCREEN');
    var noColors = ['l1a','l2a','l3a'].filter(function(k){ return !isObj(d.layers) || !isObj(d.layers[k]) || !isObj(d.layers[k].colors) || !d.layers[k].colors.primary; });
    if(noColors.length) issues.push('COLORS MISSING FOR '+noColors.join(', ').toUpperCase()+' (BUILT-IN COLORS USED)');
    if(dup) issues.push(dup+' DUPLICATE ID(S)');
    if(dangling) issues.push(dangling+' GATEWAY(S) POINT NOWHERE');
    return issues.length ? stWarn(issues) : stOk();
  },
  engine: function(d){
    if(!isObj(d)) return stBad('MUST BE AN OBJECT');
    if(!isObj(d.typing) || !isObj(d.timing)) return stBad('typing AND timing ARE REQUIRED');
    var issues = [];
    if(!Array.isArray(d.idle_messages)) issues.push('idle_messages SHOULD BE A LIST');
    return issues.length ? stWarn(issues) : stOk();
  }
};
// Fetches one data file, records its status, and hands the parsed data (or null) to apply().
// An invalid file is treated as unavailable so the rest of the engine only ever sees usable data.
function loadDataFile(key, file, apply){
  function finish(d){ try{ apply(d); }catch(e){ FILE_STATUS[key] = {state:'invalid', detail:'FAILED WHILE LOADING: '+(e && e.message || e)}; try{ apply(null); }catch(e2){} } }
  return fetch('./terminal-data/'+file+'?v='+Date.now()).then(function(r){
    if(!r.ok){ FILE_STATUS[key] = {state:'missing', detail:'HTTP '+r.status}; return null; }
    return r.text().then(function(t){
      var d;
      try{ d = JSON.parse(decryptIfNeeded(t)); }catch(e){ FILE_STATUS[key] = {state:'broken', detail:'NOT VALID JSON ('+e.message+')'}; return null; }
      var v = DATA_CHECKS[key](d); FILE_STATUS[key] = v;
      return v.state === 'invalid' ? null : d;
    });
  }, function(){ FILE_STATUS[key] = {state:'missing', detail:'COULD NOT BE LOADED'}; return null; }).then(finish, function(){ FILE_STATUS[key] = {state:'broken', detail:'COULD NOT BE READ'}; finish(null); });
}
function fetchAllData(){
  loadDataFile('engine', 'engine_config.json', function(d){ engineConfig = d; applyEngineConfig(d); _engReady = true; });
  loadDataFile('nodes', 'echo-os.json', function(d){ osData = d; archData = d ? buildArchFromOS(d) : null; _archReady = true; refreshLayerStyles(); });
  loadDataFile('lore', 'lore.json', function(d){ loreData = d; _lorReady = true; });
  loadDataFile('devlogs', 'dev_logs.json', function(d){ devLogs = d; _devReady = true; });
  loadDataFile('personality', 'personality.json', function(d){ personality = d; applyPersonality(d); _perReady = true; });
}

function applyEngineConfig(c){
  if(!c) return;
  if(c.idle_messages)     CFG_IDLE_MSGS    = c.idle_messages;
  if(c.idle_delay_ms)     CFG_IDLE_MS      = c.idle_delay_ms;
  if(c.idle_fade_ms)      CFG_IDLE_FADE    = c.idle_fade_ms;
  if(c.slow_words)        CFG_SLOW_WORDS   = c.slow_words;
  if(c.typing)            CFG_TYPING       = c.typing;
  if(c.audio&&c.audio.master_volume) CFG_VOLUME  = c.audio.master_volume;
  if(c.audio&&c.audio.ambient)       CFG_AMBIENT = c.audio.ambient;   // legacy
  if(c.timing)            CFG_TIMING       = c.timing;
  if(c.power_button_text) CFG_POWER_BTN    = c.power_button_text;
  if(c.version_string)    CFG_VERSION      = c.version_string;
  if(c.terminal_title)    CFG_TITLE        = c.terminal_title;
  if(c.terminal_strings)  Object.assign(CFG_STRINGS, c.terminal_strings);
  // l2a_intro, l3a_intro removed — content lives in the L2A_INTRO/L3A_INTRO screens in echo-os.json
  // Update visible UI if already rendered
  var btn=document.getElementById('power-btn');if(btn&&CFG_POWER_BTN) btn.textContent=CFG_POWER_BTN;
  // Version display is the live commit ID only — engine_config's
  // version_string is never shown; the placeholder dashes stay until
  // (unless) the commit fetch resolves.
  var sub=document.getElementById('power-sub');
  if(sub){var subParts=[];if(CFG_TITLE)subParts.push(CFG_TITLE);if(_commitVer)subParts.push(_commitVer);if(subParts.length)sub.textContent=subParts.join(' // ');}
  var ver=document.getElementById('t-version');if(ver&&_commitVer) ver.textContent=_commitVer;
  var ttl=document.getElementById('t-title');if(ttl&&CFG_TITLE) ttl.textContent=CFG_TITLE;
  if(typeof updPhosphorCSS==='function') updPhosphorCSS();
  // Colors and ambient sound belong to each layer (echo-os.json, layers); a legacy theme block still fills in for a layer with none.
  if(c.theme) CFG_THEME_LEGACY = c.theme;
  refreshLayerStyles();
}

// After an author edit: the header shows the title of the layer you are in (the chat keeps terminal_title).
function refreshHeaderTitle(){ if(termState !== 'L1_NORMAL' && !overrideActive) titleEl.textContent = getLayerTitle('l'+currentLevel+'a',''); }
// The colors for each layer (l1a is the page, l2a and l3a override it by body class) from layers.<id>.colors in echo-os.json.
// Called after either data file loads and after every author edit, so a change shows at once.
var LAYER_STYLE_KEYS = ['l1c','l1a','l2a','l3a'];   // the chat paints :root; each archive layer paints its own body class
function refreshLayerStyles(){
  var theme = {};
  LAYER_STYLE_KEYS.forEach(function(k){
    var L = osData && osData.layers && osData.layers[k];
    var t = (L && L.colors && L.colors.primary) ? L.colors : (CFG_THEME_LEGACY && CFG_THEME_LEGACY[k]);
    if(t && t.primary) theme[k] = t;
  });
  if(!theme.l1c && theme.l1a) theme.l1c = theme.l1a;   // data without chat colors: the chat looks like the archive, as before
  applyThemeColors(theme);
}

// '#4fc3f7' to '79,195,247'
function hexRgb(hex){hex=(hex||'#000').replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];return parseInt(hex.slice(0,2),16)+','+parseInt(hex.slice(2,4),16)+','+parseInt(hex.slice(4,6),16);}
// The theme variables of one layer as an inline style, so a floating window can wear the colors of the layer it edits.
function layerThemeVars(layerId){
  var L=osData&&osData.layers&&osData.layers[layerId], t=L&&L.colors;
  if(!t||!t.primary) return '';
  var rgb=hexRgb(t.primary);
  return '--theme-full:'+t.primary+';--theme-dim:rgba('+rgb+','+(t.dim_opacity||0.7)+');--theme-lo:rgba('+rgb+','+(t.lo_opacity||0.4)+');'+
    '--theme-border:rgba('+rgb+','+Math.max(t.border_opacity||0.12,0.22)+');--theme-bc:rgba('+rgb+',0.36);--theme-glow-a:rgba('+rgb+',0.20);'+
    (t.warn?'--theme-warn:'+t.warn+';':'')+(t.denied?'--theme-denied:'+t.denied+';':'')+((t.glitch||t.denied)?'--theme-glitch:'+(t.glitch||t.denied)+';':'')+(t.background?'--theme-bgsolid:'+t.background+';':'');
}
function applyThemeColors(theme){
  function hexToRgb(hex){hex=(hex||'#000').replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];return parseInt(hex.slice(0,2),16)+','+parseInt(hex.slice(2,4),16)+','+parseInt(hex.slice(4,6),16);}
  var layerMap={l1a:'layer-1a',l2a:'layer-2a',l3a:'layer-3a'};
  var varMap={l1a:'',l2a:'body.layer-2a',l3a:'body.layer-3a'};
  var existing=document.getElementById('theme-overrides');if(existing)existing.remove();
  var css='';
  LAYER_STYLE_KEYS.forEach(function(lv){
    var t=theme[lv];if(!t)return;var p=t.primary;if(!p)return;
    var rgb=hexToRgb(p);
    // l1a is :root; the others get their own body.layer-<suffix> block.
    var selector=lv==='l1c'?':root':'body.layer-'+lv.slice(1);
    var dimOp=t.dim_opacity||0.70;var loOp=t.lo_opacity||0.40;var bdrOp=t.border_opacity||0.12;
    css+=selector+'{';
    if(p)css+='--theme-full:'+p+';';
    if(p)css+='--theme-dim:rgba('+rgb+','+dimOp+');';
    if(p)css+='--theme-lo:rgba('+rgb+','+loOp+');';
    if(t.warn)css+='--theme-warn:'+t.warn+';';
    if(t.denied)css+='--theme-denied:'+t.denied+';';
    if(t.glitch||t.denied)css+='--theme-glitch:'+(t.glitch||t.denied)+';';
    if(t.background)css+='--theme-bgsolid:'+t.background+';';
    if(p)css+='--theme-border:rgba('+rgb+','+bdrOp+');';
    // The chat and the L1 archive have no stylesheet block of their own, so the rest of their palette comes from the primary color too.
    if(p&&(lv==='l1c'||lv==='l1a'))css+='--theme-bc:rgba('+rgb+',0.36);--theme-irow:rgba('+rgb+',0.08);';
    css+='}';
  });
  if(css){var s=document.createElement('style');s.id='theme-overrides';s.textContent=css;document.head.appendChild(s);}
}

function applyPersonality(p){
  if(p&&p.easter_eggs)  EASTER_EGGS = p.easter_eggs;
  if(p&&p.denied)       DENIED      = p.denied;
  if(p&&p.admin_triggers){
    if(p.admin_triggers.keywords)  ADMIN_KW   = p.admin_triggers.keywords;
    if(p.admin_triggers.responses) ADMIN_RESP = p.admin_triggers.responses;
  }
  // self_destruct handled by personality.json — terminal does not execute it
}

// ── GAME STATE ────────────────────────────────────────────────────────────────
// Named flags that programs set (echo_state in the browser). An item with "requires": ["flag", "!other"] only exists while every flag
// is on (a leading ! means off): it is not listed, its alias does not work and it has no page. Setting a flag rebuilds the tree, and
// each gated item that appears is announced (RECEIVED) when the program that set the flag closes. Author mode sees everything.
var gameState = {flags:{}};
try{ var _gs = JSON.parse(localStorage.getItem('echo_state')||'null'); if(_gs && _gs.flags) gameState = _gs; }catch(e){}
function saveGameState(){ try{ localStorage.setItem('echo_state', JSON.stringify(gameState)); }catch(e){} }
function flagOn(n){ return !!gameState.flags[n]; }
function flagsMet(list){
  if(!list || !list.length || authorMode) return true;
  return list.every(function(f){ f = String(f).trim(); return f.charAt(0) === '!' ? !flagOn(f.slice(1)) : flagOn(f); });
}
function gatedOut(it){ return !!(it && it.requires && it.requires.length) && !flagsMet(it.requires); }
var pendingNotices = [];
function setFlag(name, value){
  name = String(name).trim(); if(!name) return false;
  if(value === undefined) value = true;
  var off = value === false || value === null, before = gameState.flags[name];
  if(off ? before === undefined : before === value) return false;
  var was = {};
  Object.keys(osItems).forEach(function(id){ var it = osItems[id]; if(it.requires && it.requires.length) was[id] = !gatedOut(it); });
  if(off) delete gameState.flags[name]; else gameState.flags[name] = value;
  saveGameState();
  if(osData) archData = buildArchFromOS(osData);
  Object.keys(was).forEach(function(id){ var it = osItems[id]; if(it && !was[id] && !gatedOut(it)) pendingNotices.push(it); });
  return true;
}
function resetGameState(){
  gameState = {flags:{}}; discovered = {}; miscUnlocks = {}; pendingNotices = [];
  try{ localStorage.removeItem('echo_state'); localStorage.removeItem('echo_disc'); localStorage.removeItem('echo_misc'); }catch(e){}
  if(osData) archData = buildArchFromOS(osData);
}
async function flushNotices(){
  while(pendingNotices.length){
    var it = pendingNotices.shift();
    var el = addLine('full', true); playEggTone(); await put(el, it.notice || (CFG_STRINGS.item_received + (it.alias || '[' + it.name + ']')), 'status');
  }
}
// A folder lists a child unless it is hidden or a stub. A gateway is never listed. A program is listed only when set to be (hidden: false).
function isListed(c){ if(c.stub || c.type === 'gateway') return false; if(c.type === 'program') return c.hidden === false; return !c.hidden; }

function clearInverts(){termInput.classList.remove('inverted');output.querySelectorAll('.t-line.inverted').forEach(function(el){el.classList.remove('inverted');});}
function updateInvertHighlight(){
  clearInverts();
  var val=termInput.value.trim().toUpperCase();if(!val)return;
  for(var i=0;i<currentMenuOpts.length;i++){
    if(currentMenuOpts[i]===val){
      termInput.classList.add('inverted');
      Array.from(output.children).forEach(function(el){if(el.dataset&&el.dataset.cmd===currentMenuOpts[i])el.classList.add('inverted');});
      return;
    }
  }
  // Not listed on this page, but a real command all the same (hidden, global, built in): light the field. Finding a
  // command nobody listed, like one printed on an Echo card, should feel like finding something.
  if(isKnownCommand(val)) termInput.classList.add('inverted');
}
// Is this typed text a command the terminal would act on right now? The same lookups the input router makes, without
// running anything. Used to highlight the input field.
function isKnownCommand(val){
  if(!/^\[.+\]$/.test(val)||termState==='PROGRAM'||progWin) return false;
  if(overrideActive) return /^\[(STATUS|LEGEND|TREE|EXIT|JUMP L[123])\]$/.test(val);   // the override menu, nothing else
  if(val==='[SYSTEM OVERRIDE]') return true;                                            // works from anywhere
  if(val==='[AUTHOR UNLOCK]') return !osLocked();
  if(authorMode&&(val==='[AUTHOR LOCK]'||(authorMod&&authorMod.recognizes(val)))) return true;
  val=openToAlias(val);
  if(val==='[HELP]'||val==='[TREE]'||val==='[CLEAR]') return true;
  if(termState==='L1_NORMAL') return isChatCommand(val);   // the chat's own commands, hidden aliases and programs
  if(val==='[LS]'||val==='[BACK]'||val==='[ROOT]'||val==='[EXIT]') return true;
  if(osPrograms[val]||findHiddenAlias(val)) return true;
  if(archData&&archData.nodes){   // global commands, in this layer
    var lid=currentLayerId();
    return Object.keys(archData.nodes).some(function(nid){
      var n=archData.nodes[nid];
      if(n.node_type!=='global'||(n.layer_scope&&n.layer_scope!==lid)) return false;
      return (n.body||[]).some(function(b){return b.type==='command'&&(b.label||'').trim()===val;});
    });
  }
  return false;
}

function pageBody(node){
  if(!node) return [];
  var body = node.body || [];
  return (authorMode && node.author_list && node.author_list.length) ? withAuthorList(body, node.author_list) : body;
}
// Author view: the tree's entries (hidden, stubs, programs, gateways included) replace the player's list.
function withAuthorList(body, list){
  var out = [], placed = false;
  function place(){
    list.forEach(function(a){ out.push({type:'command', cmd_type:'navigation', label:a.label, target:a.target, kind:a.kind, osId:a.osId, dim:a.dim, stub:a.stub, special:a.special}); });
    placed = true;
  }
  body.forEach(function(b){
    if(b.type === 'command' && b.osId){ if(!placed) place(); return; }
    if(b.type === 'command' && !placed) place();
    out.push(b);
  });
  if(!placed) place();
  return out;
}
// ── ECHOES O.S. TREE -> PAGE STRUCTURE ─────────────────────────────────────────
// echo-os.json is a filesystem tree (folders, docs, hidden items, tiers). The page
// renderer reads archData.nodes, so this builds that view once at load: each visible
// child becomes a navigation entry, and [BACK] / [EXIT] are generated per page instead
// of being hand-wired. Hidden items get no entry but stay reachable by alias; stubs
// (planned, empty items) are left out entirely.
var osItems = {};      // id -> tree item, every item
var osHidden = {};     // UPPERCASE alias -> id, hidden items and gateways
var osHiddenLoose = {}; // the same aliases with hyphens and spacing ignored, so [INITIATE CHRONO ZERO PROTOCOL] finds [INITIATE CHRONO-ZERO PROTOCOL]
function aliasKey(a){ return String(a).trim().toUpperCase().replace(/[-\s]+/g,' '); }
var osPrograms = {};   // UPPERCASE alias -> [program items]
function buildArchFromOS(os){
  var nodes = {};
  osItems = {}; osHidden = {}; osHiddenLoose = {}; osPrograms = {};
  var screens = os.screens || {};
  Object.keys(screens).forEach(function(id){ nodes[id] = screens[id]; });
  (os.commands || []).forEach(function(c, i){
    nodes['OS_CMD_'+i] = {layer:'l1a', node_type:'global', layer_scope:c.scope||null, title:'', body:[{type:'command', cmd_type:c.kind||'pull', label:c.alias, target:c.screen}]};
  });
  function walk(it, parentId, crumb){
    osItems[it.id] = it;
    it._parent = parentId;
    if(it.stub) return;
    if(gatedOut(it)) return;   // not there yet: no entry, no alias, no page
    // Programs and gateways are invoked by alias, never drawn as pages or listed as menu entries.
    if(it.type === 'program'){ (osPrograms[it.alias.trim().toUpperCase()] = osPrograms[it.alias.trim().toUpperCase()] || []).push(it); return; }
    if(it.type === 'gateway'){ osHidden[it.alias.trim().toUpperCase()] = it.id; osHiddenLoose[aliasKey(it.alias)] = it.id; return; }
    var isTierRoot = parentId === null;
    var cmds = [];
    (it.children || []).forEach(function(c){
      if(!isListed(c) || gatedOut(c)) return;
      cmds.push({type:'command', cmd_type:'navigation', label:c.alias || ('['+c.name+']'), target:(c.type === 'program' ? '__PROGRAM__' : c.id), kind:c.type, osId:c.id});
    });
    (it.commands || []).forEach(function(c){ cmds.push({type:'command', cmd_type:'navigation', label:c.label, target:c.goto}); });
    cmds.push(isTierRoot ? {type:'command', cmd_type:'navigation', label:'[EXIT]', target:'__EXIT__', kind:'up'}
                         : {type:'command', cmd_type:'navigation', label:'[BACK]', target:'__BACK__', kind:'up'});
    var title = it.title || it.name;
    nodes[it.id] = {
      layer:'l'+it.tier+'a', node_type:'standard', is_root:isTierRoot,
      title:title, breadcrumb:crumb, footer:it.footer || '', hidden:!!it.hidden, parent:parentId,
      // Every child, hidden or not: author mode lists them all (dimmed when unlisted).
      author_list:(it.children || []).map(function(c){
        var sp = c.type === 'gateway' || (c.type === 'program' && c.hidden !== false);
        return {label:c.alias || ('['+c.name+']'), target:c.id, kind:c.type, osId:c.id, dim:!!(c.hidden || c.stub || sp), stub:!!c.stub, special:sp};
      }),
      body:(it.body || []).concat(cmds)
    };
    if(it.hidden && it.alias){ osHidden[it.alias.trim().toUpperCase()] = it.id; osHiddenLoose[aliasKey(it.alias)] = it.id; }
    (it.children || []).forEach(function(c){ walk(c, it.id, crumb+' > '+(c.title || c.name)); });
  }
  ((os.tree && os.tree.children) || []).forEach(function(r){
    var lyr = os.layers && (os.layers['l'+r.tier+'c'] || os.layers['l'+r.tier+'a']);
    walk(r, null, ((lyr && lyr.header_title) ? lyr.header_title+' > ' : '') + (r.title || r.name));
  });
  return {layers:os.layers || {}, nodes:nodes};
}

// Find the root node for a given layer ID by looking for is_root:true in the adapted echo-os.json tree
function layerRootId(layerIdOrLevel){
  var lid=typeof layerIdOrLevel==='number'?'l'+layerIdOrLevel+'a':layerIdOrLevel;
  if(!archData||!archData.nodes) return null;
  var found=null;
  Object.keys(archData.nodes).forEach(function(nid){
    var n=archData.nodes[nid];
    if(n.layer===lid&&n.is_root) found=nid;
  });
  return found;
}


// ── DYNAMIC LINE RESOLVER ─────────────────────────────────────────────────────
var DYN_PAD = 30;
function resolveDynamic(b){
  var variable = b.variable||'';
  var label = (b.display_label||variable||'').padEnd(DYN_PAD,' ');
  var okText    = b.valid_text  || 'OK';
  var errText   = b.denied_text || 'ERROR';
  var labelCls  = b.label_cls   || b.cls || 'dim';
  var valueCls  = b.value_cls   || 'full';
  var ok, val, cls;
  if(variable.indexOf('file_status.')===0){ok=null;}   // drawn below from the file's status
  else if(variable==='system.boot_status'){
    var fails=window._bootFailCount||0, warns=window._bootWarnCount||0;
    if(fails) val=errText+' \u2014 '+fails+' SUBSYSTEM'+(fails===1?'':'S')+' OFFLINE'+(warns?', '+warns+' WARNING'+(warns===1?'':'S'):'');
    else if(warns) val=okText+' \u2014 '+warns+' WARNING'+(warns===1?'':'S');
    else val=okText;
    cls=(fails||warns)?'warn':valueCls;
    return{text:'> '+val,cls:cls};
  }
  else if(variable==='session.level'){return{text:'> '+label+String(currentLevel),cls:labelCls};}
  else if(variable==='session.node'){return{text:'> '+label+termState,cls:labelCls};}
  else if(variable==='session.discovered'){return{text:'> '+label+String(discoveredCount()),cls:labelCls};}
  else if(variable==='session.l3_visited'){return{text:'> '+label+(l3Visited?'TRUE':'FALSE'),cls:labelCls};}
  else if(variable==='node.title'){var cn=archData&&archData.nodes&&archData.nodes[termState];return{text:'> '+label+(cn?cn.title||'\u2014':'\u2014'),cls:labelCls};}
  else if(variable==='node.layer'){var cn2=archData&&archData.nodes&&archData.nodes[termState];return{text:'> '+label+(cn2?cn2.layer||'\u2014':'\u2014'),cls:labelCls};}
  else{return{text:'> '+label+'[?]',cls:'low'};}
  // file_status variables: segmented line. Label, then [STATUS] (green for OK, amber for WARN, red for anything
  // that makes the file unusable), then that file's own commit ID in orange glow. The commit shows an
  // em-dash until (unless) its GitHub API fetch resolves.
  var fileKey = variable.split('.')[1];
  var state = fileState(fileKey);
  val = '['+(state==='ok' ? okText : statusLabel(state))+']';
  cls = state==='ok' ? valueCls : state==='warn' ? 'warn' : 'denied';
  var sha = _fileCommits && _fileCommits[fileKey];
  return{
    text:'> '+label+val+' '+(sha||'\u2014'),
    cls:cls, ok:state==='ok',
    parts:[
      {text:'> '+label, cls:labelCls},
      {text:val, cls: state==='ok'?'ok':state==='warn'?'warn':'denied'},
      {text:' '+(sha||'\u2014'), cls:'commit'}
    ]

// Renders a resolved dynamic line into an element — segmented (multi-color

async function renderArchivePage(nodeId, notes){

// ── ARCHIVE INPUT ROUTER ──────────────────────────────────────────────────────
async function handleArchiveInput(val){
  var typed=val; val=openToAlias(val);
  // Close log-entry overlay if present
  if(window._logOverlay){try{window._logOverlay.parentNode.removeChild(window._logOverlay);}catch(e){}window._logOverlay=null;}

  // 1. LOCAL PRIORITY — match against current node's body[] commands
  if(archData&&archData.nodes&&archData.nodes[termState]){
    var node=archData.nodes[termState];var match=null;
    (node.body||[]).forEach(function(b){
      if(b.type==='command'&&(b.cmd_type==='navigation'||b.cmd_type==='loop')&&(b.label||'').trim()===val)match=b;
    });
    if(match){
      var u=addLine('user');u.textContent='> '+typed;isResponding=true;var target=match.target;
      if(target==='__EXIT__'){await handleExit();}
      else if(target==='__BACK__'){await handleBack();}
      else if(target==='__ROOT__'){await handleRoot();}
      else if(target==='__TRANSITION_L2A__'){if(l1ChatBackup===null)l1ChatBackup=snapOutput();await transitionToL2();isResponding=false;var r2=layerRootId('l2a');if(r2)await renderArchivePage(r2);}
      else if(target==='__TRANSITION_L3A__'){await transitionToL3();isResponding=false;var r3=layerRootId('l3a');if(r3)await renderArchivePage(r3);}
      else if(target==='__PROGRAM__'){if(!(await tryAliasCommand(val.toUpperCase()))){isResponding=false;await showInvalidSelection();}}
      else if(archData.nodes[target]){isResponding=false;await renderArchivePage(target);}
      else{isResponding=false;await showInvalidSelection();}
      return;
    }
  }

  // 2. GLOBAL FALLBACK — check global nodes (local had no match)
  var uG=addLine('user');uG.textContent='> '+typed;
  isResponding=true;
  if(await tryAliasCommand(val)) return;
  var builtin=await tryBuiltin(val,true);
  if(builtin==='page') return;
  var globalHandled=builtin||await checkGlobalCommand(val);
  if(globalHandled){
    var plG=addLine('low');await put(plG,'> AWAITING INPUT','prompt');setActiveCursor(plG);
    isResponding=false;output.scrollTop=output.scrollHeight;termInput.focus();return;
  }

  // 3. No match anywhere
  isResponding=false;
  await showInvalidSelection();
}

// ── PROGRAMS ──────────────────────────────────────────────────────────────────
// A program is a module at terminal-data/programs/<id>.js exporting default { run(ctx) }.
// Program items sit in the tree (type 'program': alias, tier, scope, program id) and are
// invoked by alias. scope 'tier' = any page of that tier; 'folder' = only on the page of
// the folder the item sits in. Outside its allowed place a program answers "unavailable".
// run() may return 'stay' (just reprint the prompt), 'reset' (it reset the terminal), or
// nothing (the engine redraws the page the player was on).
var progCache = {};
var progWait  = null;   // pending ctx.ask(): {resolve}
var inputMask = null;   // 'code' = auto-hyphenate XXXXX-XXXXX-XXXXX-XXXXX
