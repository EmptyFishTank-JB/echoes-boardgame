function inputBusy(){ return isResponding || uiLock > 0; }
async function withLock(fn){ uiLock++; try{ return await fn(); } finally{ uiLock--; } }

// Code-mask prompts (ctx.ask({mask:'code'})) format as XXXXX-XXXXX-XXXXX-XXXXX while typing.
termInput.addEventListener('input',function(){
  if(inputMask!=='code') return;
  var raw=this.value.replace(/-/g,'').replace(/[^A-Z0-9]/gi,'').toUpperCase().slice(0,20);
  var out='';for(var i=0;i<raw.length;i++){if(i===5||i===10||i===15)out+='-';out+=raw[i];}
  this.value=out;
});

async function loadProgram(id){

  catch(e){ return null; }
}
// Waits for the next submitted line. The render lock is released while waiting (so the
// player can type) and retaken when the answer arrives. Resolves '' if canceled.
function ctxAsk(opts){
  opts = opts || {};

    var held = uiLock > 0, wasResp = isResponding;
    if(held) uiLock--;
    isResponding = false;
    progWait = {sticky:!!opts.sticky, resolve:function(v){ if(held) uiLock++; isResponding = wasResp; resolve(v); }};
    termState = 'PROGRAM'; currentMenuOpts = []; menuSelIdx = -1;
    termInput.value = ''; termInput.placeholder = opts.placeholder || ''; inputMask = opts.mask || null;
    updateInvertHighlight(); setActiveCursor(output.lastElementChild); termInput.focus();
  });
}
function makeProgramCtx(item, prog){

    // fill win.body and await win.closed. Esc and the [X] close it.

    recovered: function(){ return Object.keys(discovered).map(function(k){ return {code:k, sd:discovered[k].sd, ts:discovered[k].ts}; }).sort(function(a, b){ return a.ts - b.ts; }); },
    sound: {click:playClick, backspace:playBackspace, enter:playEnter, denied:playDenied, line:playLineStatic, tone:playEggTone, pip:playNavPip},
    say: async function(text, cls){ var el = addLine(cls || 'dim', true); await put(el, text,'status'); },

var progWin = null;   // the open program window, if any
function openProgWindow(opts, item, prog){
  if(progWin) progWin.close();

  var exe = opts.exe || (prog && prog.exe) || (item && item.program ? item.program + '.exe' : '');

    setTitle: function(t){ ttl.textContent = String(t).toUpperCase(); },

    focus: function(el){ setTimeout(function(){ try{ el.focus(); }catch(e){} }, 40); },

async function runProgram(item){

// ── AUTHOR DIALOG FRAME ───────────────────────────────────────────────────────
// A floating window (not modal: the page behind stays usable) that the author tools fill with controls. It is movable by its

  opts = opts || {};

  var el = document.createElement('div'); el.className = 'ed-dlg'; el.setAttribute('role', 'dialog');
  function sp(cls, text){ var e = document.createElement('span'); e.className = cls; if(text != null) e.textContent = text; return e; }
  var bar = document.createElement('div'); bar.className = 'ed-bar';
  var ttl = sp('ttl', String(opts.title || 'EDIT').toUpperCase()), sub = sp('sub', opts.sub || ''), x = sp('x', '[X]'); x.title = 'Close (Esc)';

    el: el, body: body, foot: foot, key: opts.key || null, closed: false,
    setTitle: function(t){ ttl.textContent = String(t).toUpperCase(); },

    style: function(css){ var st = document.createElement('style'); st.textContent = css; el.appendChild(st); },
    // Wear the colors of a layer (l1c, l1a, l2a or l3a), as set in echo-os.json right now.

    close: function(){

  return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'") '+hx+' '+hy+', '+fb;
}
function updateCursors(){
  var c = (getComputedStyle(document.body).getPropertyValue('--theme-full') || '').trim() || '#4fc3f7';
  var glow = "stroke='"+c+"' stroke-opacity='0.28' stroke-width='3.6' fill='none' stroke-linejoin='round' stroke-linecap='round'";
  var ln = "stroke='"+c+"' stroke-width='1.3' fill='none' stroke-linejoin='round' stroke-linecap='round'";
  var arrow = 'M2.5 2.5 L2.5 18 L6.6 14.2 L9.6 21 L12.3 19.8 L9.3 13.2 L15 13.2 Z';
  var def = "<path d='"+arrow+"' "+glow+"/><path d='"+arrow+"' fill='rgba(0,8,14,0.75)' stroke='"+c+"' stroke-width='1.3' stroke-linejoin='round'/><circle cx='2.5' cy='2.5' r='1.6' fill='"+c+"'/>";
  var brk = 'M8 4 H3.5 V20 H8 M16 4 H20.5 V20 H16';
  var tick = 'M12 6.5 V9 M12 15 V17.5 M6.5 12 H9 M15 12 H17.5';
  var act = "<path d='"+brk+"' "+glow+"/><path d='"+brk+"' "+ln+"/><path d='"+tick+"' "+ln+"/><circle cx='12' cy='12' r='1.7' fill='"+c+"'/>";

// Author context menu: right-click an item for its edit commands, empty space for the create commands.
var ctxEl = null;
function ctxClose(){ if(!ctxEl) return; ctxEl.remove(); ctxEl = null; hoverOff(); }   // only when a menu was open: scrolling or blurring must not wipe a hover highlight
function ctxOpen(x, y, title, entries){
  ctxClose();
  var m = document.createElement('div'); m.id = 'ctx';
  var h = document.createElement('div'); h.className = 'ch'; h.textContent = title; m.appendChild(h);
  entries.forEach(function(en){
    if(en === '-'){ var s = document.createElement('div'); s.className = 'cs'; m.appendChild(s); return; }
    var d = document.createElement('div');
    if(en.info){
      // A row of facts about the item. With a command it is clickable and starts editing that property.
      d.className = 'cr ' + (en.cmd ? 'ed' : 'ro');
      var k = document.createElement('span'); k.className = 'ck'; k.textContent = en.key; d.appendChild(k);
      var v = document.createElement('span'); v.className = 'cv'; v.textContent = en.value; v.title = en.value;
      if(en.swatch){ var sw = document.createElement('i'); sw.className = 'sw'; sw.style.background = en.swatch; v.insertBefore(sw, v.firstChild); }
      d.appendChild(v);
    } else {
      d.className = 'ci';
      var a = document.createElement('span'); a.textContent = en.label; d.appendChild(a);
      var b = document.createElement('span'); b.className = 'cc'; b.textContent = en.cmd; d.appendChild(b);
    }
    if(en.cmd){
      d.addEventListener('mouseenter', function(){ if(hoverStash === null) hoverStash = termInput.value; termInput.value = en.cmd; });
      d.addEventListener('mouseleave', hoverOff);
      d.addEventListener('click', function(ev){ ev.stopPropagation(); ctxClose(); uiSubmit(en.cmd, en.preset); });
    }
    m.appendChild(d);
  });
  document.body.appendChild(m);
  var r = m.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 6)) + 'px';
  m.style.top = Math.max(4, Math.min(y, window.innerHeight - r.height - 6)) + 'px';
  ctxEl = m;
}
function itemMenuEntries(it){
  var pre = {target:it.id}, e = [];
  // What the item is, one row per property; click a row to change that property.
  var rows = (authorMod && authorMod.infoRows) ? authorMod.infoRows(it, osItems) : [];
  rows.forEach(function(r){ e.push({info:true, key:r.k, value:r.v, cmd:r.cmd, preset:r.preset}); });
  if(rows.length) e.push('-');
  // A tier root also stands for its layer: colors, title, intro text and sound.
  if(it._parent === null && authorMod && authorMod.layerRows && LAYER_STYLE_KEYS.indexOf('l'+it.tier+'a') >= 0){
    authorMod.layerRows('l'+it.tier+'a', makeAuthorCtx()).forEach(function(r){ e.push({info:true, key:r.k, value:r.v, cmd:r.cmd, preset:r.preset, swatch:r.swatch}); });
    e.push('-');
  }
  if(!it.stub) e.push({label:'OPEN', cmd:it.alias || '['+it.name+']'});
  e.push({label:it.stub ? 'MAKE IT A REAL DOC...' : 'EDIT EVERYTHING...', cmd:'[EDIT]', preset:pre});
  e.push({label:'MOVE...', cmd:'[MV]', preset:pre});
  e.push({label:'DELETE...', cmd:'[RM]', preset:pre});
  return e;
}

// ── EASTER EGG SYSTEM ────────────────────────────────────────────────────────
function pickVariant(egg){
  if(egg.variants){if(egg.weighted){var last=egg.variants[egg.variants.length-1];if(last.weight&&Math.random()<last.weight)return last;var pool=egg.variants.slice(0,egg.variants.length-1);return pool[Math.floor(Math.random()*pool.length)];}return egg.variants[Math.floor(Math.random()*egg.variants.length)];}
  return{lines:egg.lines,cls:egg.cls};
}
function checkEasterEgg(input){var lower=input.toLowerCase();if(!EASTER_EGGS)return null;for(var i=0;i<EASTER_EGGS.length;i++){var egg=EASTER_EGGS[i];if(!egg||!egg.keys)continue;for(var j=0;j<egg.keys.length;j++){if(lower.indexOf(egg.keys[j])>=0)return egg;}}return null;}
function checkAdmin(input){if(!ADMIN_KW)return false;var lower=input.toLowerCase();for(var i=0;i<ADMIN_KW.length;i++){if(lower.indexOf(ADMIN_KW[i])>=0)return true;}return false;}

// ── IDLE ──────────────────────────────────────────────────────────────────────
var idleTimer=null,idleEl=null;
var IDLE_MS_FB=80000,IDLE_FADE_FB=8000;

function resetIdleTimer(){
  clearTimeout(idleTimer);
  if(idleEl){try{idleEl.parentNode&&idleEl.parentNode.removeChild(idleEl);}catch(e){}idleEl=null;}
  idleTimer=setTimeout(showIdleMsg,CFG_IDLE_MS||IDLE_MS_FB);
}
function showIdleMsg(){
  if(overrideActive||termState!=='L1_NORMAL'||typing||inputBusy()){idleTimer=setTimeout(showIdleMsg,CFG_IDLE_MS||IDLE_MS_FB);return;}
  var pool=CFG_IDLE_MSGS;
  if(!pool||!pool.length) return; // no idle messages configured — stay silent
  idleEl=addLine('low',true);idleEl.textContent=pool[Math.floor(Math.random()*pool.length)];
  playIdlePop();
  var fadeMs=(typeof CFG_IDLE_FADE!=='undefined'&&CFG_IDLE_FADE)?CFG_IDLE_FADE:IDLE_FADE_FB;
  idleEl.style.transition='opacity '+fadeMs+'ms ease';
  setTimeout(function(){if(idleEl)idleEl.style.opacity='0';},600);
  setTimeout(function(){if(idleEl&&idleEl.parentNode)try{idleEl.parentNode.removeChild(idleEl);}catch(e){}idleEl=null;},fadeMs+700);

// ── HELP — renders help node body[] ──────────────────────────────────────────
async function renderHelpNode(cmd){
  // If command has a target node, render its body[]
  var nodeId=cmd&&cmd.target?cmd.target:null;
  var node=nodeId&&archData&&archData.nodes&&archData.nodes[nodeId];
  if(!node){
    // Fall back to any node with node_type='help'
    if(archData&&archData.nodes){
      Object.keys(archData.nodes).forEach(function(nid){
        if(archData.nodes[nid].node_type==='help') node=archData.nodes[nid];
      });
    }
  }
  if(!node){
    var errH=addLine('denied');await put(errH,'> ERROR \u2014 HELP NODE NOT CONFIGURED IN NODES.JSON','status');
    return;
  }
  if(node.title){var ht=addLine('full');await put(ht,node.title,'status');await sleep(60);}
  for(var i=0;i<(node.body||[]).length;i++){
    var b=node.body[i];
    if(b.type==='text'){var el=addLine(b.cls||'dim');if(b.text){playLineStatic();await put(el,b.text,'doc');}await sleep(40);}
    else if(b.type==='dynamic'){var dr=resolveDynamic(b);var del=addLine(dr.cls||'dim');await putDyn(del,dr,'doc');await sleep(20);}
  }
}

// ── L1 COMMAND LOOKUP (from archData.l1_commands) ────────────────────────────
async function tryL1Command(val){
  if(!archData||!archData.l1_commands) return false;
  var cmd=null;
  for(var i=0;i<archData.l1_commands.length;i++){if(archData.l1_commands[i].label===val){cmd=archData.l1_commands[i];break;}}
  if(!cmd) return false;

  if(cmd.type==='help'){
    await renderHelpNode(cmd);
    var pl=addLine('low');await put(pl,'> AWAITING INPUT','prompt');setActiveCursor(pl);
    isResponding=false;termInput.focus();return true;
  }
  if(cmd.type==='clear'){output.innerHTML='';isResponding=false;termInput.focus();return true;}
  if(cmd.type==='builtin'){
    if(cmd.target==='__ECHO_ARCHIVE__'||cmd.target==='__ENTER_ARCHIVE__'){
      playEggTone();var ac=addLine('full');if(CFG_STRINGS.layer_enter_confirmed){await put(ac,CFG_STRINGS.layer_enter_confirmed,'flavor');}else{await sleep(280);}await sleep(280);
      isResponding=false;await enterEchoArchive();
      var r1=layerRootId('l1a');if(r1)await renderArchivePage(r1);return true;
    }
    if(cmd.target==='__CLEAR__'){output.innerHTML='';isResponding=false;termInput.focus();return true;}
    return false;
  }
  if(cmd.type==='navigate'&&cmd.target==='__HOME__'){
    var u=addLine('user');u.textContent='> '+val;
    await sleep(900);window.location.href='index.html';return true;
  }
  if(cmd.target&&archData.nodes&&archData.nodes[cmd.target]){
    await enterEchoArchive();isResponding=false;await renderArchivePage(cmd.target);return true;
  }
  var pl2=addLine('low');await put(pl2,'> AWAITING INPUT','prompt');setActiveCursor(pl2);isResponding=false;termInput.focus();return true;
}

// ── L1 BRACKET HANDLER ────────────────────────────────────────────────────────
async function handleL1Bracket(val){
  val=openToAlias(val);
  isResponding=true;
  if(!archData){
    var errN=addLine('denied');await put(errN,CFG_STRINGS.error_nav_offline,'status');
    var plN=addLine('low');await put(plN,'> AWAITING INPUT','prompt');setActiveCursor(plN);isResponding=false;termInput.focus();return;
  }

  // 1. l1_commands backward compat
  var handled=await tryL1Command(val);
  if(handled) return;

  // 2. L1 chat root node body[] commands (hidden or visible — all active in chat state)
  var chatNodeId=findChatRootNode('l1c');
  if(chatNodeId&&archData.nodes[chatNodeId]){
    var chatNode=archData.nodes[chatNodeId];var chatMatch=null;
    (chatNode.body||[]).forEach(function(b){
      if(b.type==='command'&&(b.label||'').trim()===val) chatMatch=b;
    });
    if(chatMatch){
      var ct=chatMatch.cmd_type||'navigation';var tgt=chatMatch.target;
      if(ct==='pull'){
        await renderPullInline(tgt);
        var plP=addLine('low');await put(plP,'> AWAITING INPUT','prompt');setActiveCursor(plP);
        isResponding=false;termInput.focus();return;
      }else{
        // Navigation — enter archive mode
        if(tgt==='__EXIT__'||tgt==='__BACK__'||!tgt){isResponding=false;termInput.focus();return;}
        if(tgt==='__TRANSITION_L2A__'){if(l1ChatBackup===null)l1ChatBackup=snapOutput();await transitionToL2();isResponding=false;var rr2=layerRootId('l2a');if(rr2)await renderArchivePage(rr2);return;}
        if(tgt==='__TRANSITION_L3A__'){await transitionToL3();isResponding=false;var rr3=layerRootId('l3a');if(rr3)await renderArchivePage(rr3);return;}
        if(archData.nodes[tgt]){await enterEchoArchive();isResponding=false;await renderArchivePage(tgt);return;}
      }
    }
  }

  // 3. Hidden items by alias, then built-ins, then global node fallback
  if(await tryAliasCommand(val)) return;
  var builtinC=await tryBuiltin(val,false);
  var globalHandled=builtinC||await checkGlobalCommand(val);
  if(globalHandled){
    var plG=addLine('low');await put(plG,'> AWAITING INPUT','prompt');setActiveCursor(plG);
    isResponding=false;output.scrollTop=output.scrollHeight;termInput.focus();return;
  }

  // 4. Unrecognized
  playDenied();
  var errB=addLine('denied');await put(errB,CFG_STRINGS.error_cmd_not_recognized,'status');
  var pl=addLine('low');await put(pl,'> AWAITING INPUT','prompt');setActiveCursor(pl);isResponding=false;output.scrollTop=output.scrollHeight;termInput.focus();
}

// ── L1 NORMAL INPUT ───────────────────────────────────────────────────────────
async function handleL1Input(val){
  resetIdleTimer();

  // Require personality.json for all chat responses
  if(!personality){
    isResponding=true;var uE=addLine('user');uE.textContent='> '+val;
    await sleep(120);var errP=addLine('denied');await put(errP,CFG_STRINGS.error_personality_offline,'status');
    var plE=addLine('low');await put(plE,'> AWAITING INPUT','prompt');setActiveCursor(plE);isResponding=false;termInput.focus();return;
  }

  // Bracket commands this layer really defines win over the admin keyword scan,
  // otherwise "[L2 ROOT]" and "[L3 ROOT]" trip the "root" keyword. Unknown brackets still fall through to it.
  if(/^\[.+\]$/.test(val)&&isChatCommand(val)){var uC=addLine('user');uC.textContent='> '+val;await handleL1Bracket(val);return;}

  // ADMIN check — responses from personality.json
  if(checkAdmin(val)){
    isResponding=true;var u=addLine('user');u.textContent='> '+val;
    await sleep(120);playDenied();
    var pick=ADMIN_RESP[Math.floor(Math.random()*ADMIN_RESP.length)];
    for(var i=0;i<pick.length;i++){if(overrideActive)return;playThinkHum(200);await sleep(200);if(overrideActive)return;var el=addLine(i===0?'denied':'warn',false);await typeChat(el,pick[i]);await sleep(180);}
    if(overrideActive)return;
    var pl=addLine('low');await put(pl,'> AWAITING INPUT','prompt');setActiveCursor(pl);isResponding=false;output.scrollTop=output.scrollHeight;termInput.focus();return;
  }

  // Bracket commands
  if(/^\[.+\]$/.test(val)){var u2=addLine('user');u2.textContent='> '+val;await handleL1Bracket(val);return;}

  // Knock knock
  if(/^KNOCK\s*KNOCK$/.test(val)){var u4=addLine('user');u4.textContent='> '+val;var kk=addLine('dim',false);await typeChat(kk,"> WHO'S THERE?");var kk2=addLine('low');await put(kk2,'> AWAITING INPUT','prompt');setActiveCursor(kk2);output.scrollTop=output.scrollHeight;termInput.focus();return;}

  inputSlowed=(CFG_SLOW_WORDS||[]).some(function(w){return val.indexOf(w)>=0;});
  isResponding=true;var u5=addLine('user');u5.textContent='> '+(val||' ');await sleep(120);

  var egg=checkEasterEgg(val);
  if(egg){
    playEggTone();await sleep(300);if(overrideActive)return;var v=pickVariant(egg);
    for(var ei=0;ei<v.lines.length;ei++){if(overrideActive)return;var eel=addLine((v.cls&&v.cls[ei])||'dim',false);await typeChat(eel,v.lines[ei]);await sleep(280*0.8);}
  }else{
    playDenied();
    var dResp=DENIED[deniedIdx%DENIED.length];deniedIdx++;
    if(Math.random()<0.05){output.style.opacity='0.4';output.style.letterSpacing='0.12em';setTimeout(function(){output.style.opacity='';output.style.letterSpacing='';},120);}
    for(var ri=0;ri<dResp.length;ri++){if(!dResp[ri])continue;if(overrideActive)return;playThinkHum(200);await sleep(200);if(overrideActive)return;var isBad=dResp[ri].indexOf('COMMAND')>=0||dResp[ri].indexOf('ERROR')>=0||dResp[ri].indexOf('WARNING')>=0;var rel=addLine(isBad?'denied':'dim',false);await typeChat(rel,dResp[ri]);await sleep(280*0.6);}
  }
  if(overrideActive)return;
  var pl2=addLine('low');await put(pl2,'> AWAITING INPUT','prompt');setActiveCursor(pl2);inputSlowed=false;isResponding=false;output.scrollTop=output.scrollHeight;termInput.focus();
}

// ── GLOBAL COMMAND SYSTEM ─────────────────────────────────────────────────────
// Returns the actual current layer ID (chat or archive) — L1's free-form
// chat state has no real node behind it (termState is the 'L1_NORMAL'
// sentinel, not a node ID), so that case is hardcoded; every other state
// reads the real layer off the current node, falling back to the current
// level's archive layer only for non-node sentinel states (fetch flow).
function currentLayerId(){
  if(termState==='L1_NORMAL') return 'l1c';
  if(archData&&archData.nodes&&archData.nodes[termState]&&archData.nodes[termState].layer) return archData.nodes[termState].layer;
  return 'l'+currentLevel+'a';
}

// Scan all global nodes for a matching command label, respecting layer scope.
// Caller is responsible for user echo and isResponding — this function does neither.
// Returns true if a global command was found and executed, false otherwise.
async function checkGlobalCommand(val){
  if(!archData||!archData.nodes) return false;
  var lid=currentLayerId();
  var matchCmd=null;
  Object.keys(archData.nodes).forEach(function(nid){
    if(matchCmd) return;
    var n=archData.nodes[nid];
    if(n.node_type!=='global') return;
    var scope=n.layer_scope||null;
    if(scope&&scope!==lid) return;
    (n.body||[]).forEach(function(b){
      if(!matchCmd&&b.type==='command'&&(b.label||'').trim()===val) matchCmd=b;
    });
  });
  if(!matchCmd) return false;

  var ct=matchCmd.cmd_type||'navigation';
  if(ct==='pull'){
    await renderPullInline(matchCmd.target);
  }else if(ct==='navigation'){
    var target=matchCmd.target;
    if(!target||!archData.nodes[target]){
      var errG=addLine('denied');await put(errG,CFG_STRINGS.error_target_not_found,'status');
    }else{
      var tNode=archData.nodes[target];var tLid=tNode.layer||'l1a';
      if(tLid!==lid){
        if(tLid==='l2a'){if(l1ChatBackup===null)l1ChatBackup=snapOutput();await transitionToL2();}
        else if(tLid==='l3a'){await transitionToL3();}
      }
      await renderArchivePage(target);
    }
  }
  return true;
}

// Render a node's body[] inline at the current position — no clear, no state change.
// Used by pull-type global commands (e.g. [HELP]).
async function renderPullInline(nodeId){
  if(!nodeId||!archData||!archData.nodes||!archData.nodes[nodeId]){
    var errP=addLine('denied');await put(errP,CFG_STRINGS.error_pull_not_found,'status');return;
  }
  var node=archData.nodes[nodeId];
  if(node.title){var ht=addLine('full',true);await put(ht,node.title,'status');await sleep(40);}
  for(var i=0;i<(node.body||[]).length;i++){
    var b=node.body[i];
    if(b.type==='text'){
      var el=addLine(b.cls||'dim',true);
      if(b.text){playLineStatic();await put(el,b.text,'doc');}
      await sleep(40);
    }else if(b.type==='dynamic'){
      var dr=resolveDynamic(b);var del=addLine(dr.cls||'dim',true);await putDyn(del,dr,'doc');await sleep(20);
    }
  }
  // Subtle separator after inline pull content
  var sep=addLine('low',true);sep.textContent=SEP;await sleep(40);
}

// ── ECHOES O.S. BUILT-IN COMMANDS ───────────────────────────────────────────────
// Generated from the tree rather than defined per page: [HELP] [TREE] [CLEAR] work
// everywhere; [LS] [BACK] [ROOT] [EXIT] work inside the archive; [OPEN <name>] opens a
// listed or hidden item by name. Hidden items are reachable by alias, never listed.
function findHiddenAlias(val){
  var id = osHidden[val] || osHiddenLoose[aliasKey(val)]; var it = id && osItems[id];
  if(!it || it.stub || it.tier > currentLevel) return null;
  return id;
}
function openToAlias(val){
  var m = /^\[OPEN\s+(.+)\]$/.exec(val);
  return m ? '['+m[1].trim()+']' : val;
}
function isChatCommand(val){
  val = openToAlias(val);
  if(val === '[HELP]' || val === '[TREE]' || val === '[CLEAR]') return true;
  if(findHiddenAlias(val) || osPrograms[val]) return true;
  var cid = findChatRootNode('l1c'); var cn = cid && archData && archData.nodes[cid];
  return !!(cn && (cn.body || []).some(function(b){ return b.type === 'command' && (b.label || '').trim() === val; }));
}
function treeLines(full){
  var out = [{text:'  /', cls:'dim'}];
  var maxTier = full ? 3 : currentLevel;
  // The player's tree does not give away a tier root's [COMMAND]: the commands that open the archive are found, not listed.
  function lab(it){ return (!full && it._parent === null) ? it.name : (it.alias || ('['+it.name+']')); }
  function tag(it){
    if(!full) return '';
    return (it.stub ? '  ?stub' : it.hidden ? '  ~hidden' : '') + (it.requires && it.requires.length ? '  requires:' + it.requires.join(',') : '') + (it.type === 'program' ? '  program:'+it.program+(it.scope === 'folder' ? ' (this folder only)' : '') : it.type === 'gateway' ? '  gateway: '+(osItems[it.goto] ? osItems[it.goto].name+' ('+it.goto+')' : it.goto+' (NOT FOUND)') : '') + '  L'+it.tier;
  }
  function walk(list, prefix, isRoot){
    var vis = list.filter(function(c){ return c.tier <= maxTier && (full || (!c.hidden && !c.stub && !gatedOut(c))); });
    vis.forEach(function(c, i){
      var last = i === vis.length-1;
      var ln={text:'  '+prefix+(last?'└─ ':'├─ ')+glyphOf(c.type)+' '+lab(c)+(isRoot?'  '+(c.title||c.name):'')+tag(c)+(full&&authorMode&&c.id===termState?'  \u25C4 HERE':''), cls:c.hidden||c.stub?'low':'dim'};
      if(full&&authorMode&&!overrideActive) ln.jump=c.id;   // author view: click a line to go there
      out.push(ln);
      walk(c.children || [], prefix+(last?'   ':'│  '), false);
    });
  }
  walk((osData && osData.tree && osData.tree.children) || [], '', true);
  var g = glyphSet();
  out.push({text:'  '+g.folder+' folder   '+g.doc+' doc   '+g.program+' program   '+g.gateway+' gateway   '+g.up+' back', cls:'low'});
  return out;
}
async function printTree(full){
  var lines = [{text:full?'ECHOES O.S. FILE TREE — FULL (AUTHOR VIEW)':'ECHOES O.S. FILE TREE', cls:'full'}, {text:SEP, cls:'low'}]
    .concat(treeLines(full), [{text:SEP, cls:'low'}]);
  await printInstant(lines);
}
async function printHelp(inArchive){
  var h = osData && osData.help;
  if(!h){var e=addLine('denied');await put(e,CFG_STRINGS.error_pull_not_found,'status');return;}
  var t = addLine('full', true); await put(t, h.title || 'AVAILABLE COMMANDS','status'); await sleep(40);
  await put(addLine('low', true), SEP, 'list');
  for(var i = 0; i < (h.entries || []).length; i++){
    var en = h.entries[i];
    if(en.scope === 'archive' && !inArchive) continue;
    await put(addLine('dim', true), '  '+en.alias.padEnd(16)+'— '+en.desc,'list');
  }
  await put(addLine('low', true), SEP, 'list');
}
// Returns false (not a built-in), 'inline' (printed in place, caller adds the prompt),
// or 'page' (navigated; the destination renders its own prompt).
async function tryBuiltin(val, inArchive){
  if(val === '[HELP]'){ await printHelp(inArchive); return 'inline'; }
  if(val === '[TREE]'){ await printTree(authorMode); return 'inline'; }
  if(val === '[CLEAR]'){ output.innerHTML=''; cursorEl=null; return 'inline'; }
  if(!inArchive) return false;
  if(val === '[LS]'){
    if(authorMode){ await printAuthorLs(); return 'inline'; }
    isResponding=false; await renderArchivePage(termState); return 'page';
  }
  if(val === '[BACK]'){ await handleBack(); return 'page'; }
  if(val === '[ROOT]'){ await handleRoot(); return 'page'; }
  if(val === '[EXIT]'){ await handleExit(); return 'page'; }
  return false;
}

// ── SYSTEM OVERRIDE ────────────────────────────────────────────────────────────
// Hardcoded, string-matched before any archData/echo-os.json lookup — this has
// to survive even a fully broken or failed archive load, so it can never
// depend on the data it exists to diagnose. Typeable from any state.
var overrideFadeEl=document.getElementById('override-fade');
async function fadeToBlack(){overrideFadeEl.classList.add('show');await sleep(400);}
async function fadeFromBlack(){overrideFadeEl.classList.remove('show');await sleep(400);}

function printOverrideMenu(){
  [['[STATUS]',      '  [STATUS]      \u2014 run full data validation report'],
   ['[LEGEND]',      '  [LEGEND]      \u2014 what the boot check labels mean'],
   ['[JUMP L1]',     '  [JUMP L1]      \u2014 jump to layer 1 archive root'],

  ].forEach(function(m){ buildItemLine(addLine('full'), {text:m[1], cmd:m[0]}); });   // hover shows the command, click runs it
}
// Jump commands replace the old DEV_OVERRIDE_ROOT node — same destinations
// (L1A_ROOT/L2A_ROOT/L3A_ROOT), now hardcoded here instead of living as
// discoverable echo-os.json content, since they're a dev tool, not lore.
async function overrideJumpToLayer(level){
  var targetId=level===1?'L1A_ROOT':level===2?'L2A_ROOT':'L3A_ROOT';
  if(!archData||!archData.nodes||!archData.nodes[targetId]){
    playDenied();
    var er=addLine('denied',true);await put(er,CFG_STRINGS.error_target_not_found||'> TARGET NOT FOUND','status');
    var pl=addLine('low');await put(pl,'> AWAITING INPUT','prompt');setActiveCursor(pl);
    isResponding=false;termInput.focus();return;
  }
  overrideSnapshot=null;overrideActive=false;
  await fadeToBlack();
  document.body.classList.remove('override-mode');
  applyLayerClass(level);
  setHeaderTitle(getLayerTitle('l'+level+'a',''));
  crossfadeAmbient(level);
  output.innerHTML='';cursorEl=null;
  await fadeFromBlack();
  isResponding=false;
  await renderArchivePage(targetId);
}
// Targets the engine resolves itself, outside archData.nodes — a command
// pointing at one of these is not dangling even though no such node exists.
var VALIDATOR_SENTINEL_TARGETS=['__EXIT__','__BACK__','__ROOT__','__PROGRAM__','__ECHO_ARCHIVE__','__ENTER_ARCHIVE__','__CLEAR__','__HOME__','__TRANSITION_L2A__','__TRANSITION_L3A__'];
var VALIDATOR_KNOWN_CMD_TYPES=['navigation','pull','loop'];
var VALIDATOR_KNOWN_NODE_TYPES=['chat','intro','standard','global','data','log_entry','help'];
// Node IDs the engine looks up directly by string, independent of any
// incoming command link — reachable even with zero inbound references.
var VALIDATOR_ENGINE_ENTRY_IDS=['BOOT_NODE','L1A_INTRO','L2A_INTRO','L3A_INTRO'];
function runDataValidator(){
  var report={fileStatus:[],fileProblems:[],dangling:[],stub:[],badCmdType:[],badNodeType:[],badLayer:[],orphaned:[]};
  report.fileStatus=Object.keys(FILE_LABELS).map(function(k){ return {label:FILE_LABELS[k], file:FILE_NAMES[k], state:fileState(k), detail:(FILE_STATUS[k]&&FILE_STATUS[k].detail)||''}; });
  report.fileProblems=report.fileStatus.filter(function(f){ return f.state!=='ok'; }).map(function(f){ return f.file+' ['+statusLabel(f.state)+']'+(f.detail?': '+f.detail:''); });
  if(!archData||!archData.nodes) return report;
  var nodes=archData.nodes;
  var layers=(archData.layers||{});
  var referenced={};
  Object.keys(nodes).forEach(function(nid){
    var node=nodes[nid];
    if(node.layer&&!layers[node.layer]) report.badLayer.push(nid+' -> layer "'+node.layer+'"');
    if(node.node_type&&VALIDATOR_KNOWN_NODE_TYPES.indexOf(node.node_type)===-1) report.badNodeType.push(nid+' -> node_type "'+node.node_type+'"');
    (node.body||[]).forEach(function(b){
      if(b.type!=='command') return;
      var ct=b.cmd_type||'navigation';
      if(VALIDATOR_KNOWN_CMD_TYPES.indexOf(ct)===-1){report.badCmdType.push(nid+' -> '+(b.label||'(no label)')+' cmd_type "'+ct+'"');return;}
      var tgt=b.target;
      if(!tgt){report.stub.push(nid+' -> '+(b.label||'(no label)'));return;}
      if(VALIDATOR_SENTINEL_TARGETS.indexOf(tgt)!==-1) return;
      if(!nodes[tgt]){report.dangling.push(nid+' -> '+(b.label||'(no label)')+' -> "'+tgt+'"');return;}
      referenced[tgt]=true;
    });
  });
  Object.keys(nodes).forEach(function(nid){
    var node=nodes[nid];
    if(node.is_root||node.hidden) return;
    if(node.node_type==='global') return;
    if(VALIDATOR_ENGINE_ENTRY_IDS.indexOf(nid)!==-1) return;
    if(!referenced[nid]) report.orphaned.push(nid);
  });
  Object.keys(osItems).forEach(function(id){
    var it = osItems[id];
    if(it.stub) report.stub.push(id);
    if(it.type === 'gateway' && !nodes[it.goto]) report.dangling.push(id+' -> gateway -> "'+it.goto+'"');
  });
  return report;
}
async function printLegend(){
  var L = function(state){ return '['+(state==='ok' ? (CFG_STRINGS.status_ok||'OK') : statusLabel(state))+']'; };
  var row = function(a, b, cls){ return put(addLine(cls||'dim'), '  '+a.padEnd(34)+b, 'list'); };
  var h = addLine('full', true); await put(h, '> BOOT CHECK LEGEND','status');
  await put(addLine('low'), SEP, 'list');
  await row(L('ok'),      'LOADED, PARSED, AND THE CONTENTS LOOK RIGHT');
  await row(L('warn'),    'USABLE, BUT SOMETHING INSIDE IS OFF. USED AS IS', 'warn');
  await row(L('invalid'), 'VALID JSON WITH THE WRONG CONTENTS. UNAVAILABLE', 'denied');
  await row(L('broken'),  'NOT VALID JSON, CANNOT BE READ. UNAVAILABLE', 'denied');
  await row(L('missing'), 'COULD NOT BE FETCHED. UNAVAILABLE', 'denied');
  await put(addLine('low'), SEP, 'list');
  await row('FULL ACCESS', 'ALL FIVE FILES ARE '+L('ok'));
  await row('FULL ACCESS \u2014 N WARNINGS', 'NOTHING OFFLINE, N FILES ARE '+L('warn'));
  await row('DEGRADED \u2014 N SUBSYSTEMS OFFLINE', 'N FILES ARE '+L('invalid')+', '+L('broken')+' OR '+L('missing'));
  await put(addLine('low'), SEP, 'list');
  for(var fk=0, fks=Object.keys(FILE_LABELS); fk<fks.length; fk++){ await row(FILE_LABELS[fks[fk]], FILE_NAMES[fks[fk]]); }
  await put(addLine('low'), SEP, 'list');
  await put(addLine('low'), '  [STATUS] SHOWS WHICH FILE HAS WHICH PROBLEM, AND WHY.', 'list');
}
async function handleOverrideInput(val){
  isResponding=true;
  var u=addLine('user');u.textContent='> '+val;
  if(val==='[STATUS]'){
    await sleep(80);
    var hd=addLine('full',true);await put(hd,'> RUNNING FULL DATA VALIDATION...','status');
    await sleep(150);
    var r=runDataValidator();
    await put(addLine('low'),SEP,'list');
    for(var fi=0;fi<r.fileStatus.length;fi++){
      var f=r.fileStatus[fi];
      await put(addLine(f.state==='ok'?'full':f.state==='warn'?'warn':'denied'),'  '+f.label+' '+'-'.repeat(Math.max(1,30-f.label.length))+' ['+(f.state==='ok'?'OK':statusLabel(f.state))+']','list');
    }
    await put(addLine('low'),SEP,'list');
    var sections=[
      ['DATA FILE PROBLEMS',r.fileProblems],
      ['DANGLING TARGETS',r.dangling],
      ['UNHANDLED CMD_TYPES',r.badCmdType],
      ['UNRECOGNIZED NODE_TYPES',r.badNodeType],
      ['UNDEFINED LAYER REFERENCES',r.badLayer],
      ['ORPHANED NODES',r.orphaned],
      ['STUB ITEMS (planned, empty — hidden from player)',r.stub]
    ];
    var totalIssues=r.fileProblems.length+r.dangling.length+r.badCmdType.length+r.badNodeType.length+r.badLayer.length+r.orphaned.length+r.stub.length;
    for(var si2=0;si2<sections.length;si2++){
      var name=sections[si2][0],items=sections[si2][1];
      await put(addLine(items.length?'warn':'low'),'  '+name+': '+items.length,'list');
      for(var ii=0;ii<items.length;ii++) await put(addLine('dim'),'    - '+items[ii],'list');
    }
    await put(addLine('low'),SEP,'list');
    await put(addLine('low'),'  [LEGEND] EXPLAINS THE STATUS LABELS.','list');
    var summary=addLine(totalIssues?'warn':'full',true);
    await put(summary,totalIssues?('> '+totalIssues+' ISSUE'+(totalIssues===1?'':'S')+' FOUND'):'> NO ISSUES FOUND — DATA INTEGRITY CONFIRMED','status');
    var pl=addLine('low');await put(pl,'> AWAITING INPUT','prompt');setActiveCursor(pl);
    isResponding=false;termInput.focus();return;
  }
  if(val==='[TREE]'){
    await printTree(true);
    var plT=addLine('low');await put(plT,'> AWAITING INPUT','prompt');setActiveCursor(plT);
    isResponding=false;termInput.focus();return;
  }
  if(val==='[LEGEND]'){
    await printLegend();
    var plL=addLine('low');await put(plL,'> AWAITING INPUT','prompt');setActiveCursor(plL);
    isResponding=false;termInput.focus();return;
  }
  if(val==='[EXIT]'){await exitSystemOverride();return;}
  if(val==='[JUMP L1]'){await overrideJumpToLayer(1);return;}
  if(val==='[JUMP L2]'){await overrideJumpToLayer(2);return;}
  if(val==='[JUMP L3]'){await overrideJumpToLayer(3);return;}
  playDenied();
  var er=addLine('denied',true);await put(er,CFG_STRINGS.error_cmd_not_recognized,'status');
  var pl2=addLine('low');await put(pl2,'> AWAITING INPUT','prompt');setActiveCursor(pl2);
  isResponding=false;termInput.focus();
}
async function exitSystemOverride(){
  var snap=overrideSnapshot;overrideSnapshot=null;overrideActive=false;
  await fadeToBlack();
  document.body.classList.remove('override-mode');
  if(!snap){
    termState='L1_NORMAL';applyChatClass();output.innerHTML='';setBreadcrumb('');setHeaderTitle('');
    await fadeFromBlack();
    var pl=addLine('low');await put(pl,'> AWAITING INPUT','prompt');setActiveCursor(pl);
    isResponding=false;termInput.focus();return;
  }
  if(snap.termState==='L1_NORMAL') applyChatClass(); else applyLayerClass(snap.currentLevel);
  restoreOutput(snap.html);
  termState=snap.termState;
  setBreadcrumb(snap.breadcrumb);
  titleEl.textContent=snap.title;titleEl.style.opacity='1';
  currentMenuOpts=snap.menuOpts;menuSelIdx=snap.menuSelIdx;
  termInput.value=snap.inputValue;termInput.placeholder=snap.inputPlaceholder;
  var cur=output.querySelector('.t-cursor');if(cur)cursorEl=cur;
  output.scrollTop=output.scrollHeight;
  await fadeFromBlack();
  isResponding=false;termInput.focus();
}

// ── MAIN INPUT ROUTER ─────────────────────────────────────────────────────────
// Every submission runs under the render lock, so a second line can't be submitted
// (and can't interleave its output) until the first has finished drawing.
async function routeInput(val){ hoverStash = null; return withLock(function(){ return routeInputInner(val); }); }
async function routeInputInner(val){
  if(!overrideActive&&val==='[SYSTEM OVERRIDE]'){await enterSystemOverride();return;}
  if(overrideActive){await handleOverrideInput(val);return;}
  if(!val&&termState!=='PROGRAM') return;

  if(termState==='PROGRAM'){
    var w=progWait; if(!w) return;
    progWait=null;termInput.placeholder='';inputMask=null;
    w.resolve(val);return;
  }

  if(await handleAuthorInput(val)) return;

  if(termState==='archive_integrity_PAGE'){var u2=addLine('user');u2.textContent='> '+val;isResponding=true;await handleBack();isResponding=false;return;}
  if(termState==='L1_NORMAL'){await handleL1Input(val);return;}
  await handleArchiveInput(val);
}

// ── KEYDOWN HANDLER ───────────────────────────────────────────────────────────
termInput.addEventListener('keydown',async function(e){
  resetIdleTimer();
  // ── Typing click sounds (fix: was missing for regular chars) ──
  if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    playClick(e.key);
  }
  setTimeout(updateInvertHighlight,0);

  var isMenu=currentMenuOpts.length>0&&!inputBusy();

  // A running program is either waiting for a line (progWait) or drawing (keys ignored).
  if(termState==='PROGRAM'){
    if(progWait&&!inputBusy()){
      // Enter submits ('' is a legitimate empty answer); Escape cancels with null.
      if(e.key==='Enter'){e.preventDefault();var v=inputMask==='free'?termInput.value.replace(/\s+$/,''):termInput.value.trim().toUpperCase();termInput.value='';routeInput(v);}
      else if(e.key==='Escape'||(!progWait.sticky&&((e.key==='ArrowLeft'&&termInput.value==='')||(e.key==='Backspace'&&termInput.value===''))))
        {e.preventDefault();termInput.value='';routeInput(null);}
    }else if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();}
    if(e.key==='Backspace') playBackspace();
    return;
  }

  if(e.key==='ArrowDown'&&isMenu){e.preventDefault();menuSelIdx=(menuSelIdx+1)%currentMenuOpts.length;termInput.value=currentMenuOpts[menuSelIdx];updateInvertHighlight();playNavPip(1);return;}
  if(e.key==='Tab'&&isMenu){e.preventDefault();menuSelIdx=(menuSelIdx+1)%currentMenuOpts.length;termInput.value=currentMenuOpts[menuSelIdx];updateInvertHighlight();playNavPip(1);return;}
  if(e.key==='ArrowUp'&&isMenu){e.preventDefault();menuSelIdx=((menuSelIdx-1)+currentMenuOpts.length)%currentMenuOpts.length;termInput.value=currentMenuOpts[menuSelIdx];updateInvertHighlight();playNavPip(-1);return;}

  if(e.key==='ArrowUp'&&termState==='L1_NORMAL'&&!inputBusy()&&commandHistory.length){e.preventDefault();var atOldest=commandHistIdx<=0;commandHistIdx=Math.max(0,commandHistIdx-1);termInput.value=commandHistory[commandHistIdx]||'';playNavPip(-1,atOldest);return;}
  if(e.key==='ArrowDown'&&termState==='L1_NORMAL'&&!inputBusy()){e.preventDefault();var atBlank=commandHistIdx>=commandHistory.length;if(commandHistIdx<commandHistory.length-1){commandHistIdx++;termInput.value=commandHistory[commandHistIdx];}else{commandHistIdx=commandHistory.length;termInput.value='';}playNavPip(1,atBlank);return;}

  if(e.key==='ArrowRight'&&termInput.value.trim()&&!inputBusy()){e.preventDefault();var v2=termInput.value.trim().toUpperCase();termInput.value='';if(termState==='L1_NORMAL'){commandHistory.push(v2);commandHistIdx=commandHistory.length;}playEnter();routeInput(v2);return;}
  if(e.key==='ArrowLeft'&&termInput.value===''&&!inputBusy()){e.preventDefault();if(termState!=='L1_NORMAL'){await withLock(async function(){isResponding=true;await handleBack();});}return;}
  if(e.key==='Escape'&&!inputBusy()){e.preventDefault();if(termState!=='L1_NORMAL'){await withLock(async function(){isResponding=true;await handleExit();});}return;}

  // SYSTEM OVERRIDE must be reachable even mid-response (the lock is bypassed) —
  // that's the whole point of a hardcoded recovery entry point.
  if(e.key==='Enter'&&!overrideActive&&termInput.value.trim().toUpperCase()==='[SYSTEM OVERRIDE]'){
    e.preventDefault();termInput.value='';playEnter();routeInput('[SYSTEM OVERRIDE]');return;
  }
  if(e.key==='Enter'){
    e.preventDefault();
    if(inputBusy()) return;   // still drawing: keep the typed text, submit nothing
    var v5=termInput.value.trim().toUpperCase();termInput.value='';
    if(termState==='L1_NORMAL'&&v5){commandHistory.push(v5);commandHistIdx=commandHistory.length;}
    playEnter();routeInput(v5);return;
  }
  if(e.key==='Backspace') playBackspace();
});
