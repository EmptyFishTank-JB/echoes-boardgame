<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" id="fav-link">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL ENGINE // v42</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── THEME TOKENS ── */
:root{
  --theme-full:#4fc3f7;
  --theme-dim:rgba(79,195,247,0.70);
  --theme-lo:rgba(79,195,247,0.40);
  --theme-warn:#E8732A;
  --theme-denied:#ff003c;
  --theme-user:rgba(238,240,245,0.50);
  --theme-bg:rgba(8,10,14,0.85);
  --theme-border:rgba(79,195,247,0.12);
  --theme-irow:rgba(238,240,245,0.05);
  --theme-bc:rgba(79,195,247,0.36);
  --theme-bgsolid:#00080e;
  --theme-glow-a:rgba(15,55,80,0.38);
  --theme-glow-b:rgba(8,30,50,0.18);
}
body.layer-2{
  --theme-full:#bf7c0a;--theme-dim:rgba(191,124,10,0.70);--theme-lo:rgba(191,124,10,0.45);
  --theme-warn:#c8a020;--theme-denied:#c84040;--theme-user:rgba(191,124,10,0.55);
  --theme-bg:rgba(2,2,6,0.97);--theme-border:rgba(191,124,10,0.18);
  --theme-irow:rgba(191,124,10,0.10);--theme-bc:rgba(191,124,10,0.36);
  --theme-bgsolid:#0a0700;--theme-glow-a:rgba(80,55,15,0.32);--theme-glow-b:rgba(50,30,8,0.18);
}
body.layer-3{
  --theme-full:#e05050;--theme-dim:rgba(224,80,80,0.70);--theme-lo:rgba(224,80,80,0.40);
  --theme-warn:#ff8800;--theme-denied:#ff0000;--theme-user:rgba(224,80,80,0.50);
  --theme-bg:rgba(0,0,0,1.0);--theme-border:rgba(180,30,30,0.18);
  --theme-irow:rgba(180,30,30,0.10);--theme-bc:rgba(224,80,80,0.36);
  --theme-bgsolid:#050000;--theme-glow-a:rgba(80,15,15,0.32);--theme-glow-b:rgba(50,8,8,0.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#000;overflow:hidden;}
body{transition:background 1.1s ease;}
/* CRT scanlines */
body::before{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 1px,transparent 4px);
  mix-blend-mode:overlay;}
/* Film grain */
body::after{content:"";position:fixed;inset:-50%;z-index:2;pointer-events:none;
  width:200%;height:200%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
  opacity:0.18;animation:grain 0.12s steps(1) infinite;}
@keyframes grain{
  0%{transform:translate(0,0);}10%{transform:translate(-3%,-4%);}
  20%{transform:translate(-6%,3%);}30%{transform:translate(4%,-2%);}
  40%{transform:translate(-2%,6%);}50%{transform:translate(-5%,-3%);}
  60%{transform:translate(3%,5%);}70%{transform:translate(6%,-4%);}
  80%{transform:translate(-4%,2%);}90%{transform:translate(2%,-6%);}
  100%{transform:translate(-3%,4%);}
}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,0.80) 100%);}
/* Power overlay */
#power-overlay{position:fixed;inset:0;z-index:9999;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  transition:opacity 0.6s ease;}
#power-overlay.hidden{opacity:0;pointer-events:none;}
#power-btn{background:transparent;border:1px solid rgba(79,195,247,0.45);color:#4fc3f7;
  font-family:'Share Tech Mono',monospace;font-size:16px;padding:18px 38px;cursor:pointer;
  letter-spacing:0.14em;text-transform:uppercase;transition:all 0.3s ease;
  box-shadow:inset 0 0 24px rgba(79,195,247,0.08),0 0 24px rgba(79,195,247,0.05);}
#power-btn:hover{background:rgba(79,195,247,0.10);border-color:#4fc3f7;
  box-shadow:inset 0 0 32px rgba(79,195,247,0.18),0 0 32px rgba(79,195,247,0.18);
  text-shadow:0 0 4px #4fc3f7;}
#power-sub{font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(79,195,247,0.28);
  letter-spacing:0.16em;}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
/* Page */
#page{position:relative;z-index:3;height:100vh;height:100dvh;
  display:flex;flex-direction:column;padding:18px 40px 24px;}
/* Header */
#t-header{display:flex;align-items:center;justify-content:space-between;
  padding:0 4px 10px;flex-shrink:0;font-family:'Share Tech Mono',monospace;
  font-size:11px;letter-spacing:0.12em;gap:18px;}
#t-title{color:var(--theme-dim);transition:color 1.1s ease,opacity 0.28s ease;flex-shrink:0;}
#t-breadcrumb{color:var(--theme-bc);transition:color 1.1s ease,opacity 0.35s ease;
  font-size:10.5px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;opacity:0;pointer-events:none;}
#t-breadcrumb.visible{opacity:1;}
#t-meta{display:flex;gap:14px;align-items:center;flex-shrink:0;}
#t-version{color:var(--theme-lo);font-size:10.5px;transition:color 1.1s ease;}
#t-clock{color:var(--theme-dim);font-size:11px;transition:color 1.1s ease;}
/* Terminal box */
#terminal-box{flex:1;display:flex;flex-direction:column;
  background:var(--theme-bg);border:1px solid var(--theme-border);
  min-height:0;overflow:hidden;transition:background 1.1s ease,border-color 1.1s ease;}
/* Output */
#t-output{flex:1;overflow-y:auto;padding:24px 28px 0;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:var(--theme-irow) transparent;
  transition:opacity 0.38s ease;}
#t-output.dim-out{opacity:0;}
#t-output::-webkit-scrollbar{width:3px;}
#t-output::-webkit-scrollbar-thumb{background:var(--theme-irow);}
/* Phosphor decay — overrideable via engine config */
@keyframes phosphorIn{0%{filter:brightness(2.4)}100%{filter:brightness(1.0)}}
.t-line.phos{animation:phosphorIn 0.45s ease-out forwards;}
/* Output lines */
.t-line{font-family:'Share Tech Mono',monospace;font-size:13px;line-height:1.9;
  letter-spacing:0.04em;white-space:pre-wrap;min-height:1.9em;
  color:var(--theme-full);transition:color 1.1s ease;}
.t-line.full  {color:var(--theme-full);}
.t-line.dim   {color:var(--theme-dim);}
.t-line.lo    {color:var(--theme-lo);}
.t-line.low   {color:var(--theme-lo);}
.t-line.warn  {color:var(--theme-warn);}
.t-line.denied{color:var(--theme-denied);}
.t-line.user  {color:var(--theme-user);}
.t-line.blank {color:transparent;min-height:1.9em;}
/* Invert highlight */
.t-line.inverted{background:var(--theme-full)!important;color:#000!important;
  padding-left:4px;padding-right:4px;display:inline-block;
  align-self:flex-start;max-width:100%;font-weight:bold;transition:none;}
/* Cursor */
.t-cursor::after{content:'_';animation:blink 0.9s step-end infinite;color:var(--theme-full);}
/* Input row */
#t-input-row{display:flex;align-items:center;gap:8px;padding:18px 28px 22px;
  flex-shrink:0;border-top:1px solid var(--theme-irow);transition:border-color 1.1s ease;}
#t-prompt{font-family:'Share Tech Mono',monospace;font-size:13px;
  color:var(--theme-full);transition:color 1.1s ease;user-select:none;}
#t-field{flex:1;background:transparent;border:none;outline:none;
  font-family:'Share Tech Mono',monospace;font-size:13px;
  color:var(--theme-full);letter-spacing:0.04em;caret-color:var(--theme-full);
  text-transform:uppercase;transition:color 1.1s ease,background 0.15s ease;padding:2px 4px;}
#t-field::placeholder{color:var(--theme-lo);letter-spacing:0.08em;text-transform:none;}
#t-field.inverted{background:var(--theme-full);color:#000;font-weight:bold;caret-color:transparent;}
#t-block-cursor{width:9px;height:14px;flex-shrink:0;background:var(--theme-full);
  animation:blink 0.9s step-end infinite;transition:background 1.1s ease;}
/* Virus */
@keyframes virusFlicker{0%,100%{opacity:1}20%{opacity:0.3}40%{opacity:1}60%{opacity:0.15;letter-spacing:0.18em}80%{opacity:1}}
#terminal-box.virus{animation:virusFlicker 0.35s ease-in-out 3;}
/* Mobile */
@media(max-width:768px){
  #page{padding:10px 14px 14px;}
  .t-line{font-size:12px;}
  #t-input-row{padding:14px 14px 16px;}
  #t-header{padding:0 4px 8px;font-size:10px;gap:10px;}
  #t-breadcrumb{font-size:9.5px;}
  #t-version{display:none;}
  #t-clock{font-size:10px;}
  #power-btn{font-size:13px;padding:14px 24px;}
  #power-sub{font-size:10px;}
}
</style>
</head>
<body class="layer-1">
<canvas id="bg-canvas"></canvas>
<div id="vignette"></div>
<div id="power-overlay">
  <button id="power-btn">[ Power On / Initialize ]</button>
  <div id="power-sub"></div>
</div>
<div id="page">
  <div id="t-header">
    <span id="t-title"></span>
    <span id="t-breadcrumb"></span>
    <div id="t-meta">
      <span id="t-version">v31.0</span>
      <span id="t-clock">STARDATE 2143.000.0000</span>
    </div>
  </div>
  <div id="terminal-box">
    <div id="t-output"></div>
    <div id="t-input-row" style="display:none;">
      <span id="t-prompt">&gt;&nbsp;</span>
      <input id="t-field" type="text" autocomplete="off" spellcheck="false" inputmode="text">
      <div id="t-block-cursor"></div>
    </div>
  </div>
</div>
<script>
'use strict';

// ── DOM REFS ──────────────────────────────────────────────────────────────────
var output    = document.getElementById('t-output');
var inputRow  = document.getElementById('t-input-row');
var termInput = document.getElementById('t-field');
var termBox   = document.getElementById('terminal-box');

// ── RUNTIME FLAGS ──────────────────────────────────────────────────────────────
var typing       = false;
var typingAbort  = false;
var isResponding = false;
var cursorEl     = null;
var inputSlowed  = false;

// ── AUDIO ─────────────────────────────────────────────────────────────────────
var audioCtx = null;
var VOL = 0.18;
var PUNCT = {'.':1,',':1,':':1,';':1,'!':1,'?':1,'-':1,'>':1,'/':1,'_':1};

function getCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playClick(ch){
  if(ch&&PUNCT[ch]){playPunctClick();return;}
  try{
    var ctx=getCtx(),dur=0.025;
    var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    var src=ctx.createBufferSource();src.buffer=buf;
    var flt=ctx.createBiquadFilter();flt.type='bandpass';flt.frequency.value=3000+Math.random()*1000;flt.Q.value=0.8;
    var gn=ctx.createGain();gn.gain.setValueAtTime(VOL,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    src.connect(flt);flt.connect(gn);gn.connect(ctx.destination);src.start();src.stop(ctx.currentTime+dur);
  }catch(e){}
}
function playPunctClick(){
  try{var ctx=getCtx();var osc=ctx.createOscillator();osc.type='triangle';osc.frequency.value=200;var gn=ctx.createGain();gn.gain.setValueAtTime(VOL*0.55,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.04);osc.connect(gn);gn.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.04);}catch(e){}
}
function playEnter(){
  try{var ctx=getCtx(),dur=0.055;var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.25));var src=ctx.createBufferSource();src.buffer=buf;var flt=ctx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=800;var gn=ctx.createGain();gn.gain.setValueAtTime(VOL*1.2,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);src.connect(flt);flt.connect(gn);gn.connect(ctx.destination);src.start();src.stop(ctx.currentTime+dur);}catch(e){}
}
function playBackspace(){
  try{var ctx=getCtx(),dur=0.032;var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);var src=ctx.createBufferSource();src.buffer=buf;var f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=900+Math.random()*300;f.Q.value=1.2;var f2=ctx.createBiquadFilter();f2.type='lowpass';f2.frequency.value=1800;var gn=ctx.createGain();gn.gain.setValueAtTime(VOL,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);src.connect(f);f.connect(f2);f2.connect(gn);gn.connect(ctx.destination);src.start();src.stop(ctx.currentTime+dur);}catch(e){}
}
function playAlert(){
  try{var ctx=getCtx();var gn=ctx.createGain();gn.connect(ctx.destination);[440,330].forEach(function(freq,idx){var osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.value=freq;osc.connect(gn);var t=ctx.currentTime+idx*0.12;gn.gain.setValueAtTime(VOL*0.4,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.1);osc.start(t);osc.stop(t+0.1);});}catch(e){}
}
function _deniedBurst(ctx,t,vol){
  var dur=0.07;var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.8);var bs=ctx.createBufferSource();bs.buffer=buf;var lo=ctx.createBiquadFilter();lo.type='bandpass';lo.frequency.value=320;lo.Q.value=0.9;var gn=ctx.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);bs.connect(lo);lo.connect(gn);gn.connect(ctx.destination);bs.start(t);bs.stop(t+dur);
  var len2=Math.floor(ctx.sampleRate*0.008);var buf2=ctx.createBuffer(1,len2,ctx.sampleRate);var d2=buf2.getChannelData(0);for(var j=0;j<len2;j++)d2[j]=(Math.random()*2-1)*(1-j/len2);var bs2=ctx.createBufferSource();bs2.buffer=buf2;var hi=ctx.createBiquadFilter();hi.type='bandpass';hi.frequency.value=3500;hi.Q.value=1.2;var gn2=ctx.createGain();gn2.gain.setValueAtTime(vol*0.6,t);gn2.gain.exponentialRampToValueAtTime(0.001,t+0.008);bs2.connect(hi);hi.connect(gn2);gn2.connect(ctx.destination);bs2.start(t);bs2.stop(t+0.008);
}
function playDenied(){try{var ctx=getCtx();[0,0.08,0.18].forEach(function(delay,i){_deniedBurst(ctx,ctx.currentTime+delay,VOL*[0.9,0.35,0.12][i]);});}catch(e){}}
function playLineStatic(){
  try{var ctx=getCtx(),dur=0.035;var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);var src=ctx.createBufferSource();src.buffer=buf;var flt=ctx.createBiquadFilter();flt.type='highpass';flt.frequency.value=2000;var gn=ctx.createGain();gn.gain.setValueAtTime(VOL*0.75,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);src.connect(flt);flt.connect(gn);gn.connect(ctx.destination);src.start();src.stop(ctx.currentTime+dur);}catch(e){}
}
function playThinkHum(ms){
  try{var ctx=getCtx(),dur=Math.min(ms/1000,1.2);if(dur<0.1)return;var osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=110;var gn=ctx.createGain();gn.gain.setValueAtTime(0,ctx.currentTime);gn.gain.linearRampToValueAtTime(VOL*0.12,ctx.currentTime+0.08);gn.gain.setValueAtTime(VOL*0.12,ctx.currentTime+dur-0.08);gn.gain.linearRampToValueAtTime(0,ctx.currentTime+dur);osc.connect(gn);gn.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+dur);}catch(e){}
}
function playEggTone(){
  try{var ctx=getCtx();[660,880].forEach(function(f,i){var osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=f;var gn=ctx.createGain();var t=ctx.currentTime+i*0.09;gn.gain.setValueAtTime(VOL*0.25,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.08);osc.connect(gn);gn.connect(ctx.destination);osc.start(t);osc.stop(t+0.08);});}catch(e){}
}
function playIdlePop(){
  try{var ctx=getCtx();var len=Math.floor(ctx.sampleRate*0.06);var buf=ctx.createBuffer(1,len,ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(len*0.3));var src=ctx.createBufferSource();src.buffer=buf;var flt=ctx.createBiquadFilter();flt.type='bandpass';flt.frequency.value=1200;flt.Q.value=0.5;var gn=ctx.createGain();gn.gain.setValueAtTime(VOL*0.35,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.06);src.connect(flt);flt.connect(gn);gn.connect(ctx.destination);src.start();src.stop(ctx.currentTime+0.06);}catch(e){}
}

// ── AMBIENT ───────────────────────────────────────────────────────────────────
var ambNodes = null;

function _buildL1Amb(ctx){
  var master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  var o1=ctx.createOscillator();o1.type='sine';o1.frequency.value=110;var g1=ctx.createGain();g1.gain.value=0.06;o1.connect(g1);g1.connect(master);o1.start();
  var o2=ctx.createOscillator();o2.type='sawtooth';o2.frequency.value=90;var f2=ctx.createBiquadFilter();f2.type='lowpass';f2.frequency.value=180;var g2=ctx.createGain();g2.gain.value=0.045;var lfo=ctx.createOscillator();lfo.type='sine';lfo.frequency.value=0.12;var lfoG=ctx.createGain();lfoG.gain.value=0.015;lfo.connect(lfoG);lfoG.connect(g2.gain);o2.connect(f2);f2.connect(g2);g2.connect(master);o2.start();lfo.start();
  var nBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);var nD=nBuf.getChannelData(0);for(var i=0;i<nD.length;i++)nD[i]=(Math.random()*2-1)*0.5;var nSrc=ctx.createBufferSource();nSrc.buffer=nBuf;nSrc.loop=true;var nFlt=ctx.createBiquadFilter();nFlt.type='lowpass';nFlt.frequency.value=500;var nG=ctx.createGain();nG.gain.value=0.04;nSrc.connect(nFlt);nFlt.connect(nG);nG.connect(master);nSrc.start();
  return{master:master,stop:function(){try{o1.stop();o2.stop();lfo.stop();nSrc.stop();}catch(e){}}};
}
function _buildL2Amb(ctx){
  var master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);var stops=[];
  [80,121,160,203].forEach(function(freq,i){var osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=freq;var g=ctx.createGain();g.gain.value=0.025;var lfo=ctx.createOscillator();lfo.type='sine';lfo.frequency.value=[0.02,0.035,0.05,0.06][i];var lfoG=ctx.createGain();lfoG.gain.value=0.012;lfo.connect(lfoG);lfoG.connect(g.gain);osc.connect(g);g.connect(master);osc.start();lfo.start();stops.push(osc,lfo);});
  return{master:master,stop:function(){stops.forEach(function(n){try{n.stop();}catch(e){}});}};
}
function _buildL3Amb(ctx){
  var master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);var osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=38;var g=ctx.createGain();g.gain.value=0.5;osc.connect(g);g.connect(master);osc.start();
  return{master:master,stop:function(){try{osc.stop();}catch(e){}}};
}

function buildAmbFromConfig(ctx, lvKey){
  var lvCfg = typeof CFG_AMBIENT !== 'undefined' && CFG_AMBIENT && CFG_AMBIENT[lvKey];
  if(!lvCfg||!lvCfg.oscillators||!lvCfg.oscillators.length){
    if(lvKey==='l1') return _buildL1Amb(ctx);
    if(lvKey==='l2') return _buildL2Amb(ctx);
    return _buildL3Amb(ctx);
  }
  var master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);var stops=[];
  lvCfg.oscillators.forEach(function(osc){
    var gainNode=ctx.createGain();gainNode.gain.value=osc.volume||0.04;
    var source;
    if(osc.type==='noise'){var bl=ctx.sampleRate*2;var buf=ctx.createBuffer(1,bl,ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;source=ctx.createBufferSource();source.buffer=buf;source.loop=true;}
    else{source=ctx.createOscillator();source.type=osc.type||'sine';source.frequency.value=osc.freq||110;}
    stops.push(source);
    var lastNode=source;
    if(osc.filter_type&&osc.filter_type!=='none'){var flt=ctx.createBiquadFilter();flt.type=osc.filter_type;flt.frequency.value=osc.filter_freq||500;source.connect(flt);lastNode=flt;}
    if(osc.lfo_rate&&osc.lfo_rate>0){var lfo=ctx.createOscillator();lfo.type='sine';lfo.frequency.value=osc.lfo_rate;var lfoG=ctx.createGain();lfoG.gain.value=osc.lfo_depth||0.012;lfo.connect(lfoG);lfoG.connect(gainNode.gain);lfo.start();stops.push(lfo);}
    lastNode.connect(gainNode);gainNode.connect(master);source.start();
  });
  return{master:master,stop:function(){stops.forEach(function(n){try{n.stop();}catch(e){}});}};
}

function crossfadeAmbient(level){
  try{
    var ctx=getCtx();var prev=ambNodes;var lvKey=level===1?'l1':level===2?'l2':'l3';
    var fresh=buildAmbFromConfig(ctx,lvKey);
    var lvCfg=typeof CFG_AMBIENT!=='undefined'&&CFG_AMBIENT&&CFG_AMBIENT[lvKey];
    var target=lvCfg&&lvCfg.target_volume!=null?lvCfg.target_volume:(level===1?0.18:level===2?0.12:0.05);
    if(typeof CFG_VOLUME!=='undefined'&&CFG_VOLUME!=null) VOL=CFG_VOLUME;
    fresh.master.gain.setTargetAtTime(target,ctx.currentTime,0.7);
    ambNodes=fresh;
    if(prev){prev.master.gain.setTargetAtTime(0,ctx.currentTime,0.8);setTimeout(function(){try{prev.stop();prev.master.disconnect();}catch(e){}},3500);}
  }catch(e){}
}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

function setActiveCursor(el){
  if(cursorEl) cursorEl.classList.remove('t-cursor');
  cursorEl=el;

function addLine(cls,phosphor){
  var el=document.createElement('div');
  el.className='t-line '+(cls||'');
  if(phosphor) el.classList.add('phos');
  output.appendChild(el);
  output.scrollTop=output.scrollHeight;
  return el;
}

async function typeLine(el,text){
  var sw=CFG_SLOW_WORDS||[];
  var slowed=inputSlowed||sw.some(function(w){return text.toUpperCase().indexOf(w)>=0;});
  var t=typeof CFG_TYPING!=='undefined'&&CFG_TYPING;
  var baseMs=t&&t.base_ms?t.base_ms:38;
  var variance=t&&t.variance!=null?t.variance:0.6;
  var mult=slowed?((t&&t.slow_multiplier?t.slow_multiplier:2.8)):1;
  for(var i=0;i<text.length;i++){
    if(typingAbort) return;
    el.textContent+=text[i];
    if(text[i]!==' '&&text[i]!=='\u2500') playClick(text[i]);
    output.scrollTop=output.scrollHeight;
    await sleep(baseMs*mult*(0.7+Math.random()*variance));
  }
}

async function printInstant(lines){
  for(var i=0;i<lines.length;i++){
    var el=addLine(lines[i].cls||'full',true);
    if(lines[i].text){el.textContent=lines[i].text;playLineStatic();}
    await sleep(40);
  }
}

async function printTyped(lines){
  for(var i=0;i<lines.length;i++){
    var el=addLine(lines[i].cls||'full');
    if(lines[i].text){playLineStatic();await typeLine(el,lines[i].text);}
    await sleep(40);
  }
}

// ── BOOT SCRIPT ───────────────────────────────────────────────────────────────
// File readiness checks — used to wait for async file loads before rendering
// Display labels come from L1C_ROOT body[] dynamic lines, not from here
var FILE_CHECK_MAP = [
  {ready:function(){return _perReady;},  ok:function(){return !!personality;}},
  {ready:function(){return _lorReady;},  ok:function(){return !!loreData;}},
  {ready:function(){return _devReady;},  ok:function(){return !!devLogs;}},
  {ready:function(){return _archReady;}, ok:function(){return !!archData;}},
  {ready:function(){return _engReady;},  ok:function(){return !!engineConfig;}}
];

async function runScript(){
  typing=true;typingAbort=false;
  output.innerHTML='';inputRow.style.display='none';cursorEl=null;
  await sleep(800);

  // ── PHASE 1: BOOT_NODE body[] — header and narrative from nodes.json ──────
  var bootNode=archData&&archData.nodes&&archData.nodes['BOOT_NODE'];
  if(bootNode&&bootNode.body&&bootNode.body.length){
    for(var bi=0;bi<bootNode.body.length;bi++){
      if(typingAbort) break;
      var bline=bootNode.body[bi];
      if(bline.type==='text'){
        var bel=addLine(bline.cls||'low');
        if(bline.text){playLineStatic();await typeLine(bel,bline.text);}
        await sleep(220);
      }else if(bline.type==='dynamic'){
        var dr0=resolveDynamic(bline);
        var del0=addLine(dr0.cls||'dim');del0.textContent=dr0.text;await sleep(80);
      }
    }
  }else if(!archData){
    var errEl=addLine('denied');await typeLine(errEl,'> ERROR \u2014 NAVIGATION DATA UNAVAILABLE');
  }

  // ── PHASE 2: silent wait for all files to load or timeout ────────────────
  var failCount=0;
  for(var fi=0;fi<FILE_CHECK_MAP.length;fi++){
    var fc=FILE_CHECK_MAP[fi];
    var waited=0;
    while(!fc.ready()&&waited<3000){await sleep(80);waited+=80;}
    if(!fc.ok()) failCount++;
  }
  // Store result for system.boot_status dynamic variable
  window._bootFailCount=failCount;

  // ── PHASE 3: find L1 chat root node and render its body[] inline ──────────
  if(!typingAbort){
    var chatNodeId=findChatRootNode('l1');
    if(chatNodeId&&archData&&archData.nodes[chatNodeId]){
      var chatNode=archData.nodes[chatNodeId];
      if(chatNode.body&&chatNode.body.length){
        await sleep(200);
        for(var ci=0;ci<chatNode.body.length;ci++){
          if(typingAbort) break;
          var cb=chatNode.body[ci];
          if(cb.hidden) continue;
          if(cb.type==='text'){
            var cel=addLine(cb.cls||'full');
            if(cb.text){playLineStatic();await typeLine(cel,cb.text);}
            await sleep(60);
          }else if(cb.type==='dynamic'){
            var dr1=resolveDynamic(cb);
            var del1=addLine(dr1.cls||'dim');del1.textContent=dr1.text;await sleep(30);
          }else if(cb.type==='command'){
            var cCls=cb.cmd_type==='navigation'?'cmd-nav':cb.cmd_type==='pull'?'cmd-pull':'dim';
            var cEl=addLine(cCls);
            if(cb.text||cb.label){playLineStatic();await typeLine(cEl,(cb.text||(cb.label||'').trim()));}
            await sleep(40);
          }
        }
      }
    }
  }

  if(!typingAbort){
    termState='L1_NORMAL';currentMenuOpts=[];menuSelIdx=-1;
    var awEl=addLine('low');await typeLine(awEl,'> AWAITING INPUT');
    setActiveCursor(awEl);await sleep(400);
    inputRow.style.display='flex';termInput.focus();
  }
  typing=false;
}

// Find the root chat node for a given layer
function findChatRootNode(layerId){
  if(!archData||!archData.nodes) return null;
  var found=null;
  Object.keys(archData.nodes).forEach(function(nid){
    var n=archData.nodes[nid];
    if(n.node_type==='chat'&&n.layer===layerId&&n.is_root) found=nid;
  });
  return found;
}

function getStardate(){
  var now=new Date();var yr=now.getFullYear()+117;
  var start=new Date(now.getFullYear(),0,0);var day=Math.floor((now-start)/864e5);
  var dayStr=String(day).padStart(3,'0');
  var hh=String(now.getHours()).padStart(2,'0');var mm=String(now.getMinutes()).padStart(2,'0');
  var ss=String(now.getSeconds()).padStart(2,'0');
  return 'STARDATE '+yr+'.'+dayStr+'.'+hh+mm+'.'+ss;
}

var DYN_PAD = 30;
function resolveDynamic(b){
  var variable = b.variable||'';
  var label = (b.display_label||variable||'').padEnd(DYN_PAD,' ');
  var okText    = b.valid_text  || 'OK';
  var errText   = b.denied_text || 'ERROR';
  var labelCls  = b.label_cls   || b.cls || 'dim';
  var valueCls  = b.value_cls   || 'full';
  var ok, val, cls;
  if(variable==='file_status.personality'){ok=!!personality;}
  else if(variable==='file_status.lore'){ok=!!loreData;}
  else if(variable==='file_status.devlogs'){ok=!!devLogs;}
  else if(variable==='file_status.nodes'){ok=!!archData;}
  else if(variable==='file_status.engine'){ok=!!engineConfig;}
  else if(variable==='system.boot_status'){
    var fails=window._bootFailCount||0;
    val=fails===0?okText:errText+(fails>0?' \u2014 '+fails+' SUBSYSTEM'+(fails===1?'':'S')+' OFFLINE':'');
    cls=fails===0?valueCls:'warn';
    return{text:'> '+val,cls:cls};
  }
  else if(variable==='session.level'){return{text:'> '+label+String(currentLevel),cls:labelCls};}
  else if(variable==='session.node'){return{text:'> '+label+termState,cls:labelCls};}
  else if(variable==='session.discovered'){return{text:'> '+label+String(discoveredCount()),cls:labelCls};}
  else if(variable==='session.l3_visited'){return{text:'> '+label+(l3Visited?'TRUE':'FALSE'),cls:labelCls};}
  else if(variable==='node.title'){var cn=archData&&archData.nodes&&archData.nodes[termState];return{text:'> '+label+(cn?cn.title||'\u2014':'\u2014'),cls:labelCls};}
  else if(variable==='node.layer'){var cn2=archData&&archData.nodes&&archData.nodes[termState];return{text:'> '+label+(cn2?cn2.layer||'\u2014':'\u2014'),cls:labelCls};}
  else{return{text:'> '+label+'[?]',cls:'low'};}
  // file_status variables — two-part line: label at labelCls, value colored by ok/err
  val = ok ? '['+okText+']' : '['+errText+']';
  cls = ok ? valueCls : 'denied';
  return{text:'> '+label+val, cls:cls, ok:ok};
}

async function handleArchiveInput(val){
  // Close log-entry overlay if present
  if(window._logOverlay){try{window._logOverlay.parentNode.removeChild(window._logOverlay);}catch(e){}window._logOverlay=null;}

  // 1. LOCAL PRIORITY — match against current node's body[] commands
  if(archData&&archData.nodes&&archData.nodes[termState]){
    var node=archData.nodes[termState];var match=null;
    (node.body||[]).forEach(function(b){
      if(b.type==='command'&&(b.cmd_type==='navigation'||b.cmd_type==='loop')&&(b.label||'').trim()===val)match=b;
    });
    if(match){
      var u=addLine('user');u.textContent='> '+val;isResponding=true;var target=match.target;
      if(target==='__EXIT__'){await handleExit();}
      else if(target==='__BACK__'){await handleBack();}
      else if(target==='__ROOT__'){await handleRoot();}
      else if(target==='__TRANSITION_L2__'){if(l1ChatBackup===null)l1ChatBackup=output.innerHTML;await transitionToL2();isResponding=false;var r2=layerRootId('l2');if(r2)await renderArchivePage(r2);}
      else if(target==='__TRANSITION_L3__'){await transitionToL3();isResponding=false;var r3=layerRootId('l3');if(r3)await renderArchivePage(r3);}
      else if(target==='__FETCH__'){if(!isFetchRootState()){isResponding=false;await showFetchNodeError();}else{unlockMisc('fetch');isResponding=false;await startFetchStep2();}}
      else if(archData.nodes[target]){isResponding=false;await renderArchivePage(target);}
      else{isResponding=false;await showInvalidSelection();}
      return;
    }
  }

  // 2. GLOBAL FALLBACK — check global nodes (local had no match)
  var uG=addLine('user');uG.textContent='> '+val;
  isResponding=true;
  var globalHandled=await checkGlobalCommand(val);
  if(globalHandled){
    var plG=addLine('low');await typeLine(plG,'> AWAITING INPUT');setActiveCursor(plG);
    isResponding=false;output.scrollTop=output.scrollHeight;termInput.focus();return;
  }

  // 3. No match anywhere
  isResponding=false;
  await showInvalidSelection();
}

async function executeFetch(code){
  termInput.placeholder='';var u=addLine('user');u.textContent='> '+code;isResponding=true;

function pickVariant(egg){
  if(egg.variants){if(egg.weighted){var last=egg.variants[egg.variants.length-1];if(last.weight&&Math.random()<last.weight)return last;var pool=egg.variants.slice(0,egg.variants.length-1);return pool[Math.floor(Math.random()*pool.length)];}return egg.variants[Math.floor(Math.random()*egg.variants.length)];}
  return{lines:egg.lines,cls:egg.cls};
}
function checkEasterEgg(input){var lower=input.toLowerCase();if(!EASTER_EGGS)return null;for(var i=0;i<EASTER_EGGS.length;i++){var egg=EASTER_EGGS[i];for(var j=0;j<egg.keys.length;j++){if(lower.indexOf(egg.keys[j])>=0)return egg;}}return null;}
function checkAdmin(input){if(!ADMIN_KW)return false;var lower=input.toLowerCase();for(var i=0;i<ADMIN_KW.length;i++){if(lower.indexOf(ADMIN_KW[i])>=0)return true;}return false;}

  playIdlePop();
  var fadeMs=(typeof CFG_IDLE_FADE!=='undefined'&&CFG_IDLE_FADE)?CFG_IDLE_FADE:IDLE_FADE_FB;
  idleEl.style.transition='opacity '+fadeMs+'ms ease';
  setTimeout(function(){if(idleEl)idleEl.style.opacity='0';},600);
  setTimeout(function(){if(idleEl&&idleEl.parentNode)try{idleEl.parentNode.removeChild(idleEl);}catch(e){}idleEl=null;},fadeMs+700);
  idleTimer=setTimeout(showIdleMsg,CFG_IDLE_MS||IDLE_MS_FB);
}

// ── HELP — renders help node body[] from nodes.json ──────────────────────────
async function renderHelpNode(cmd){
  // If command has a target node, render its body[]
  var nodeId=cmd&&cmd.target?cmd.target:null;
  var node=nodeId&&archData&&archData.nodes&&archData.nodes[nodeId];
  if(!node){
    // Fall back to any node with node_type='help'
    if(archData&&archData.nodes){
      Object.keys(archData.nodes).forEach(function(nid){
        if(archData.nodes[nid].node_type==='help') node=archData.nodes[nid];
      });
    }
  }
  if(!node){
    var errH=addLine('denied');await typeLine(errH,'> ERROR \u2014 HELP NODE NOT CONFIGURED IN NODES.JSON');
    return;
  }
  if(node.title){var ht=addLine('full');await typeLine(ht,node.title);await sleep(60);}
  for(var i=0;i<(node.body||[]).length;i++){
    var b=node.body[i];
    if(b.type==='text'){var el=addLine(b.cls||'dim');if(b.text){playLineStatic();await typeLine(el,b.text);}await sleep(40);}
    else if(b.type==='dynamic'){var dr=resolveDynamic(b);var del=addLine(dr.cls||'dim');del.textContent=dr.text;await sleep(20);}
  }
}

// ── L1 COMMAND LOOKUP (from archData.l1_commands) ────────────────────────────
async function tryL1Command(val){
  if(!archData||!archData.l1_commands) return false;
  var cmd=null;
  for(var i=0;i<archData.l1_commands.length;i++){if(archData.l1_commands[i].label===val){cmd=archData.l1_commands[i];break;}}
  if(!cmd) return false;

  if(cmd.type==='help'){
    await renderHelpNode(cmd);
    var pl=addLine('low');await typeLine(pl,'> AWAITING INPUT');setActiveCursor(pl);
    isResponding=false;termInput.focus();return true;
  }
  if(cmd.type==='clear'){output.innerHTML='';isResponding=false;termInput.focus();return true;}
  if(cmd.type==='builtin'){
    if(cmd.target==='__ECHO_ARCHIVE__'||cmd.target==='__ENTER_ARCHIVE__'){
      playEggTone();var ac=addLine('full');if(CFG_STRINGS.layer_enter_confirmed){await typeLine(ac,CFG_STRINGS.layer_enter_confirmed);}else{await sleep(280);}await sleep(280);
      isResponding=false;await enterEchoArchive();
      var r1=layerRootId('l1');if(r1)await renderArchivePage(r1);return true;
    }
    if(cmd.target==='__CLEAR__'){output.innerHTML='';isResponding=false;termInput.focus();return true;}
    return false;
  }
  if(cmd.type==='navigate'&&cmd.target==='__HOME__'){
    var u=addLine('user');u.textContent='> '+val;
    await sleep(900);window.location.href='index.html';return true;
  }
  if(cmd.target&&archData.nodes&&archData.nodes[cmd.target]){
    await enterEchoArchive();isResponding=false;await renderArchivePage(cmd.target);return true;
  }
  var pl2=addLine('low');await typeLine(pl2,'> AWAITING INPUT');setActiveCursor(pl2);isResponding=false;termInput.focus();return true;
}

// ── L1 BRACKET HANDLER ────────────────────────────────────────────────────────
async function handleL1Bracket(val){
  isResponding=true;
  if(!archData){
    var errN=addLine('denied');await typeLine(errN,CFG_STRINGS.error_nav_offline);
    var plN=addLine('low');await typeLine(plN,'> AWAITING INPUT');setActiveCursor(plN);isResponding=false;termInput.focus();return;
  }

  // 1. l1_commands backward compat
  var handled=await tryL1Command(val);
  if(handled) return;

  // 2. L1 chat root node body[] commands (hidden or visible — all active in chat state)
  var chatNodeId=findChatRootNode('l1');
  if(chatNodeId&&archData.nodes[chatNodeId]){
    var chatNode=archData.nodes[chatNodeId];var chatMatch=null;
    (chatNode.body||[]).forEach(function(b){
      if(b.type==='command'&&(b.label||'').trim()===val) chatMatch=b;
    });
    if(chatMatch){
      var ct=chatMatch.cmd_type||'navigation';var tgt=chatMatch.target;
      if(ct==='pull'){
        await renderPullInline(tgt);
        var plP=addLine('low');await typeLine(plP,'> AWAITING INPUT');setActiveCursor(plP);
        isResponding=false;termInput.focus();return;
      }else{
        // Navigation — enter archive mode
        if(tgt==='__EXIT__'||tgt==='__BACK__'||!tgt){isResponding=false;termInput.focus();return;}
        if(tgt==='__TRANSITION_L2__'){if(l1ChatBackup===null)l1ChatBackup=output.innerHTML;await transitionToL2();isResponding=false;var rr2=layerRootId('l2');if(rr2)await renderArchivePage(rr2);return;}
        if(tgt==='__TRANSITION_L3__'){await transitionToL3();isResponding=false;var rr3=layerRootId('l3');if(rr3)await renderArchivePage(rr3);return;}
        if(archData.nodes[tgt]){await enterEchoArchive();isResponding=false;await renderArchivePage(tgt);return;}
      }
    }
  }

  // 3. Global node fallback
  var globalHandled=await checkGlobalCommand(val);
  if(globalHandled){
    var plG=addLine('low');await typeLine(plG,'> AWAITING INPUT');setActiveCursor(plG);
    isResponding=false;output.scrollTop=output.scrollHeight;termInput.focus();return;
  }

  // 4. Unrecognized
  playDenied();
  var errB=addLine('denied');await typeLine(errB,CFG_STRINGS.error_cmd_not_recognized);
  var pl=addLine('low');await typeLine(pl,'> AWAITING INPUT');setActiveCursor(pl);isResponding=false;output.scrollTop=output.scrollHeight;termInput.focus();
}

// ── L1 NORMAL INPUT ───────────────────────────────────────────────────────────
async function handleL1Input(val){
  resetIdleTimer();

  // Require personality.json for all chat responses
  if(!personality){
    isResponding=true;var uE=addLine('user');uE.textContent='> '+val;
    await sleep(120);var errP=addLine('denied');await typeLine(errP,CFG_STRINGS.error_personality_offline);
    var plE=addLine('low');await typeLine(plE,'> AWAITING INPUT');setActiveCursor(plE);isResponding=false;termInput.focus();return;
  }

  // ADMIN check — responses from personality.json
  if(checkAdmin(val)){
    isResponding=true;var u=addLine('user');u.textContent='> '+val;
    await sleep(120);playDenied();
    var pick=ADMIN_RESP[Math.floor(Math.random()*ADMIN_RESP.length)];
    for(var i=0;i<pick.length;i++){playThinkHum(200);await sleep(200);var el=addLine(i===0?'denied':'warn');await typeLine(el,pick[i]);await sleep(180);}
    var pl=addLine('low');await typeLine(pl,'> AWAITING INPUT');setActiveCursor(pl);isResponding=false;output.scrollTop=output.scrollHeight;termInput.focus();return;
  }

  // Bracket commands
  if(/^\[.+\]$/.test(val)){var u2=addLine('user');u2.textContent='> '+val;await handleL1Bracket(val);return;}

  // FETCH step 1
  if(val==='[FETCH LOG ENTRY: //]'){unlockMisc('fetch');await startFetchStep2();return;}

  // Knock knock
  if(/^KNOCK\s*KNOCK$/.test(val)){var u4=addLine('user');u4.textContent='> '+val;var kk=addLine('dim');await typeLine(kk,"> WHO'S THERE?");var kk2=addLine('low');await typeLine(kk2,'> AWAITING INPUT');setActiveCursor(kk2);output.scrollTop=output.scrollHeight;termInput.focus();return;}

  inputSlowed=(CFG_SLOW_WORDS||[]).some(function(w){return val.indexOf(w)>=0;});
  isResponding=true;var u5=addLine('user');u5.textContent='> '+(val||' ');await sleep(120);

  var egg=checkEasterEgg(val);
  if(egg){
    playEggTone();await sleep(300);var v=pickVariant(egg);
    for(var ei=0;ei<v.lines.length;ei++){var eel=addLine((v.cls&&v.cls[ei])||'dim');await typeLine(eel,v.lines[ei]);await sleep(280*0.8);}
  }else{
    playDenied();
    var dResp=DENIED[deniedIdx%DENIED.length];deniedIdx++;
    if(Math.random()<0.05){output.style.opacity='0.4';output.style.letterSpacing='0.12em';setTimeout(function(){output.style.opacity='';output.style.letterSpacing='';},120);}
    for(var ri=0;ri<dResp.length;ri++){if(!dResp[ri])continue;playThinkHum(200);await sleep(200);var isBad=dResp[ri].indexOf('COMMAND')>=0||dResp[ri].indexOf('ERROR')>=0||dResp[ri].indexOf('WARNING')>=0;var rel=addLine(isBad?'denied':'dim');await typeLine(rel,dResp[ri]);await sleep(280*0.6);}
  }
  var pl2=addLine('low');await typeLine(pl2,'> AWAITING INPUT');setActiveCursor(pl2);inputSlowed=false;isResponding=false;output.scrollTop=output.scrollHeight;termInput.focus();
}

// ── GLOBAL COMMAND SYSTEM ─────────────────────────────────────────────────────
// Returns the layer ID string for the current terminal level
function currentLayerId(){return'l'+currentLevel;}

// Scan all global nodes for a matching command label, respecting layer scope.
// Caller is responsible for user echo and isResponding — this function does neither.
// Returns true if a global command was found and executed, false otherwise.
async function checkGlobalCommand(val){
  if(!archData||!archData.nodes) return false;
  var lid=currentLayerId();
  var matchCmd=null;
  Object.keys(archData.nodes).forEach(function(nid){
    if(matchCmd) return;
    var n=archData.nodes[nid];
    if(n.node_type!=='global') return;
    var scope=n.layer_scope||null;
    if(scope&&scope!==lid) return;
    (n.body||[]).forEach(function(b){
      if(!matchCmd&&b.type==='command'&&(b.label||'').trim()===val) matchCmd=b;
    });
  });
  if(!matchCmd) return false;

  var ct=matchCmd.cmd_type||'navigation';
  if(ct==='pull'){
    await renderPullInline(matchCmd.target);
  }else if(ct==='navigation'){
    var target=matchCmd.target;
    if(!target||!archData.nodes[target]){
      var errG=addLine('denied');await typeLine(errG,CFG_STRINGS.error_target_not_found);
    }else{
      var tNode=archData.nodes[target];var tLid=tNode.layer||'l1';
      if(tLid!==lid){
        if(tLid==='l2'){if(l1ChatBackup===null)l1ChatBackup=output.innerHTML;await transitionToL2();}
        else if(tLid==='l3'){await transitionToL3();}
      }
      await renderArchivePage(target);
    }
  }
  return true;
}

// Render a node's body[] inline at the current position — no clear, no state change.
// Used by pull-type global commands (e.g. [HELP]).
async function renderPullInline(nodeId){
  if(!nodeId||!archData||!archData.nodes||!archData.nodes[nodeId]){
    var errP=addLine('denied');await typeLine(errP,CFG_STRINGS.error_pull_not_found);return;
  }
  var node=archData.nodes[nodeId];
  if(node.title){var ht=addLine('full',true);await typeLine(ht,node.title);await sleep(40);}
  for(var i=0;i<(node.body||[]).length;i++){
    var b=node.body[i];
    if(b.type==='text'){
      var el=addLine(b.cls||'dim',true);
      if(b.text){playLineStatic();await typeLine(el,b.text);}
      await sleep(40);
    }else if(b.type==='dynamic'){
      var dr=resolveDynamic(b);var del=addLine(dr.cls||'dim',true);del.textContent=dr.text;await sleep(20);
    }
  }
  // Subtle separator after inline pull content
  var sep=addLine('low',true);sep.textContent=SEP;await sleep(40);
}

// ── MAIN INPUT ROUTER ─────────────────────────────────────────────────────────
async function routeInput(val){
  if(!val&&termState!=='AWAITING_FETCH_CODE') return;

  if(termState==='AWAITING_FETCH_CODE'){
    termInput.placeholder='';
    if(!val){var el=addLine('low',true);await typeLine(el,CFG_STRINGS.error_fetch_cancelled);termState=preFetchState;preFetchState=null;currentMenuOpts=[];menuSelIdx=-1;termInput.value='';var pl=addLine('low');await typeLine(pl,'> AWAITING INPUT');setActiveCursor(pl);termInput.focus();return;}
    if(!FETCH_RE.test(val)){var er=addLine('denied',true);playDenied();await typeLine(er,CFG_STRINGS.error_fetch_format);var pl2=addLine('low');await typeLine(pl2,'> AWAITING INPUT');setActiveCursor(pl2);termInput.value='';termInput.focus();return;}
    await executeFetch(val.toUpperCase());return;
  }

  if(termState==='FETCH_RESULT'){
    var fetchPrev=preFetchState||'L1_NORMAL';preFetchState=null;termState=fetchPrev;
    if(fetchPrev==='L1_NORMAL'){setBreadcrumb('');setHeaderTitle('');var p=addLine('low');await typeLine(p,'> AWAITING INPUT');setActiveCursor(p);termInput.value='';termInput.focus();}
    else{await renderArchivePage(fetchPrev);}
    return;
  }

  if(termState==='archive_integrity_PAGE'){var u2=addLine('user');u2.textContent='> '+val;isResponding=true;await handleBack();isResponding=false;return;}
  if(termState==='L1_NORMAL'){await handleL1Input(val);return;}
  await handleArchiveInput(val);
}

// ── KEYDOWN HANDLER ───────────────────────────────────────────────────────────
termInput.addEventListener('keydown',async function(e){
  resetIdleTimer();
  // ── Typing click sounds (fix: was missing for regular chars) ──
  if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    playClick(e.key);
  }
  setTimeout(updateInvertHighlight,0);

  var isMenu=currentMenuOpts.length>0&&!isResponding;

  if(termState==='AWAITING_FETCH_CODE'){
    if(e.key==='Enter'){e.preventDefault();var v=termInput.value.trim().toUpperCase();termInput.value='';routeInput(v);}
    else if(e.key==='Escape'||(e.key==='ArrowLeft'&&termInput.value==='')||(e.key==='Backspace'&&termInput.value==='')){e.preventDefault();termInput.value='';routeInput('');}
    if(e.key==='Backspace') playBackspace();
    return;
  }

  if(e.key==='ArrowDown'&&isMenu){e.preventDefault();menuSelIdx=(menuSelIdx+1)%currentMenuOpts.length;termInput.value=currentMenuOpts[menuSelIdx];updateInvertHighlight();return;}
  if(e.key==='Tab'&&isMenu){e.preventDefault();menuSelIdx=(menuSelIdx+1)%currentMenuOpts.length;termInput.value=currentMenuOpts[menuSelIdx];updateInvertHighlight();return;}
  if(e.key==='ArrowUp'&&isMenu){e.preventDefault();menuSelIdx=((menuSelIdx-1)+currentMenuOpts.length)%currentMenuOpts.length;termInput.value=currentMenuOpts[menuSelIdx];updateInvertHighlight();return;}

  if(e.key==='ArrowUp'&&termState==='L1_NORMAL'&&!isResponding&&commandHistory.length){e.preventDefault();commandHistIdx=Math.max(0,commandHistIdx-1);termInput.value=commandHistory[commandHistIdx]||'';return;}
  if(e.key==='ArrowDown'&&termState==='L1_NORMAL'&&!isResponding){e.preventDefault();if(commandHistIdx<commandHistory.length-1){commandHistIdx++;termInput.value=commandHistory[commandHistIdx];}else{commandHistIdx=commandHistory.length;termInput.value='';}return;}

  if(e.key==='ArrowRight'&&termInput.value.trim()&&!isResponding){e.preventDefault();var v2=termInput.value.trim().toUpperCase();termInput.value='';if(termState==='L1_NORMAL'){commandHistory.push(v2);commandHistIdx=commandHistory.length;}playEnter();routeInput(v2);return;}
  if(e.key==='ArrowLeft'&&termInput.value===''&&!isResponding){e.preventDefault();if(termState!=='L1_NORMAL'&&termState!=='AWAITING_FETCH_CODE'){isResponding=true;await handleBack();}return;}
  if(e.key==='Escape'&&!isResponding){e.preventDefault();if(termState!=='L1_NORMAL'&&termState!=='AWAITING_FETCH_CODE'){isResponding=true;await handleExit();}return;}

  if(e.key==='Enter'&&!isResponding){
    e.preventDefault();var v5=termInput.value.trim().toUpperCase();termInput.value='';
    if(termState==='L1_NORMAL'&&v5){commandHistory.push(v5);commandHistIdx=commandHistory.length;}
    playEnter();routeInput(v5);return;
  }
  if(e.key==='Backspace') playBackspace();
});
