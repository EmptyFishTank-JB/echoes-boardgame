<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHOES // Loading Bar Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --white:#ffffff;
    --accent:#E8732A;
    --dim:rgba(255,255,255,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;
    font-family:'Share Tech Mono',monospace;
    position:relative;
    overflow:hidden;
  }
  /* faint scanlines — consistent with the rest of the site's terminal look,
     kept subtle so it doesn't fight the high-contrast bar itself */
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(0deg,
      rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px,
      transparent 1px, transparent 4px);
  }

  #bar-outline{
    position:relative;
    width:min(560px, 78vw);
    height:56px;
    border:4px solid var(--white);
    z-index:1;
  }
  #bar-fill{
    position:absolute;top:0;left:0;bottom:0;
    width:0%;
    background:var(--white);
  }

  #loading-label{
    z-index:1;
    color:var(--accent);
    font-size:15px;
    letter-spacing:0.45em;
    text-transform:uppercase;
    text-indent:0.45em; /* nudge for the letter-spacing so it optically centers */
  }
  #loading-label .dots{display:inline-block;width:1.4em;text-align:left;}

  #pctLine{
    z-index:1;
    color:var(--dim);
    font-size:11px;
    letter-spacing:0.2em;
    margin-top:-14px;
  }

  #controls{
    z-index:1;
    display:flex;gap:10px;margin-top:22px;
  }
  #controls button{
    font-family:'Share Tech Mono',monospace;
    font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--accent);background:transparent;
    border:1px solid var(--accent);border-radius:2px;
    padding:8px 14px;cursor:pointer;
  }
  #controls button:hover{background:rgba(232,115,42,0.12);}
  #controls label{
    display:flex;align-items:center;gap:6px;
    font-family:'Share Tech Mono',monospace;
    font-size:11px;color:var(--dim);
  }

  footer{
    position:fixed;bottom:18px;z-index:1;
    font-family:'Share Tech Mono',monospace;
    font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(255,255,255,0.2);
  }
</style>
</head>
<body>

<div id="bar-outline"><div id="bar-fill"></div></div>
<div id="loading-label">LOADING<span class="dots" id="dots"></span></div>
<div id="pctLine">0%</div>

<div id="controls">
  <button id="replayBtn">&#9654; Replay</button>
  <label>Speed
    <select id="speedSel">
      <option value="1200">Fast (1.2s)</option>
      <option value="2500" selected>Reference (2.5s)</option>
      <option value="4500">Slow (4.5s)</option>
    </select>
  </label>
</div>

<footer>ECHOES // artifact — loading bar reference, not wired into any real page yet</footer>

<script>
(function(){
  var fill = document.getElementById('bar-fill');
  var pctLine = document.getElementById('pctLine');
  var dots = document.getElementById('dots');
  var replayBtn = document.getElementById('replayBtn');
  var speedSel = document.getElementById('speedSel');

  var raf = null;
  var dotsTimer = null;

  function runFill(durationMs){
    if (raf) cancelAnimationFrame(raf);
    var start = null;
    function tick(ts){
      if (start === null) start = ts;
      var elapsed = ts - start;
      var pct = Math.min(100, (elapsed / durationMs) * 100);
      fill.style.width = pct + '%';
      pctLine.textContent = Math.floor(pct) + '%';
      if (pct < 100){
        raf = requestAnimationFrame(tick);
      } else {
        raf = null;
      }
    }
    fill.style.width = '0%';
    pctLine.textContent = '0%';
    raf = requestAnimationFrame(tick);
  }

  function runDots(){
    if (dotsTimer) clearInterval(dotsTimer);
    var n = 0;
    dotsTimer = setInterval(function(){
      n = (n + 1) % 4;
      dots.textContent = '.'.repeat(n);
    }, 400);
  }

  function play(){
    var duration = parseInt(speedSel.value, 10);
    runFill(duration);
    runDots();
  }

  replayBtn.addEventListener('click', play);
  speedSel.addEventListener('change', play);

  play();
})();
</script>

</body>
</html>
