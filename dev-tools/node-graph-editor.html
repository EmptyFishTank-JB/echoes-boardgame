<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODE GRAPH EDITOR // v3</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --blue:#4fc3f7;--amber:#bf7c0a;--red:#e05050;--green:#6fb06f;
  --dark:#00080e;--dim:rgba(79,195,247,0.40);--bdr:rgba(79,195,247,0.10);
  --canvas-bg:#152230;--outer-bg:#0a0f14;--canvas-border:#4fc3f7;
  --grid-minor:rgba(79,195,247,0.06);--grid-major:rgba(79,195,247,0.13);
}
html,body{height:100%;background:var(--outer-bg);color:var(--blue);font-family:"Share Tech Mono",monospace;font-size:18px;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;}

/* HEADER */
#hdr{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--bdr);flex-shrink:0;background:rgba(0,4,10,0.98);flex-wrap:wrap;}
.htitle{font-size:14px;letter-spacing:0.14em;flex:1;}
.hbtn{background:transparent;border:1px solid rgba(79,195,247,0.16);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:13px;letter-spacing:0.07em;padding:4px 11px;cursor:pointer;transition:all 0.15s;}
.hbtn:hover{border-color:var(--blue);color:var(--blue);}
#fstat{font-size:13px;padding:2px 9px;border:1px solid;letter-spacing:0.06em;}
#fstat.none{border-color:rgba(79,195,247,0.10);color:var(--dim);}
#fstat.ro{border-color:rgba(191,124,10,0.28);color:var(--amber);}
#fstat.rw{border-color:rgba(111,176,111,0.35);color:var(--green);}
#as-ind{color:var(--green);opacity:0;transition:opacity 0.4s;font-size:13px;}
#as-ind.show{opacity:1;}

/* TOOLBAR */
#toolbar{display:flex;align-items:center;gap:6px;padding:5px 13px;border-bottom:1px solid var(--bdr);flex-shrink:0;flex-wrap:wrap;}
.tbtn{background:transparent;border:1px solid rgba(79,195,247,0.14);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:13px;padding:4px 10px;cursor:pointer;transition:all 0.15s;letter-spacing:0.06em;white-space:nowrap;}
.tbtn:hover{border-color:var(--blue);color:var(--blue);}
.tbtn.on{border-color:var(--blue);color:var(--blue);background:rgba(79,195,247,0.07);}
.tbtn:disabled{opacity:0.25;cursor:not-allowed;}
.tsep{width:1px;height:20px;background:rgba(79,195,247,0.10);flex-shrink:0;margin:0 3px;}
#zoom-info{font-size:13px;color:var(--dim);min-width:44px;}
#srch{background:rgba(79,195,247,0.04);border:1px solid rgba(79,195,247,0.12);color:var(--blue);font-family:"Share Tech Mono",monospace;font-size:14px;padding:3px 9px;outline:none;width:160px;letter-spacing:0.04em;}
#srch::placeholder{color:rgba(79,195,247,0.22);}
#layer-filter{display:flex;gap:3px;}
.lf-btn{background:transparent;border:1px solid rgba(79,195,247,0.12);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:12px;padding:3px 9px;cursor:pointer;transition:opacity 0.15s;letter-spacing:0.06em;}
.lf-btn.on{opacity:1;}
.lf-btn.off{opacity:0.22;}

/* BODY */
#body{display:flex;flex:1;min-height:0;position:relative;}

/* CANVAS */
#canvas-wrap{flex:1;overflow:hidden;position:relative;background:var(--outer-bg);}
#canvas-wrap.grabbing{cursor:grabbing!important;}
#canvas-wrap.connecting{cursor:crosshair!important;}
#canvas-wrap.window-sel{cursor:crosshair!important;}
#canvas-outer{position:absolute;border:2px solid var(--canvas-border);}
#canvas-inner{position:absolute;top:0;left:0;transform-origin:0 0;}
#grid-canvas{position:absolute;top:0;left:0;pointer-events:none;}
#svg-layer{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}
#nodes-layer{position:absolute;top:0;left:0;}

/* NODES */
.gnode{position:absolute;min-width:200px;border-radius:2px;cursor:default;user-select:none;transition:box-shadow 0.12s;}
.gnode.l1_archive{border:1px solid rgba(79,195,247,0.45);background:rgba(2,14,26,0.97);}
.gnode.l2{border:1px solid rgba(191,124,10,0.55);background:rgba(14,10,0,0.97);}
.gnode.l3{border:1px solid rgba(224,80,80,0.55);background:rgba(12,2,2,0.97);}
.gnode.selected.l1_archive{border-color:#4fc3f7;box-shadow:0 0 0 1px #4fc3f7,0 6px 24px rgba(79,195,247,0.20);}
.gnode.selected.l2{border-color:#bf7c0a;box-shadow:0 0 0 1px #bf7c0a,0 6px 24px rgba(191,124,10,0.20);}
.gnode.selected.l3{border-color:#e05050;box-shadow:0 0 0 1px #e05050,0 6px 24px rgba(224,80,80,0.20);}
.gnode.multi-sel{box-shadow:0 0 0 2px #4fc3f7,0 0 12px rgba(79,195,247,0.25);}
.gnode-hdr{padding:7px 10px 7px 12px;display:flex;align-items:center;gap:6px;cursor:grab;border-bottom:1px solid rgba(79,195,247,0.09);}
.gnode.l2 .gnode-hdr{border-bottom-color:rgba(191,124,10,0.13);}
.gnode.l3 .gnode-hdr{border-bottom-color:rgba(224,80,80,0.13);}
.gnode-hdr:active{cursor:grabbing;}
.gnode-root-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.gnode.l1_archive .gnode-root-dot{background:#4fc3f7;}
.gnode.l2 .gnode-root-dot{background:#bf7c0a;}
.gnode.l3 .gnode-root-dot{background:#e05050;}
.gnode-id{font-size:12px;letter-spacing:0.07em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gnode.l1_archive .gnode-id{color:#4fc3f7;}
.gnode.l2 .gnode-id{color:#bf7c0a;}
.gnode.l3 .gnode-id{color:#e05050;}
.gnode-lyr{font-size:11px;color:rgba(79,195,247,0.28);flex-shrink:0;}
.gnode.l2 .gnode-lyr{color:rgba(191,124,10,0.38);}
.gnode.l3 .gnode-lyr{color:rgba(224,80,80,0.38);}
.gnode-field{padding:4px 12px;font-size:13px;border-bottom:1px solid rgba(79,195,247,0.06);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;transition:background 0.1s;}
.gnode-field:hover{background:rgba(79,195,247,0.04);}
.gnode.l2 .gnode-field{border-bottom-color:rgba(191,124,10,0.08);}
.gnode.l3 .gnode-field{border-bottom-color:rgba(224,80,80,0.08);}
.gnode-field-lbl{font-size:11px;color:rgba(79,195,247,0.30);margin-bottom:1px;}
.gnode.l2 .gnode-field-lbl{color:rgba(191,124,10,0.38);}
.gnode.l3 .gnode-field-lbl{color:rgba(224,80,80,0.38);}
.gnode-field-val{font-size:13px;color:rgba(79,195,247,0.70);}
.gnode.l2 .gnode-field-val{color:rgba(191,124,10,0.80);}
.gnode.l3 .gnode-field-val{color:rgba(224,80,80,0.80);}
.gnode-field input.inline-edit{background:transparent;border:none;border-bottom:1px solid rgba(79,195,247,0.40);color:var(--blue);font-family:"Share Tech Mono",monospace;font-size:13px;outline:none;width:100%;padding:0;}
.gnode-opts{padding:2px 0 4px;}
.gnode-opt{display:flex;align-items:center;height:28px;padding:0 8px 0 12px;font-size:13px;color:rgba(79,195,247,0.55);position:relative;}
.gnode.l2 .gnode-opt{color:rgba(191,124,10,0.65);}
.gnode.l3 .gnode-opt{color:rgba(224,80,80,0.65);}
.gnode-opt-lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px;}
/* PORTS */
.out-port{width:13px;height:13px;border-radius:50%;border:1px solid;position:absolute;right:-8px;top:50%;transform:translateY(-50%);cursor:crosshair;z-index:10;transition:all 0.1s;}
.in-port{width:13px;height:13px;border-radius:50%;border:1px solid;position:absolute;left:-8px;z-index:10;transition:all 0.1s;}
.gnode.l1_archive .out-port{border-color:rgba(79,195,247,0.45);background:#020e1a;}
.gnode.l1_archive .out-port:hover{border-color:#4fc3f7;background:rgba(79,195,247,0.32);}
.gnode.l2 .out-port{border-color:rgba(191,124,10,0.55);background:#0e0a00;}
.gnode.l2 .out-port:hover{border-color:#bf7c0a;background:rgba(191,124,10,0.32);}
.gnode.l3 .out-port{border-color:rgba(224,80,80,0.55);background:#0c0202;}
.gnode.l3 .out-port:hover{border-color:#e05050;background:rgba(224,80,80,0.32);}
.gnode.l1_archive .in-port{border-color:rgba(79,195,247,0.28);background:#020e1a;}
.gnode.l2 .in-port{border-color:rgba(191,124,10,0.38);background:#0e0a00;}
.gnode.l3 .in-port{border-color:rgba(224,80,80,0.38);background:#0c0202;}
.in-port.highlight{border-color:#4fc3f7!important;background:rgba(79,195,247,0.38)!important;box-shadow:0 0 8px rgba(79,195,247,0.55);}

/* DRAG HANDLE */
.drag-handle{width:5px;flex-shrink:0;cursor:col-resize;background:transparent;position:relative;border-left:1px solid var(--bdr);transition:background 0.15s;}
.drag-handle:hover,.drag-handle.dragging{background:rgba(79,195,247,0.07);}
.drag-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:40px;width:1px;background:rgba(79,195,247,0.20);}

/* INFO PANEL */
#info{width:300px;flex-shrink:0;display:flex;flex-direction:column;background:rgba(0,4,10,0.98);min-width:180px;max-width:800px;}
.iphdr{padding:7px 12px;font-size:14px;letter-spacing:0.12em;color:var(--dim);border-bottom:1px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.iphdr-btns{display:flex;gap:4px;}
.iphdr-btn{background:transparent;border:1px solid rgba(79,195,247,0.14);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:12px;padding:3px 8px;cursor:pointer;transition:all 0.15s;}
.iphdr-btn:hover{border-color:var(--blue);color:var(--blue);}
.iphdr-btn.on{border-color:var(--blue);color:var(--blue);background:rgba(79,195,247,0.07);}
#info-body{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
#info-code{flex:1;overflow-y:auto;font-size:13px;color:rgba(79,195,247,0.60);white-space:pre;padding:10px 12px;line-height:1.6;display:none;}
#info-empty{color:var(--dim);font-size:14px;line-height:2.4;text-align:center;padding:20px 0;}
.if{display:flex;flex-direction:column;gap:5px;}
.il{font-size:12px;color:rgba(79,195,247,0.38);letter-spacing:0.08em;}
input[type=text].iv-inp,select.iv-sel{background:rgba(79,195,247,0.05);border:1px solid rgba(79,195,247,0.14);color:var(--blue);font-family:"Share Tech Mono",monospace;font-size:14px;padding:5px 8px;outline:none;width:100%;transition:border-color 0.15s;}
input[type=text].iv-inp:focus,select.iv-sel:focus{border-color:rgba(79,195,247,0.40);}
select.iv-sel option{background:#001220;color:var(--blue);}
.toggle-row{display:flex;gap:4px;}
.tg{flex:1;background:transparent;border:1px solid rgba(79,195,247,0.12);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:13px;padding:5px 0;cursor:pointer;transition:all 0.15s;text-align:center;}
.tg.on{color:#001220;background:var(--blue);border-color:var(--blue);}
.sec-div{border-top:1px solid rgba(79,195,247,0.07);padding-top:8px;}
.conn-list{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
.conn-row{font-size:13px;padding:4px 7px;border:1px solid rgba(79,195,247,0.10);color:rgba(79,195,247,0.60);display:flex;gap:5px;align-items:center;}
.conn-arrow{color:rgba(79,195,247,0.28);flex-shrink:0;}
.conn-del{background:transparent;border:none;color:rgba(224,80,80,0.35);font-family:"Share Tech Mono",monospace;font-size:13px;cursor:pointer;padding:0 3px;transition:color 0.12s;flex-shrink:0;}
.conn-del:hover{color:#e05050;}
.add-btn{background:transparent;border:1px solid rgba(79,195,247,0.14);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:13px;padding:4px 8px;cursor:pointer;transition:all 0.15s;margin-top:4px;width:100%;}
.add-btn:hover{border-color:var(--blue);color:var(--blue);}
/* LEGEND */
#legend{padding:8px 12px;border-top:1px solid var(--bdr);flex-shrink:0;font-size:12px;color:rgba(79,195,247,0.30);line-height:2;}
.leg-row{display:flex;align-items:center;gap:7px;}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* MINIMAP */
#minimap{position:absolute;bottom:10px;right:0;width:150px;height:90px;border:1px solid rgba(79,195,247,0.16);background:rgba(0,4,10,0.90);pointer-events:none;overflow:hidden;z-index:20;}
#minimap-canvas{position:absolute;top:0;left:0;}
#minimap-vp{position:absolute;border:1px solid rgba(79,195,247,0.50);pointer-events:none;}
/* SELECTION BOX */
#sel-box{position:absolute;pointer-events:none;z-index:50;display:none;}
/* CONTEXT MENU */
#ctx-menu{position:fixed;background:rgba(2,10,20,0.98);border:1px solid rgba(79,195,247,0.24);z-index:1000;min-width:180px;display:none;box-shadow:0 8px 28px rgba(0,0,0,0.7);}
.ctx-item{padding:8px 16px;font-size:14px;color:rgba(79,195,247,0.78);cursor:pointer;letter-spacing:0.05em;transition:background 0.1s;}
.ctx-item:hover{background:rgba(79,195,247,0.08);color:var(--blue);}
.ctx-item.r{color:rgba(224,80,80,0.72);}
.ctx-item.r:hover{background:rgba(224,80,80,0.07);color:#e05050;}
.ctx-item.g{color:rgba(111,176,111,0.78);}
.ctx-item.g:hover{background:rgba(111,176,111,0.07);color:var(--green);}
.ctx-item:disabled,.ctx-item.dis{opacity:0.35;pointer-events:none;}
.ctx-sep{height:1px;background:rgba(79,195,247,0.09);margin:3px 0;}
/* COLOR PICKER POPUP */
#color-popup{position:fixed;background:rgba(2,10,20,0.98);border:1px solid rgba(79,195,247,0.24);z-index:1100;padding:14px;display:none;flex-direction:column;gap:10px;min-width:220px;box-shadow:0 8px 28px rgba(0,0,0,0.7);}
.cp-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);}
.cp-row label{flex:1;}
.cp-row input[type=color]{width:36px;height:28px;border:1px solid rgba(79,195,247,0.18);background:transparent;cursor:pointer;padding:1px;}
.cp-row input[type=range]{flex:1;accent-color:var(--blue);}
.cp-apply{background:transparent;border:1px solid rgba(79,195,247,0.28);color:var(--blue);font-family:"Share Tech Mono",monospace;font-size:13px;padding:5px;cursor:pointer;width:100%;transition:all 0.15s;}
.cp-apply:hover{border-color:var(--blue);background:rgba(79,195,247,0.07);}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(2,8,16,0.97);border:1px solid rgba(79,195,247,0.24);color:var(--blue);padding:6px 16px;font-size:14px;letter-spacing:0.05em;opacity:0;transition:opacity 0.22s;pointer-events:none;z-index:2000;}
#toast.show{opacity:1;}
::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(79,195,247,0.12);}
</style>
</head>
<body>
<div id="app">
<div id="hdr">
  <span class="htitle">NODE GRAPH EDITOR // v3</span>
  <span id="as-ind">&#10003; SAVED</span>
  <span id="fstat" class="none">NO FILE</span>
  <button class="hbtn" onclick="openFile()">&#8213; OPEN</button>
  <button class="hbtn" onclick="saveToFile()">&#8679; SAVE</button>
  <button class="hbtn" onclick="dlJSON()">&#8595; EXPORT</button>
</div>
<div id="toolbar">
  <button class="tbtn on" id="btn-sel" onclick="setTool('select')">&#9654; SELECT</button>
  <button class="tbtn" id="btn-pan" onclick="setTool('pan')">&#10021; PAN</button>
  <div class="tsep"></div>
  <button class="tbtn" id="undo-btn" onclick="doUndo()" disabled>&#8617; UNDO</button>
  <button class="tbtn" id="redo-btn" onclick="doRedo()" disabled>&#8618; REDO</button>
  <div class="tsep"></div>
  <button class="tbtn" onclick="addNode()">&#43; NODE</button>
  <button class="tbtn" onclick="autoOrganize()">&#9783; AUTO-ORGANIZE</button>
  <button class="tbtn" onclick="resetView()">&#9635; FIT</button>
  <span id="zoom-info">100%</span>
  <div class="tsep"></div>
  <input id="srch" type="text" placeholder="SEARCH..." oninput="onSearch()" autocomplete="off" spellcheck="false">
  <div class="tsep"></div>
  <div id="layer-filter">
    <button class="lf-btn on" id="lf-l1_archive" style="color:#4fc3f7;border-color:rgba(79,195,247,0.35);" onclick="toggleLayer('l1_archive')">L1</button>
    <button class="lf-btn on" id="lf-l2" style="color:#bf7c0a;border-color:rgba(191,124,10,0.40);" onclick="toggleLayer('l2')">L2</button>
    <button class="lf-btn on" id="lf-l3" style="color:#e05050;border-color:rgba(224,80,80,0.40);" onclick="toggleLayer('l3')">L3</button>
  </div>
</div>
<div id="body">
  <div id="canvas-wrap">
    <div id="canvas-outer">
      <div id="canvas-inner">
        <canvas id="grid-canvas"></canvas>
        <svg id="svg-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="nodes-layer"></div>
      </div>
    </div>
    <div id="sel-box"></div>
    <div id="minimap"><canvas id="minimap-canvas" width="150" height="90"></canvas><div id="minimap-vp"></div></div>
  </div>
  <div class="drag-handle" id="dh-r" onmousedown="startPanelDrag(event)"></div>
  <div id="info">
    <div class="iphdr">
      <span>&#9658; NODE INFO</span>
      <div class="iphdr-btns">
        <button class="iphdr-btn on" id="btn-details" onclick="setInfoMode('details')">DETAILS</button>
        <button class="iphdr-btn" id="btn-code" onclick="setInfoMode('code')">JSON</button>
      </div>
    </div>
    <div id="info-body"><div id="info-empty">Select a node<br>to view details.</div></div>
    <div id="info-code">// No node selected</div>
    <div id="legend">
      <div class="leg-row"><div class="leg-dot" style="background:#4fc3f7"></div>L1 ARCHIVE</div>
      <div class="leg-row"><div class="leg-dot" style="background:#bf7c0a"></div>L2 ECHO PROTOCOL</div>
      <div class="leg-row"><div class="leg-dot" style="background:#e05050"></div>L3 DEEP ARCHIVE</div>
      <div style="margin-top:4px;">SCROLL=zoom · F=fit · DEL=delete<br>Drag L→R: window sel · R→L: cross sel<br>Right-click node/canvas for options<br>Double-click field to edit inline</div>
    </div>
  </div>
</div>
</div>

<!-- CONTEXT MENUS -->
<div id="ctx-menu"></div>
<!-- COLOR PICKER POPUP -->
<div id="color-popup">
  <div id="cp-title" style="font-size:14px;letter-spacing:0.10em;color:var(--dim);"></div>
  <div id="cp-fields"></div>
  <button class="cp-apply" onclick="applyColorPopup()">&#10003; APPLY</button>
  <button class="cp-apply" style="border-color:rgba(79,195,247,0.12);color:var(--dim);margin-top:-4px;" onclick="closeColorPopup()">CANCEL</button>
</div>

<input type="file" id="fi" accept=".json" style="display:none" onchange="onFileIn(event)">
<div id="toast"></div>

<script>
'use strict';
// ── STATE ─────────────────────────────────────────────────────────────────────
var arch=null, positions={}, selectedNode=null, multiSel=[];
var tool='select', pan={x:80,y:80}, zoom=1.0;
var layerVis={l1_archive:true,l2:true,l3:true}, searchStr='';
var fileHandle=null, infoMode='details';
var hist=[], histIdx=-1;
var ctxNodeId=null, clipboard=null;
var CANVAS_W=4000, CANVAS_H=3000, NODE_W=200;
var LAYER_COLOR={l1_archive:'#4fc3f7',l2:'#bf7c0a',l3:'#e05050'};
var LAYER_LABEL={l1_archive:'L1',l2:'L2',l3:'L3'};
var LAYER_FULL={l1_archive:'L1 ARCHIVE',l2:'L2 ECHO PROTOCOL',l3:'L3 DEEP ARCHIVE'};
// Drag states
var nodeDrag=null, panDrag=null, panelDrag=null, connecting=null;
var selBox=null; // {startX,startY,startCanvasX,startCanvasY}
// Color popup
var cpTarget=null, cpFields=[];

// ── FAVICON ───────────────────────────────────────────────────────────────────
(function(){var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="8" cy="16" r="5" fill="#4fc3f7" opacity="0.9"/><circle cx="24" cy="8" r="5" fill="#bf7c0a" opacity="0.9"/><circle cx="24" cy="24" r="5" fill="#e05050" opacity="0.9"/><line x1="13" y1="14" x2="19" y2="10" stroke="#4fc3f7" stroke-width="1.5" opacity="0.6"/><line x1="13" y1="18" x2="19" y2="22" stroke="#4fc3f7" stroke-width="1.5" opacity="0.6"/></svg>';var el=document.createElement('link');el.rel='icon';el.type='image/svg+xml';el.href='data:image/svg+xml;base64,'+btoa(s);document.head.appendChild(el);})();

// ── HISTORY ───────────────────────────────────────────────────────────────────
function pushHist(){
  if(!arch)return;
  var snap=JSON.stringify({arch:arch,positions:positions});
  // Don't push if nothing changed
  if(hist.length&&hist[histIdx]===snap)return;
  hist=hist.slice(0,histIdx+1);
  hist.push(snap);
  if(hist.length>80)hist.shift();
  histIdx=hist.length-1;
  updHistUI();
}
function restoreSnap(snap){var s=JSON.parse(snap);arch=s.arch;positions=s.positions;}
function doUndo(){
  if(histIdx<=0){toast('Nothing to undo');return;}
  histIdx--;restoreSnap(hist[histIdx]);
  render();if(selectedNode&&arch.nodes[selectedNode])showInfo(selectedNode);else{selectedNode=null;showEmpty();}
  updHistUI();toast('Undo');
}
function doRedo(){
  if(histIdx>=hist.length-1){toast('Nothing to redo');return;}
  histIdx++;restoreSnap(hist[histIdx]);
  render();if(selectedNode&&arch.nodes[selectedNode])showInfo(selectedNode);else{selectedNode=null;showEmpty();}
  updHistUI();toast('Redo');
}
function updHistUI(){
  document.getElementById('undo-btn').disabled=histIdx<=0;
  document.getElementById('redo-btn').disabled=histIdx>=hist.length-1;
}

// ── FILE I/O ──────────────────────────────────────────────────────────────────
async function openFile(){
  if(window.showOpenFilePicker){try{var[h]=await window.showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}]});fileHandle=h;var f=await h.getFile();loadArch(JSON.parse(await f.text()),f.name,'rw');}catch(e){if(e.name!=='AbortError')document.getElementById('fi').click();}}
  else document.getElementById('fi').click();
}
function onFileIn(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{loadArch(JSON.parse(ev.target.result),f.name,'ro');}catch(ex){toast('Parse error: '+ex.message);}};r.readAsText(f);e.target.value='';}
function loadArch(raw,name,cls){
  arch=raw;positions={};
  var saved=(arch.meta&&arch.meta.node_positions)||{};
  Object.keys(arch.nodes||{}).forEach(function(id){if(saved[id])positions[id]={x:saved[id].x,y:saved[id].y};});
  autoLayout();pushHist();render();resetView();
  setFstat(name,cls);toast('Loaded '+Object.keys(arch.nodes||{}).length+' nodes');
}
function setFstat(n,c){var el=document.getElementById('fstat');el.textContent=n;el.className=c;}
function buildExport(){if(!arch)return'{}';if(!arch.meta)arch.meta={};arch.meta.node_positions=JSON.parse(JSON.stringify(positions));return JSON.stringify(arch,null,2);}
async function saveToFile(){if(!fileHandle){dlJSON();return;}try{var w=await fileHandle.createWritable();await w.write(buildExport());await w.close();showSaved();toast('Saved');}catch(e){toast('Save failed — downloading');dlJSON();}}
function dlJSON(){var b=new Blob([buildExport()],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nodes.json';a.click();showSaved();toast('Exported');}
function showSaved(){var i=document.getElementById('as-ind');i.classList.add('show');setTimeout(function(){i.classList.remove('show');},1800);}

// ── LAYOUT ────────────────────────────────────────────────────────────────────
function autoLayout(){
  if(!arch||!arch.nodes)return;
  var nodes=arch.nodes;
  var cols={l1_archive:[],l2:[],l3:[]};
  Object.keys(nodes).forEach(function(id){if(!positions[id]){var lyr=nodes[id].layer||'l1_archive';(cols[lyr]=cols[lyr]||[]).push(id);}});
  var COL_X={l1_archive:100,l2:380,l3:660};
  Object.keys(cols).forEach(function(lyr){
    var roots=cols[lyr].filter(function(id){return nodes[id].is_root;});
    var rest=cols[lyr].filter(function(id){return !nodes[id].is_root;});
    roots.concat(rest).forEach(function(id,i){positions[id]={x:COL_X[lyr]||100,y:60+i*180};});
  });
}

function autoOrganize(){
  if(!arch||!arch.nodes)return;
  // Dagre-style BFS layout by layer then depth
  var nodes=arch.nodes;
  var byLayer={l1_archive:[],l2:[],l3:[]};
  Object.keys(nodes).forEach(function(id){var lyr=nodes[id].layer||'l1_archive';(byLayer[lyr]=byLayer[lyr]||[]).push(id);});
  var COL_X={l1_archive:80,l2:360,l3:640};
  var ROW_H=180, PAD_Y=60;
  Object.keys(byLayer).forEach(function(lyr){
    var ids=byLayer[lyr];
    // roots first
    var roots=ids.filter(function(id){return nodes[id].is_root;});
    var rest=ids.filter(function(id){return !nodes[id].is_root;});
    // BFS from each root
    var visited={}, order=[];
    function bfs(startId){if(visited[startId])return;visited[startId]=true;order.push(startId);(nodes[startId].options||[]).forEach(function(o){if(o.target&&nodes[o.target]&&nodes[o.target].layer===lyr)bfs(o.target);});}
    roots.forEach(bfs);
    rest.forEach(function(id){if(!visited[id])bfs(id);});
    order.forEach(function(id,i){positions[id]={x:COL_X[lyr]||80,y:PAD_Y+i*ROW_H};});
  });
  pushHist();render();resetView();toast('Nodes organized');
}

// ── GRID ─────────────────────────────────────────────────────────────────────
function drawGrid(){
  var gc=document.getElementById('grid-canvas');
  gc.width=CANVAS_W;gc.height=CANVAS_H;gc.style.width=CANVAS_W+'px';gc.style.height=CANVAS_H+'px';
  var ctx=gc.getContext('2d');ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  var GLX=CANVAS_W,GLY=CANVAS_H; // grid covers this area; beyond is darker
  // Beyond-grid fill
  var beyondCol=window._beyondGridColor||'#0a0f14';
  ctx.fillStyle=beyondCol;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  // Grid area fill (lighter canvas bg)
  var canvasBg=getComputedStyle(document.documentElement).getPropertyValue('--canvas-bg').trim()||'#152230';
  ctx.fillStyle=canvasBg;ctx.fillRect(0,0,GLX,GLY);
  // Dashed boundary between grid area and beyond
  ctx.strokeStyle='rgba(79,195,247,0.20)';ctx.lineWidth=1;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(GLX,0);ctx.lineTo(GLX,GLY);ctx.lineTo(0,GLY);ctx.stroke();
  ctx.setLineDash([]);
  // Minor grid lines
  var minor=window._gridMinorColor||'rgba(79,195,247,0.06)';
  ctx.strokeStyle=minor;ctx.lineWidth=1;
  for(var x=0;x<=GLX;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GLY);ctx.stroke();}
  for(var y=0;y<=GLY;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(GLX,y);ctx.stroke();}
  // Major grid lines
  var major=window._gridMajorColor||'rgba(79,195,247,0.13)';
  ctx.strokeStyle=major;ctx.lineWidth=1;
  for(var x2=0;x2<=GLX;x2+=100){ctx.beginPath();ctx.moveTo(x2,0);ctx.lineTo(x2,GLY);ctx.stroke();}
  for(var y2=0;y2<=GLY;y2+=100){ctx.beginPath();ctx.moveTo(0,y2);ctx.lineTo(GLX,y2);ctx.stroke();}
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function applyTransform(){
  document.getElementById('canvas-inner').style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+zoom+')';
  document.getElementById('zoom-info').textContent=Math.round(zoom*100)+'%';
}
function sizeCanvas(){
  var outer=document.getElementById('canvas-outer');
  outer.style.cssText='width:'+CANVAS_W+'px;height:'+CANVAS_H+'px;position:absolute;top:0;left:0;background:var(--canvas-bg);border:2px solid var(--canvas-border);';
}

function render(){
  if(!arch)return;
  applyTransform();
  var nodes=arch.nodes||{};
  var nl=document.getElementById('nodes-layer');nl.innerHTML='';
  var svg=document.getElementById('svg-layer');svg.innerHTML='';
  svg.setAttribute('width',CANVAS_W);svg.setAttribute('height',CANVAS_H);
  svg.style.width=CANVAS_W+'px';svg.style.height=CANVAS_H+'px';

  var nodeEls={};
  Object.keys(nodes).forEach(function(id){
    var n=nodes[id],lyr=n.layer||'l1_archive';
    var show=layerVis[lyr]&&(!searchStr||id.toLowerCase().indexOf(searchStr)>=0||(n.title||'').toLowerCase().indexOf(searchStr)>=0);
    if(!show)return;
    var pos=positions[id]||{x:0,y:0};
    var isSel=selectedNode===id, isMulti=multiSel.indexOf(id)>=0;

    var el=document.createElement('div');
    el.className='gnode '+lyr+(isSel?' selected':'')+(isMulti&&!isSel?' multi-sel':'');
    el.id='gn-'+id;
    el.style.cssText='left:'+pos.x+'px;top:'+pos.y+'px;width:'+NODE_W+'px;position:absolute;';

    // Input port
    var inp=document.createElement('div');inp.className='in-port';inp.id='inp-'+id;el.appendChild(inp);

    // Header
    var hdr=document.createElement('div');hdr.className='gnode-hdr';
    if(n.is_root){var dot=document.createElement('div');dot.className='gnode-root-dot';hdr.appendChild(dot);}
    var idSp=document.createElement('div');idSp.className='gnode-id';idSp.textContent=id;hdr.appendChild(idSp);
    var lyrSp=document.createElement('div');lyrSp.className='gnode-lyr';lyrSp.textContent=LAYER_LABEL[lyr]||lyr;hdr.appendChild(lyrSp);
    hdr.addEventListener('contextmenu',function(e){e.preventDefault();e.stopPropagation();showNodeCtxMenu(e,id);});
    hdr.addEventListener('mousedown',function(e){if(e.button!==0)return;e.stopPropagation();startNodeDrag(e,id);});
    hdr.addEventListener('dblclick',function(e){e.stopPropagation();inlineEditId(id);});
    el.appendChild(hdr);

    // Inline editable fields
    if(n.title!==undefined)el.appendChild(mkInlineField('title',id,n.title,'TITLE'));

    // Options with out-ports
    var opts=n.options||[];
    if(opts.length){
      var optsDiv=document.createElement('div');optsDiv.className='gnode-opts';
      opts.forEach(function(opt,oi){
        var row=document.createElement('div');row.className='gnode-opt';
        var lbl=document.createElement('div');lbl.className='gnode-opt-lbl';lbl.textContent=opt.label||'';
        lbl.addEventListener('dblclick',function(e){e.stopPropagation();inlineEditCmdLabel(id,oi,lbl);});
        row.appendChild(lbl);
        var port=document.createElement('div');port.className='out-port';
        port.dataset.nodeid=id;port.dataset.optidx=oi;
        port.addEventListener('mousedown',function(e){e.stopPropagation();e.preventDefault();startConnect(e,id,oi);});
        row.appendChild(port);
        optsDiv.appendChild(row);
      });
      el.appendChild(optsDiv);
    }

    el.addEventListener('click',function(e){if(connecting)return;selectNode(id);});
    nl.appendChild(el);nodeEls[id]=el;
  });

  requestAnimationFrame(function(){
    Object.keys(nodeEls).forEach(function(id){
      var el=nodeEls[id];var inp=document.getElementById('inp-'+id);
      if(inp)inp.style.top=Math.round(el.offsetHeight/2)+'px';
    });
    drawConnections(nodes);updateMinimap();
  });
}

function mkInlineField(prop,nodeId,val,lbl){
  var wrap=document.createElement('div');wrap.className='gnode-field';
  var ll=document.createElement('div');ll.className='gnode-field-lbl';ll.textContent=lbl;wrap.appendChild(ll);
  var vl=document.createElement('div');vl.className='gnode-field-val';vl.textContent=val||'—';wrap.appendChild(vl);
  wrap.addEventListener('dblclick',function(e){
    e.stopPropagation();
    vl.innerHTML='';
    var inp=document.createElement('input');inp.type='text';inp.className='inline-edit';inp.value=val||'';
    vl.appendChild(inp);inp.focus();inp.select();
    function commit(){
      var nv=inp.value;
      if(arch&&arch.nodes&&arch.nodes[nodeId]){arch.nodes[nodeId][prop]=nv;val=nv;autoSetPath(nodeId);}
      vl.textContent=nv||'—';pushHist();
      if(selectedNode===nodeId)showInfo(nodeId);
    }
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')commit();if(e.key==='Escape'){vl.textContent=val||'—';}});
  });
  return wrap;
}

// ── CONNECTIONS ───────────────────────────────────────────────────────────────
function getPortPos(nodeId,oi){
  var pos=positions[nodeId]||{x:0,y:0};
  var el=document.getElementById('gn-'+nodeId);if(!el)return{x:pos.x+NODE_W,y:pos.y+40};
  var ports=el.querySelectorAll('.out-port');
  if(ports[oi]){var pr=ports[oi];var top=pr.offsetTop+pr.offsetParent.offsetTop+6;return{x:pos.x+NODE_W,y:pos.y+top};}
  return{x:pos.x+NODE_W,y:pos.y+40};
}
function getInPortPos(nodeId){
  var pos=positions[nodeId]||{x:0,y:0};
  var el=document.getElementById('gn-'+nodeId);var h=el?el.offsetHeight:80;
  return{x:pos.x,y:pos.y+h/2};
}
function drawConnections(nodes){
  var svg=document.getElementById('svg-layer');
  svg.querySelectorAll('.cp,.ca').forEach(function(e){e.remove();});
  Object.keys(nodes).forEach(function(id){
    var n=nodes[id],lyr=n.layer||'l1_archive';
    if(!layerVis[lyr]||!document.getElementById('gn-'+id))return;
    (n.options||[]).forEach(function(opt,oi){
      var tgt=opt.target;if(!tgt||!nodes[tgt]||!document.getElementById('gn-'+tgt))return;
      var p1=getPortPos(id,oi),p2=getInPortPos(tgt);
      var isSel=(id===selectedNode||tgt===selectedNode||multiSel.indexOf(id)>=0||multiSel.indexOf(tgt)>=0);
      var col=LAYER_COLOR[lyr]||'#4fc3f7';
      var cp=Math.max(60,Math.abs(p2.x-p1.x)*0.5);
      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.classList.add('cp');
      path.setAttribute('d','M'+p1.x+','+p1.y+' C'+(p1.x+cp)+','+p1.y+' '+(p2.x-cp)+','+p2.y+' '+p2.x+','+p2.y);
      path.setAttribute('stroke',col);path.setAttribute('stroke-width',isSel?'2':'1.5');
      path.setAttribute('fill','none');path.setAttribute('opacity',isSel?'0.80':'0.38');
      if(!isSel)path.setAttribute('stroke-dasharray','5,4');
      svg.appendChild(path);
      var ang=Math.atan2(p2.y-p1.y,p2.x-p1.x),al=9;
      var arr=document.createElementNS('http://www.w3.org/2000/svg','polyline');arr.classList.add('ca');
      arr.setAttribute('points',(p2.x-al*Math.cos(ang-0.4))+','+(p2.y-al*Math.sin(ang-0.4))+' '+p2.x+','+p2.y+' '+(p2.x-al*Math.cos(ang+0.4))+','+(p2.y-al*Math.sin(ang+0.4)));
      arr.setAttribute('stroke',col);arr.setAttribute('stroke-width',isSel?'2':'1.5');arr.setAttribute('fill','none');arr.setAttribute('opacity',isSel?'0.80':'0.45');
      svg.appendChild(arr);
    });
  });
}

// ── PATH AUTO-SET ─────────────────────────────────────────────────────────────
function autoSetPath(nodeId){
  if(!arch||!arch.nodes||!arch.nodes[nodeId])return;
  var n=arch.nodes[nodeId];
  // Build path: find parent chain
  var chain=[];var cur=nodeId;var visited={};
  while(cur&&!visited[cur]){
    visited[cur]=true;chain.unshift(cur);
    var par=null;
    Object.keys(arch.nodes).forEach(function(sid){if(par)return;(arch.nodes[sid].options||[]).forEach(function(o){if(o.target===cur)par=sid;});});
    cur=par;
  }
  // Build path string from titles
  var parts=chain.map(function(id){var nd=arch.nodes[id];return nd?(nd.title||id):id;});
  n.breadcrumb=parts.join(' > ');
}
function autoSetAllPaths(){
  if(!arch||!arch.nodes)return;
  Object.keys(arch.nodes).forEach(function(id){autoSetPath(id);});
}

// ── SELECTION ─────────────────────────────────────────────────────────────────
function selectNode(id){selectedNode=id;multiSel=[];render();showInfo(id);}
function showEmpty(){document.getElementById('info-body').innerHTML='<div id="info-empty">Select a node<br>to view details.</div>';showAllCode();}
function showAllCode(){document.getElementById('info-code').textContent=arch?JSON.stringify(arch.nodes||{},null,2):'// No file loaded';}

// ── INLINE EDIT ID ────────────────────────────────────────────────────────────
function inlineEditId(id){
  var el=document.getElementById('gn-'+id);if(!el)return;
  var idSp=el.querySelector('.gnode-id');if(!idSp)return;
  var inp=document.createElement('input');inp.type='text';inp.className='inline-edit';inp.style.cssText='font-size:12px;width:100%;';inp.value=id;
  idSp.textContent='';idSp.appendChild(inp);inp.focus();inp.select();
  function commit(){
    var newId=inp.value.trim().toUpperCase().replace(/\s+/g,'_');
    if(newId&&newId!==id&&!arch.nodes[newId]){renameNode(id,newId);return;}
    idSp.textContent=id;
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')commit();if(e.key==='Escape')idSp.textContent=id;});
}

function inlineEditCmdLabel(nodeId,oi,lbl){
  var orig=lbl.textContent;
  var inp=document.createElement('input');inp.type='text';inp.style.cssText='font-size:13px;background:transparent;border:none;border-bottom:1px solid rgba(79,195,247,0.40);color:var(--blue);font-family:\'Share Tech Mono\',monospace;outline:none;width:100%;';inp.value=orig;
  lbl.textContent='';lbl.appendChild(inp);inp.focus();inp.select();
  function commit(){
    var nv=inp.value;
    if(arch&&arch.nodes&&arch.nodes[nodeId]&&arch.nodes[nodeId].options[oi]){arch.nodes[nodeId].options[oi].label=nv;pushHist();}
    lbl.textContent=nv;if(selectedNode===nodeId)showInfo(nodeId);
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')commit();if(e.key==='Escape')lbl.textContent=orig;});
}

// ── NODE DRAG ─────────────────────────────────────────────────────────────────
function startNodeDrag(e,id){
  if(tool==='pan')return;
  selectNode(id);
  var pos=positions[id]||{x:0,y:0};
  nodeDrag={id:id,startX:e.clientX,startY:e.clientY,startNX:pos.x,startNY:pos.y};
}

// ── CONNECT ───────────────────────────────────────────────────────────────────
function startConnect(e,nodeId,optIdx){
  connecting={fromNode:nodeId,fromOptIdx:optIdx};
  document.getElementById('canvas-wrap').classList.add('connecting');
}

// ── CANVAS MOUSE ─────────────────────────────────────────────────────────────
var selBoxStart=null;

document.getElementById('canvas-wrap').addEventListener('mousedown',function(e){
  if(e.target.classList.contains('out-port'))return;
  hideCtxMenu();closeColorPopup();
  if(e.button===2)return; // handled by contextmenu
  if(e.button===1||(e.button===0&&tool==='pan')){
    e.preventDefault();
    panDrag={startX:e.clientX,startY:e.clientY,startPX:pan.x,startPY:pan.y};
    this.classList.add('grabbing');return;
  }
  if(e.button===0&&tool==='select'){
    // Only start sel box if clicking on canvas background
    var tgt=e.target;
    var onNode=tgt.closest&&tgt.closest('.gnode');
    if(!onNode){
      var rect=this.getBoundingClientRect();
      var cx=(e.clientX-rect.left-pan.x)/zoom;
      var cy=(e.clientY-rect.top-pan.y)/zoom;
      selBoxStart={clientX:e.clientX,clientY:e.clientY,canvasX:cx,canvasY:cy};
      selectedNode=null;multiSel=[];render();
    }
  }
});

document.getElementById('canvas-wrap').addEventListener('contextmenu',function(e){
  e.preventDefault();
  var tgt=e.target;
  var onNode=tgt.closest&&tgt.closest('.gnode');
  if(!onNode){showCanvasCtxMenu(e);}
});

document.addEventListener('mousemove',function(e){
  if(nodeDrag){
    var dx=(e.clientX-nodeDrag.startX)/zoom,dy=(e.clientY-nodeDrag.startY)/zoom;
    var nx=Math.max(0,Math.min(CANVAS_W-NODE_W,nodeDrag.startNX+dx));
    var ny=Math.max(0,Math.min(CANVAS_H-200,nodeDrag.startNY+dy));
    positions[nodeDrag.id]={x:nx,y:ny};
    var el=document.getElementById('gn-'+nodeDrag.id);
    if(el){el.style.left=nx+'px';el.style.top=ny+'px';}
    requestAnimationFrame(function(){drawConnections(arch.nodes||{});updateMinimap();});
    autoSetPath(nodeDrag.id);return;
  }
  if(panDrag){pan.x=panDrag.startPX+(e.clientX-panDrag.startX);pan.y=panDrag.startPY+(e.clientY-panDrag.startY);applyTransform();updateMinimap();return;}
  if(panelDrag){var dx2=panelDrag.startX-e.clientX;document.getElementById('info').style.width=Math.max(180,Math.min(800,panelDrag.startW+dx2))+'px';return;}
  if(selBoxStart){
    var dx3=e.clientX-selBoxStart.clientX,dy3=e.clientY-selBoxStart.clientY;
    var sb=document.getElementById('sel-box');
    var isWindow=dx3>0; // L→R = window, R→L = crossing
    var wrapRect=document.getElementById('canvas-wrap').getBoundingClientRect();
    var sx=Math.min(e.clientX,selBoxStart.clientX)-wrapRect.left;
    var sy=Math.min(e.clientY,selBoxStart.clientY)-wrapRect.top;
    var sw=Math.abs(dx3),sh=Math.abs(dy3);
    sb.style.cssText='display:block;position:absolute;left:'+sx+'px;top:'+sy+'px;width:'+sw+'px;height:'+sh+'px;pointer-events:none;z-index:50;'
      +(isWindow?'border:2px solid #4fc3f7;background:rgba(79,195,247,0.08);':'border:2px dashed #6fb06f;background:rgba(111,176,111,0.08);');
    return;
  }
  if(connecting){
    var svg=document.getElementById('svg-layer');
    var old=document.getElementById('tmp-wire');if(old)old.remove();
    var wrap=document.getElementById('canvas-wrap');
    var rect=wrap.getBoundingClientRect();
    var mx=(e.clientX-rect.left-pan.x)/zoom,my=(e.clientY-rect.top-pan.y)/zoom;
    var p1=getPortPos(connecting.fromNode,connecting.fromOptIdx);
    var cp2=Math.max(60,Math.abs(mx-p1.x)*0.5);
    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.id='tmp-wire';
    path.setAttribute('d','M'+p1.x+','+p1.y+' C'+(p1.x+cp2)+','+p1.y+' '+(mx-cp2)+','+my+' '+mx+','+my);
    path.setAttribute('stroke','#4fc3f7');path.setAttribute('stroke-width','1.5');path.setAttribute('fill','none');path.setAttribute('opacity','0.55');path.setAttribute('stroke-dasharray','4,3');
    svg.appendChild(path);
    document.querySelectorAll('.in-port').forEach(function(p){p.classList.remove('highlight');});
    var els2=document.elementsFromPoint(e.clientX,e.clientY);
    els2.forEach(function(el){var gn=el.classList&&el.classList.contains('gnode')?el:el.closest&&el.closest('.gnode');if(gn){var ip=gn.querySelector('.in-port');if(ip)ip.classList.add('highlight');}});
  }
});

document.addEventListener('mouseup',function(e){
  if(nodeDrag){pushHist();nodeDrag=null;}
  if(panDrag){panDrag=null;document.getElementById('canvas-wrap').classList.remove('grabbing');}
  if(panelDrag){panelDrag=null;}
  if(selBoxStart){
    // Perform selection
    var dx=e.clientX-selBoxStart.clientX,dy=e.clientY-selBoxStart.clientY;
    var isWindow=dx>0;
    var wrap=document.getElementById('canvas-wrap');
    var rect=wrap.getBoundingClientRect();
    // Selection rect in canvas coords
    var sx1=Math.min(selBoxStart.canvasX,(e.clientX-rect.left-pan.x)/zoom);
    var sy1=Math.min(selBoxStart.canvasY,(e.clientY-rect.top-pan.y)/zoom);
    var sx2=Math.max(selBoxStart.canvasX,(e.clientX-rect.left-pan.x)/zoom);
    var sy2=Math.max(selBoxStart.canvasY,(e.clientY-rect.top-pan.y)/zoom);
    var found=[];
    if(arch&&arch.nodes)Object.keys(arch.nodes).forEach(function(id){
      var pos=positions[id]||{x:0,y:0};
      var el=document.getElementById('gn-'+id);
      var nw=el?el.offsetWidth:NODE_W,nh=el?el.offsetHeight:80;
      var nx1=pos.x,ny1=pos.y,nx2=pos.x+nw,ny2=pos.y+nh;
      if(isWindow){// fully inside
        if(nx1>=sx1&&ny1>=sy1&&nx2<=sx2&&ny2<=sy2)found.push(id);
      }else{// crossing — touching or inside
        if(nx1<=sx2&&nx2>=sx1&&ny1<=sy2&&ny2>=sy1)found.push(id);
      }
    });
    multiSel=found;if(found.length===1){selectedNode=found[0];multiSel=[];}else if(found.length>1){selectedNode=null;}
    document.getElementById('sel-box').style.display='none';
    selBoxStart=null;
    render();if(selectedNode)showInfo(selectedNode);
  }
  if(connecting){
    var els=document.elementsFromPoint(e.clientX,e.clientY);
    var targetId=null;
    els.forEach(function(el){if(targetId)return;var gn=el.classList&&el.classList.contains('gnode')?el:el.closest&&el.closest('.gnode');if(gn)targetId=gn.id.replace('gn-','');});
    if(targetId&&targetId!==connecting.fromNode&&arch&&arch.nodes){
      var opts=arch.nodes[connecting.fromNode].options;
      if(opts&&opts[connecting.fromOptIdx]){
        opts[connecting.fromOptIdx].target=targetId;
      }else{
        if(!arch.nodes[connecting.fromNode].options)arch.nodes[connecting.fromNode].options=[];
        arch.nodes[connecting.fromNode].options.push({label:'[NEW COMMAND]',target:targetId});
      }
      autoSetAllPaths();pushHist();toast('Connected \u2192 '+targetId);
      if(selectedNode)showInfo(selectedNode);
    }
    connecting=null;
    document.getElementById('canvas-wrap').classList.remove('connecting');
    document.querySelectorAll('.in-port').forEach(function(p){p.classList.remove('highlight');});
    var tw=document.getElementById('tmp-wire');if(tw)tw.remove();
    render();
  }
});

document.getElementById('canvas-wrap').addEventListener('wheel',function(e){
  e.preventDefault();
  var rect=this.getBoundingClientRect();
  var mx=e.clientX-rect.left,my=e.clientY-rect.top;
  var delta=e.deltaY>0?0.9:1.1;
  var nz=Math.max(0.12,Math.min(3,zoom*delta));
  pan.x=mx-(mx-pan.x)*(nz/zoom);pan.y=my-(my-pan.y)*(nz/zoom);
  zoom=nz;applyTransform();updateMinimap();
},{passive:false});

// ── FIT ───────────────────────────────────────────────────────────────────────
function resetView(){
  if(!arch||!arch.nodes)return;
  var ids=Object.keys(arch.nodes).filter(function(id){return positions[id]&&layerVis[(arch.nodes[id].layer||'l1_archive')];});
  if(!ids.length)return;
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  ids.forEach(function(id){var p=positions[id];minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x+NODE_W);maxY=Math.max(maxY,p.y+150);});
  var wrap=document.getElementById('canvas-wrap');var ww=wrap.clientWidth,wh=wrap.clientHeight;var pad=80;
  zoom=Math.min((ww-pad*2)/(maxX-minX),(wh-pad*2)/(maxY-minY),1.4);
  pan.x=pad-minX*zoom;pan.y=pad-minY*zoom;
  applyTransform();updateMinimap();
}

}

function liveCmd(nodeId,oi,val){if(arch&&arch.nodes&&arch.nodes[nodeId]&&arch.nodes[nodeId].options[oi])arch.nodes[nodeId].options[oi].label=val;}
function addCmd(nodeId){if(!arch||!arch.nodes||!arch.nodes[nodeId])return;if(!arch.nodes[nodeId].options)arch.nodes[nodeId].options=[];arch.nodes[nodeId].options.push({label:'[NEW COMMAND]',target:''});pushHist();render();showInfo(nodeId);}
function removeCmd(nodeId,oi){if(!arch||!arch.nodes||!arch.nodes[nodeId])return;arch.nodes[nodeId].options.splice(oi,1);pushHist();render();showInfo(nodeId);}
function setNodeBool(prop,val){if(!selectedNode||!arch||!arch.nodes[selectedNode])return;arch.nodes[selectedNode][prop]=val;pushHist();render();showInfo(selectedNode);}

// ── RENAME ────────────────────────────────────────────────────────────────────
function renameNode(oldId,newId){
  if(!arch||!arch.nodes||!arch.nodes[oldId]||arch.nodes[newId])return;
  arch.nodes[newId]=arch.nodes[oldId];delete arch.nodes[oldId];
  positions[newId]=positions[oldId];delete positions[oldId];
  Object.keys(arch.nodes).forEach(function(sid){
    (arch.nodes[sid].options||[]).forEach(function(o){if(o.target===oldId)o.target=newId;});
    if(arch.nodes[sid].parent===oldId)arch.nodes[sid].parent=newId;
  });
  if(selectedNode===oldId)selectedNode=newId;
  autoSetAllPaths();pushHist();render();showInfo(newId);toast('Renamed \u2192 '+newId);
}

function ctxRename(){hideCtxMenu();var n=prompt('New node ID:',ctxNodeId);if(!n||n===ctxNodeId)return;renameNode(ctxNodeId,n.trim().toUpperCase().replace(/\s+/g,'_'));}
function ctxDuplicate(){hideCtxMenu();if(!ctxNodeId||!arch.nodes[ctxNodeId])return;var nid=ctxNodeId+'_COPY',i=1;while(arch.nodes[nid]){nid=ctxNodeId+'_COPY'+i;i++;}arch.nodes[nid]=JSON.parse(JSON.stringify(arch.nodes[ctxNodeId]));arch.nodes[nid].is_root=false;var pos=positions[ctxNodeId]||{x:0,y:0};positions[nid]={x:pos.x+30,y:pos.y+30};autoSetPath(nid);pushHist();render();selectNode(nid);toast('Duplicated');}

function ctxPaste(cx,cy){hideCtxMenu();if(!clipboard)return;var nid='PASTE_'+Date.now();arch.nodes[nid]=JSON.parse(JSON.stringify(clipboard));arch.nodes[nid].is_root=false;delete arch.nodes[nid]._srcId;var wrap=document.getElementById('canvas-wrap'),rect=wrap.getBoundingClientRect();positions[nid]={x:Math.round((cx-rect.left-pan.x)/zoom),y:Math.round((cy-rect.top-pan.y)/zoom)};autoSetPath(nid);pushHist();render();selectNode(nid);toast('Pasted as '+nid);}
function addNodeAt(cx,cy){if(!arch){toast('Open a file first');return;}if(!arch.nodes)arch.nodes={};var id='NEW_NODE_'+Date.now();arch.nodes[id]={layer:'l1_archive',is_root:false,fetch_allowed:false,type:'standard',parent:null,title:'NEW NODE',breadcrumb:'',footer:'',body:[],options:[]};var wrap=document.getElementById('canvas-wrap'),rect=wrap.getBoundingClientRect();positions[id]={x:Math.round((cx-rect.left-pan.x)/zoom),y:Math.round((cy-rect.top-pan.y)/zoom)};pushHist();render();selectNode(id);}
function ctxSetRoot(){hideCtxMenu();if(!ctxNodeId||!arch.nodes[ctxNodeId])return;arch.nodes[ctxNodeId].is_root=!arch.nodes[ctxNodeId].is_root;pushHist();render();showInfo(ctxNodeId);}
function ctxReset(){hideCtxMenu();if(!ctxNodeId||!arch.nodes[ctxNodeId])return;if(!confirm('Clear all content from '+ctxNodeId+'?'))return;arch.nodes[ctxNodeId].title='';arch.nodes[ctxNodeId].body=[];arch.nodes[ctxNodeId].options=[];arch.nodes[ctxNodeId].footer='';arch.nodes[ctxNodeId].breadcrumb='';pushHist();render();showInfo(ctxNodeId);toast('Node cleared');}
function ctxDelete(){hideCtxMenu();if(!ctxNodeId)return;if(!confirm('Delete '+ctxNodeId+'?'))return;delete arch.nodes[ctxNodeId];delete positions[ctxNodeId];if(selectedNode===ctxNodeId){selectedNode=null;showEmpty();}pushHist();render();toast('Deleted');}
function ctxValidate(){
  hideCtxMenu();if(!ctxNodeId||!arch.nodes[ctxNodeId])return;
  var n=arch.nodes[ctxNodeId],issues=[];

  if(!issues.length)toast('\u2713 '+ctxNodeId+': all paths valid');
  else{alert('VALIDATION — '+ctxNodeId+':\n\n'+issues.join('\n'));}

function ctxGroup(){
  hideCtxMenu();

  if(!arch.groups)arch.groups={};

  multiSel.forEach(function(id){if(arch.nodes[id])arch.nodes[id].group=name;});

// ── COLOR PICKER ─────────────────────────────────────────────────────────────
var DEFAULT_COLORS={canvas:'#152230',gridminor:'#4fc3f7',gridmajor:'#4fc3f7',border:'#4fc3f7'};
var COLOR_DEFAULTS_ALPHA={gridminor:'rgba(79,195,247,0.06)',gridmajor:'rgba(79,195,247,0.13)'};

function showColorPicker(target,x,y){
  hideCtxMenu();cpTarget=target;
  var titles={canvas:'Canvas Background',gridminor:'Grid Lines (minor)',gridmajor:'Grid Lines (major)',border:'Canvas Border'};
  // Get current color
  var cur;
  if(target==='canvas'){cur=getComputedStyle(document.documentElement).getPropertyValue('--canvas-bg').trim()||'#152230';}
  else if(target==='gridminor'){cur=rgbToHex(window._gridMinorColor||'rgba(79,195,247,0.06)');}
  else if(target==='gridmajor'){cur=rgbToHex(window._gridMajorColor||'rgba(79,195,247,0.13)');}
  else if(target==='border'){cur=getComputedStyle(document.documentElement).getPropertyValue('--canvas-border').trim()||'#4fc3f7';}
  else cur='#152230';
  document.getElementById('cp-title').textContent=titles[target]||target;
  var alphaRow='';
  if(target==='gridminor'||target==='gridmajor'){
    var curA=target==='gridminor'?(window._gridMinorAlpha||0.06):(window._gridMajorAlpha||0.13);
    alphaRow='<div class="cp-row"><label>OPACITY</label><input type="range" id="cp-alpha" min="0" max="1" step="0.01" value="'+curA+'"><span id="cp-alpha-v" style="min-width:32px;font-size:12px;">'+Math.round(curA*100)+'%</span></div>';
    alphaRow+='<script>document.getElementById("cp-alpha").oninput=function(){document.getElementById("cp-alpha-v").textContent=Math.round(this.value*100)+"%";};<\/script>';
  }
  document.getElementById('cp-fields').innerHTML='<div class="cp-row"><label>COLOR</label><input type="color" id="cp-color" value="'+cur+'"></div>'+alphaRow;
  var popup=document.getElementById('color-popup');
  popup.style.cssText='display:flex;position:fixed;left:'+(Math.min(x,window.innerWidth-240))+'px;top:'+(Math.min(y,window.innerHeight-220))+'px;z-index:1100;flex-direction:column;gap:10px;padding:14px;min-width:220px;background:rgba(2,10,20,0.98);border:1px solid rgba(79,195,247,0.24);box-shadow:0 8px 28px rgba(0,0,0,0.7);';
}
function rgbToHex(str){
  // handles hex already or rgba
  if(str.startsWith('#'))return str.slice(0,7);
  var m=str.match(/rgba?\(\s*(\d+),\s*(\d+),\s*(\d+)/);
  if(!m)return '#4fc3f7';
  return '#'+[m[1],m[2],m[3]].map(function(v){return ('0'+parseInt(v).toString(16)).slice(-2);}).join('');
}
function applyColorPopup(){
  if(!cpTarget)return;
  var col=document.getElementById('cp-color').value;
  if(cpTarget==='canvas'){
    document.documentElement.style.setProperty('--canvas-bg',col);
    document.getElementById('canvas-outer').style.background=col;
    drawGrid();
  } else if(cpTarget==='gridminor'){
    var a=document.getElementById('cp-alpha');
    var alpha=a?parseFloat(a.value):0.06;
    window._gridMinorAlpha=alpha;
    var rgb=hexToRgbArr(col);
    window._gridMinorColor='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+alpha+')';
    drawGrid();
  } else if(cpTarget==='gridmajor'){
    var a2=document.getElementById('cp-alpha');
    var alpha2=a2?parseFloat(a2.value):0.13;
    window._gridMajorAlpha=alpha2;
    var rgb2=hexToRgbArr(col);
    window._gridMajorColor='rgba('+rgb2[0]+','+rgb2[1]+','+rgb2[2]+','+alpha2+')';
    drawGrid();
  } else if(cpTarget==='border'){
    document.documentElement.style.setProperty('--canvas-border',col);
    document.getElementById('canvas-outer').style.borderColor=col;
  }
  closeColorPopup();toast('Color updated');
}
function hexToRgbArr(hex){hex=hex.replace('#','');return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];}
function closeColorPopup(){document.getElementById('color-popup').style.display='none';cpTarget=null;}

function resetColors(){
  hideCtxMenu();
  document.documentElement.style.setProperty('--canvas-bg','#152230');
  document.documentElement.style.setProperty('--canvas-border','#4fc3f7');
  document.documentElement.style.setProperty('--outer-bg','#0a0f14');
  document.getElementById('canvas-outer').style.background='#152230';
  document.getElementById('canvas-outer').style.borderColor='#4fc3f7';
  document.getElementById('canvas-wrap').style.background='#0a0f14';
  window._gridMinorColor='rgba(79,195,247,0.06)';window._gridMinorAlpha=0.06;
  window._gridMajorColor='rgba(79,195,247,0.13)';window._gridMajorAlpha=0.13;
  window._beyondGridColor='#0a0f14';
  drawGrid();toast('Colors reset to default');
}

// ── MINIMAP ───────────────────────────────────────────────────────────────────
function updateMinimap(){
  if(!arch||!arch.nodes)return;
  var mc=document.getElementById('minimap-canvas'),ctx=mc.getContext('2d');
  ctx.clearRect(0,0,150,90);
  var sc=Math.min(140/CANVAS_W,82/CANVAS_H);var ox=5,oy=4;
  Object.keys(arch.nodes).forEach(function(id){
    var n=arch.nodes[id],lyr=n.layer||'l1_archive';if(!layerVis[lyr])return;
    var p=positions[id]||{x:0,y:0};var col=LAYER_COLOR[lyr]||'#4fc3f7';
    ctx.fillStyle=col;ctx.globalAlpha=id===selectedNode?0.90:multiSel.indexOf(id)>=0?0.70:0.35;
    ctx.fillRect(ox+p.x*sc,oy+p.y*sc,NODE_W*sc,32*sc);ctx.globalAlpha=1;
  });
  var wrap=document.getElementById('canvas-wrap'),ww=wrap.clientWidth,wh=wrap.clientHeight;
  var vx=ox+(-pan.x/zoom)*sc,vy=oy+(-pan.y/zoom)*sc,vw=(ww/zoom)*sc,vh=(wh/zoom)*sc;
  var mv=document.getElementById('minimap-vp');
  mv.style.cssText='left:'+Math.max(0,vx)+'px;top:'+Math.max(0,vy)+'px;width:'+Math.min(150,vw)+'px;height:'+Math.min(90,vh)+'px;position:absolute;border:1px solid rgba(79,195,247,0.50);pointer-events:none;';
}

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();doRedo();}
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveToFile();}
  if((e.ctrlKey||e.metaKey)&&e.key==='c'&&selectedNode){ctxNodeId=selectedNode;ctxCopy();}
  if((e.ctrlKey||e.metaKey)&&e.key==='d'&&selectedNode){ctxNodeId=selectedNode;ctxDuplicate();}
  if(e.key==='f'||e.key==='F')resetView();
  if(e.key==='Escape'){connecting=null;selBoxStart=null;document.getElementById('canvas-wrap').classList.remove('connecting','window-sel');var tw=document.getElementById('tmp-wire');if(tw)tw.remove();document.getElementById('sel-box').style.display='none';document.querySelectorAll('.in-port').forEach(function(p){p.classList.remove('highlight');});}
  if((e.key==='Delete'||e.key==='Backspace')&&selectedNode){if(!confirm('Delete '+selectedNode+'?'))return;delete arch.nodes[selectedNode];delete positions[selectedNode];selectedNode=null;showEmpty();pushHist();render();}
});

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var toastT=null;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},2600);}
function onSearch(){searchStr=document.getElementById('srch').value.trim().toLowerCase();render();}
function toggleLayer(lyr){layerVis[lyr]=!layerVis[lyr];document.getElementById('lf-'+lyr).classList.toggle('on',layerVis[lyr]);document.getElementById('lf-'+lyr).classList.toggle('off',!layerVis[lyr]);render();}
function setTool(t){tool=t;document.getElementById('btn-sel').classList.toggle('on',t==='select');document.getElementById('btn-pan').classList.toggle('on',t==='pan');}

// ── INIT ─────────────────────────────────────────────────────────────────────
sizeCanvas();
drawGrid();
setTool('select');
window.addEventListener('resize',function(){sizeCanvas();if(arch)updateMinimap();});
