<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NODE GRAPH EDITOR // v1</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--blue:#4fc3f7;--amber:#bf7c0a;--red:#e05050;--green:#6fb06f;--dark:#00080e;--dim:rgba(79,195,247,0.40);--bdr:rgba(79,195,247,0.10);}
html,body{height:100%;background:var(--dark);color:var(--blue);font-family:"Share Tech Mono",monospace;font-size:13px;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;}
#hdr{display:flex;align-items:center;gap:10px;padding:7px 16px;border-bottom:1px solid var(--bdr);flex-shrink:0;background:rgba(0,4,10,0.98);flex-wrap:wrap;}
.htitle{font-size:12px;letter-spacing:0.14em;flex:1;}
.hbtn{background:transparent;border:1px solid rgba(79,195,247,0.16);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:0.07em;padding:3px 10px;cursor:pointer;transition:all 0.15s;}
.hbtn:hover{border-color:var(--blue);color:var(--blue);}
#fstat{font-size:11px;padding:2px 8px;border:1px solid;letter-spacing:0.06em;}
#fstat.none{border-color:rgba(79,195,247,0.10);color:var(--dim);}
#fstat.ro{border-color:rgba(191,124,10,0.28);color:var(--amber);}
#fstat.rw{border-color:rgba(111,176,111,0.35);color:var(--green);}
#as-ind{color:var(--green);opacity:0;transition:opacity 0.4s;font-size:11px;}
#as-ind.show{opacity:1;}
#toolbar{display:flex;align-items:center;gap:7px;padding:5px 13px;border-bottom:1px solid var(--bdr);flex-shrink:0;flex-wrap:wrap;}
.tbtn{background:transparent;border:1px solid rgba(79,195,247,0.14);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:11px;padding:3px 9px;cursor:pointer;transition:all 0.15s;letter-spacing:0.06em;}
.tbtn:hover{border-color:var(--blue);color:var(--blue);}
.tbtn.on{border-color:var(--blue);color:var(--blue);background:rgba(79,195,247,0.07);}
#zoom-info{font-size:11px;color:var(--dim);margin-left:4px;}
#layer-filter{display:flex;gap:4px;margin-left:8px;}
.lf-btn{background:transparent;border:1px solid rgba(79,195,247,0.12);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:10px;padding:2px 8px;cursor:pointer;transition:all 0.15s;letter-spacing:0.06em;}
.lf-btn:hover{opacity:0.8;}
.lf-btn.on{opacity:1;}
.lf-btn.off{opacity:0.22;}
#body{display:flex;flex:1;min-height:0;position:relative;}

/* CANVAS */
#canvas-wrap{flex:1;overflow:hidden;position:relative;cursor:grab;}
#canvas-wrap.grabbing{cursor:grabbing;}
#canvas-wrap.connecting{cursor:crosshair;}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;}
#svg-layer{position:absolute;top:0;left:0;pointer-events:none;}

/* NODES */
.gnode{position:absolute;min-width:180px;max-width:220px;border:1px solid;border-radius:2px;cursor:pointer;user-select:none;transition:box-shadow 0.15s;}
.gnode.l1_archive{border-color:rgba(79,195,247,0.35);background:rgba(0,8,14,0.92);}
.gnode.l2{border-color:rgba(191,124,10,0.45);background:rgba(10,7,0,0.92);}
.gnode.l3{border-color:rgba(224,80,80,0.45);background:rgba(5,0,0,0.92);}
.gnode.selected.l1_archive{border-color:#4fc3f7;box-shadow:0 0 0 1px #4fc3f7,0 4px 20px rgba(79,195,247,0.15);}
.gnode.selected.l2{border-color:#bf7c0a;box-shadow:0 0 0 1px #bf7c0a,0 4px 20px rgba(191,124,10,0.15);}
.gnode.selected.l3{border-color:#e05050;box-shadow:0 0 0 1px #e05050,0 4px 20px rgba(224,80,80,0.15);}
.gnode-hdr{padding:6px 8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid rgba(79,195,247,0.08);}
.gnode.l2 .gnode-hdr{border-bottom-color:rgba(191,124,10,0.12);}
.gnode.l3 .gnode-hdr{border-bottom-color:rgba(224,80,80,0.12);}
.gnode-root-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.gnode.l1_archive .gnode-root-dot{background:#4fc3f7;}
.gnode.l2 .gnode-root-dot{background:#bf7c0a;}
.gnode.l3 .gnode-root-dot{background:#e05050;}
.gnode-id{font-size:10px;letter-spacing:0.08em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gnode.l1_archive .gnode-id{color:#4fc3f7;}
.gnode.l2 .gnode-id{color:#bf7c0a;}
.gnode.l3 .gnode-id{color:#e05050;}
.gnode-lyr{font-size:9px;color:rgba(79,195,247,0.30);flex-shrink:0;letter-spacing:0.06em;}
.gnode.l2 .gnode-lyr{color:rgba(191,124,10,0.40);}
.gnode.l3 .gnode-lyr{color:rgba(224,80,80,0.40);}
.gnode-title{padding:5px 8px;font-size:11px;color:rgba(79,195,247,0.65);line-height:1.4;border-bottom:1px solid rgba(79,195,247,0.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gnode.l2 .gnode-title{color:rgba(191,124,10,0.75);border-bottom-color:rgba(191,124,10,0.08);}
.gnode.l3 .gnode-title{color:rgba(224,80,80,0.75);border-bottom-color:rgba(224,80,80,0.08);}
.gnode-opts{padding:4px 0;}
.gnode-opt{display:flex;align-items:center;padding:3px 8px;font-size:10px;color:rgba(79,195,247,0.55);letter-spacing:0.04em;position:relative;}
.gnode.l2 .gnode-opt{color:rgba(191,124,10,0.65);}
.gnode.l3 .gnode-opt{color:rgba(224,80,80,0.65);}
.gnode-opt-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px;}
/* OUTPUT PORT */
.out-port{width:10px;height:10px;border-radius:50%;border:1px solid;position:absolute;right:-6px;top:50%;transform:translateY(-50%);cursor:crosshair;flex-shrink:0;transition:all 0.12s;z-index:10;}
.gnode.l1_archive .out-port{border-color:rgba(79,195,247,0.35);background:rgba(0,8,14,0.9);}
.gnode.l1_archive .out-port:hover{border-color:#4fc3f7;background:rgba(79,195,247,0.25);}
.gnode.l2 .out-port{border-color:rgba(191,124,10,0.45);background:rgba(10,7,0,0.9);}
.gnode.l2 .out-port:hover{border-color:#bf7c0a;background:rgba(191,124,10,0.25);}
.gnode.l3 .out-port{border-color:rgba(224,80,80,0.45);background:rgba(5,0,0,0.9);}
.gnode.l3 .out-port:hover{border-color:#e05050;background:rgba(224,80,80,0.25);}
/* INPUT PORT */
.in-port{width:10px;height:10px;border-radius:50%;border:1px solid;position:absolute;left:-6px;top:50%;transform:translateY(-50%);z-index:10;}
.gnode.l1_archive .in-port{border-color:rgba(79,195,247,0.25);background:rgba(0,8,14,0.9);}
.gnode.l2 .in-port{border-color:rgba(191,124,10,0.35);background:rgba(10,7,0,0.9);}
.gnode.l3 .in-port{border-color:rgba(224,80,80,0.35);background:rgba(5,0,0,0.9);}
.in-port.highlight{border-color:#4fc3f7;background:rgba(79,195,247,0.30);}

/* INFO PANEL */
#info{width:260px;flex-shrink:0;border-left:1px solid var(--bdr);display:flex;flex-direction:column;background:rgba(0,4,10,0.98);}
.iphdr{padding:7px 12px;font-size:12px;letter-spacing:0.12em;color:var(--dim);border-bottom:1px solid var(--bdr);flex-shrink:0;}
#info-body{flex:1;overflow-y:auto;padding:12px;}
#info-empty{color:var(--dim);font-size:12px;line-height:2;text-align:center;padding:20px 0;}
.if{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.il{font-size:11px;color:rgba(79,195,247,0.42);letter-spacing:0.08em;}
.iv{font-size:12px;color:var(--blue);line-height:1.5;}
.iv.amber{color:var(--amber);}
.iv.red{color:var(--red);}
.conn-list{display:flex;flex-direction:column;gap:3px;margin-top:4px;}
.conn-row{font-size:11px;padding:3px 6px;border:1px solid rgba(79,195,247,0.10);color:rgba(79,195,247,0.60);display:flex;gap:6px;align-items:center;}
.conn-arrow{color:rgba(79,195,247,0.30);}

/* LEGEND */
#legend{padding:10px 12px;border-top:1px solid var(--bdr);flex-shrink:0;}
.leg-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:10px;color:var(--dim);}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* MINIMAP */
#minimap{position:absolute;bottom:12px;right:272px;width:160px;height:100px;border:1px solid rgba(79,195,247,0.14);background:rgba(0,4,10,0.85);pointer-events:none;overflow:hidden;}
#minimap-canvas{position:absolute;top:0;left:0;}
#minimap-vp{position:absolute;border:1px solid rgba(79,195,247,0.40);pointer-events:none;}

#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(2,8,16,0.96);border:1px solid rgba(79,195,247,0.22);color:var(--blue);padding:6px 14px;font-size:12px;letter-spacing:0.05em;opacity:0;transition:opacity 0.22s;pointer-events:none;z-index:999;}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
<div id="hdr">
  <span class="htitle">NODE GRAPH EDITOR // v1</span>
  <span id="as-ind">&#10003; SAVED</span>
  <span id="fstat" class="none">NO FILE OPEN</span>
  <button class="hbtn" onclick="openFile()">&#8213; OPEN nodes.json</button>
  <button class="hbtn" onclick="dlJSON()">&#8595; EXPORT nodes.json</button>
</div>
<div id="toolbar">
  <button class="tbtn" id="btn-select" onclick="setTool('select')" title="Select / move nodes">&#9654; SELECT</button>
  <button class="tbtn" id="btn-pan" onclick="setTool('pan')" title="Pan canvas">&#10021; PAN</button>
  <button class="tbtn" onclick="addNode()" title="Add new node">&#43; NODE</button>
  <button class="tbtn" onclick="resetView()" title="Fit all nodes in view">&#9635; FIT</button>
  <span id="zoom-info">100%</span>
  <div id="layer-filter">
    <button class="lf-btn on" id="lf-l1_archive" style="color:#4fc3f7;border-color:rgba(79,195,247,0.35);" onclick="toggleLayer('l1_archive')">L1</button>
    <button class="lf-btn on" id="lf-l2" style="color:#bf7c0a;border-color:rgba(191,124,10,0.40);" onclick="toggleLayer('l2')">L2</button>
    <button class="lf-btn on" id="lf-l3" style="color:#e05050;border-color:rgba(224,80,80,0.40);" onclick="toggleLayer('l3')">L3</button>
  </div>
</div>
<div id="body">
  <div id="canvas-wrap">
    <div id="canvas">
      <svg id="svg-layer" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <div id="minimap"><canvas id="minimap-canvas" width="160" height="100"></canvas><div id="minimap-vp"></div></div>
  <div id="info">
    <div class="iphdr">&#9658; NODE INFO</div>
    <div id="info-body"><div id="info-empty">Select a node<br>to view details.</div></div>
    <div id="legend">
      <div class="leg-row"><div class="leg-dot" style="background:#4fc3f7;"></div>L1 ARCHIVE</div>
      <div class="leg-row"><div class="leg-dot" style="background:#bf7c0a;"></div>L2 ECHO PROTOCOL</div>
      <div class="leg-row"><div class="leg-dot" style="background:#e05050;"></div>L3 DEEP ARCHIVE</div>
      <div class="leg-row" style="margin-top:6px;color:rgba(79,195,247,0.25);">SCROLL: zoom &nbsp;·&nbsp; DRAG: pan/move<br>PORT &#9679;: drag to connect</div>
    </div>
  </div>
</div>
</div>
<input type="file" id="fi" accept=".json" style="display:none" onchange="onFileIn(event)">
<div id="toast"></div>

<script>
'use strict';

// ── STATE ─────────────────────────────────────────────────────────────────────
var arch = null;
var positions = {}; // nodeId -> {x, y}
var selectedNode = null;
var tool = 'select'; // select | pan
var pan = {x:60, y:60};
var zoom = 1.0;
var layerVis = {l1_archive:true, l2:true, l3:true};
var fileHandle = null;

// Drag state
var drag = null; // {type:'node'|'pan', nodeId, startX, startY, startPanX, startPanY, startNX, startNY}
var connecting = null; // {fromNode, fromOptIdx, x1, y1}

var LAYER_COLOR = {l1_archive:'#4fc3f7', l2:'#bf7c0a', l3:'#e05050'};
var LAYER_LABEL = {l1_archive:'L1 ARCHIVE', l2:'L2', l3:'L3'};
var NODE_W = 200;

// ── FAVICON ───────────────────────────────────────────────────────────────────
(function(){
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="8" cy="16" r="5" fill="#4fc3f7" opacity="0.9"/><circle cx="24" cy="8" r="5" fill="#bf7c0a" opacity="0.9"/><circle cx="24" cy="24" r="5" fill="#e05050" opacity="0.9"/><line x1="13" y1="14" x2="19" y2="10" stroke="#4fc3f7" stroke-width="1.5" opacity="0.6"/><line x1="13" y1="18" x2="19" y2="22" stroke="#4fc3f7" stroke-width="1.5" opacity="0.6"/></svg>';
  var el=document.createElement('link');el.rel='icon';el.type='image/svg+xml';el.href='data:image/svg+xml;base64,'+btoa(s);document.head.appendChild(el);
})();

// ── FILE I/O ──────────────────────────────────────────────────────────────────
async function openFile(){
  if(window.showOpenFilePicker){
    try{
      var[h]=await window.showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      fileHandle=h;var f=await h.getFile();
      loadArch(JSON.parse(await f.text()),f.name,'rw');
    }catch(e){if(e.name!=='AbortError')document.getElementById('fi').click();}
  }else document.getElementById('fi').click();
}
function onFileIn(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){try{loadArch(JSON.parse(ev.target.result),f.name,'ro');}catch(ex){toast('Parse error: '+ex.message);}};
  r.readAsText(f);e.target.value='';
}
function loadArch(raw,name,cls){
  arch=raw;
  autoLayout();
  render();
  resetView();
  setFstat(name,cls);
  toast('Loaded '+Object.keys(arch.nodes||{}).length+' nodes');
}
function setFstat(n,c){var el=document.getElementById('fstat');el.textContent=n;el.className=c;}
function buildExport(){
  if(!arch)return'{}';
  // Write positions back into arch meta
  if(!arch.meta)arch.meta={};
  arch.meta.node_positions=positions;
  return JSON.stringify(arch,null,2);
}
function dlJSON(){
  var b=new Blob([buildExport()],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nodes.json';a.click();
  toast('Exported nodes.json');
}

// ── AUTO LAYOUT ───────────────────────────────────────────────────────────────
function autoLayout(){
  if(!arch||!arch.nodes)return;
  var nodes=arch.nodes;
  // Restore saved positions first
  var saved=(arch.meta&&arch.meta.node_positions)||{};
  Object.keys(nodes).forEach(function(id){
    if(saved[id]){positions[id]={x:saved[id].x,y:saved[id].y};}
  });
  // Layout any unsaved nodes by layer columns
  var cols={l1_archive:[],l2:[],l3:[]};
  Object.keys(nodes).forEach(function(id){
    if(!positions[id]){
      var lyr=nodes[id].layer||'l1_archive';
      if(!cols[lyr])cols[lyr]=[];
      cols[lyr].push(id);
    }
  });
  var COL_X={l1_archive:60,l2:340,l3:620};
  var ROW_H=160;
  Object.keys(cols).forEach(function(lyr){
    cols[lyr].forEach(function(id,i){
      // Put root at top
      var isRoot=nodes[id].is_root;
      positions[id]={x:COL_X[lyr]||(Object.keys(COL_X).length*260),y:isRoot?40:80+i*ROW_H};
    });
    // Re-sort roots to top
    var roots=cols[lyr].filter(function(id){return nodes[id].is_root;});
    var nonroots=cols[lyr].filter(function(id){return !nodes[id].is_root;});
    roots.forEach(function(id,i){positions[id].y=40+i*ROW_H;});
    nonroots.forEach(function(id,i){positions[id].y=40+(roots.length+i)*ROW_H;});
  });
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  if(!arch)return;
  var canvas=document.getElementById('canvas');
  var svg=document.getElementById('svg-layer');
  canvas.style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+zoom+')';
  document.getElementById('zoom-info').textContent=Math.round(zoom*100)+'%';

  // Build node DOM
  // Remove old nodes
  canvas.querySelectorAll('.gnode').forEach(function(el){el.remove();});
  svg.innerHTML='';

  var nodes=arch.nodes||{};
  var nodeEls={}; // id -> el

  Object.keys(nodes).forEach(function(id){
    var n=nodes[id];
    var lyr=n.layer||'l1_archive';
    if(!layerVis[lyr])return;
    var pos=positions[id]||{x:0,y:0};

    var el=document.createElement('div');
    el.className='gnode '+lyr+(selectedNode===id?' selected':'');
    el.id='gn-'+id;
    el.style.left=pos.x+'px';
    el.style.top=pos.y+'px';
    el.style.width=NODE_W+'px';

    // Input port
    var inp=document.createElement('div');
    inp.className='in-port';
    inp.title='Input';
    el.appendChild(inp);

    // Header
    var hdr=document.createElement('div');
    hdr.className='gnode-hdr';
    if(n.is_root){var dot=document.createElement('div');dot.className='gnode-root-dot';hdr.appendChild(dot);}
    var idSpan=document.createElement('div');idSpan.className='gnode-id';idSpan.textContent=id;hdr.appendChild(idSpan);
    var lyrSpan=document.createElement('div');lyrSpan.className='gnode-lyr';lyrSpan.textContent=LAYER_LABEL[lyr]||lyr;hdr.appendChild(lyrSpan);
    el.appendChild(hdr);

    // Title
    if(n.title){
      var tDiv=document.createElement('div');tDiv.className='gnode-title';tDiv.textContent=n.title;el.appendChild(tDiv);
    }

    // Options/commands with output ports
    var opts=n.options||[];
    if(opts.length){
      var optsDiv=document.createElement('div');optsDiv.className='gnode-opts';
      opts.forEach(function(opt,oi){
        var row=document.createElement('div');row.className='gnode-opt';
        var lbl=document.createElement('div');lbl.className='gnode-opt-label';lbl.textContent=opt.label||'';row.appendChild(lbl);
        // Output port
        var port=document.createElement('div');port.className='out-port';
        port.title='Connect to node';
        port.dataset.nodeid=id;port.dataset.optidx=oi;
        port.addEventListener('mousedown',function(e){e.stopPropagation();startConnect(e,id,oi);});
        row.appendChild(port);
        optsDiv.appendChild(row);
      });
      el.appendChild(optsDiv);
    }

    // Node drag
    hdr.addEventListener('mousedown',function(e){if(e.button!==0)return;e.stopPropagation();startNodeDrag(e,id);});
    idSpan.addEventListener('mousedown',function(e){if(e.button!==0)return;e.stopPropagation();startNodeDrag(e,id);});

    // Select on click
    el.addEventListener('click',function(e){
      if(connecting)return;
      selectNode(id);
    });

    canvas.appendChild(el);
    nodeEls[id]=el;
  });

  // Draw connections
  drawConnections(nodes, nodeEls);
  updateMinimap();
}

// ── CONNECTIONS ───────────────────────────────────────────────────────────────
function drawConnections(nodes, nodeEls){
  var svg=document.getElementById('svg-layer');
  // Resize SVG to canvas
  var bounds=getNodeBounds(nodes);
  var svgW=Math.max(bounds.maxX+300, 1200);
  var svgH=Math.max(bounds.maxY+300, 900);
  svg.setAttribute('width',svgW);svg.setAttribute('height',svgH);
  svg.style.width=svgW+'px';svg.style.height=svgH+'px';

  Object.keys(nodes).forEach(function(id){
    var n=nodes[id];
    var lyr=n.layer||'l1_archive';
    if(!layerVis[lyr])return;
    var srcEl=document.getElementById('gn-'+id);
    if(!srcEl)return;
    var srcPos=positions[id]||{x:0,y:0};
    var opts=n.options||[];
    opts.forEach(function(opt,oi){
      var tgt=opt.target;
      if(!tgt||!nodes[tgt])return;
      var tgtLyr=nodes[tgt].layer||'l1_archive';
      if(!layerVis[tgtLyr])return;
      var tgtEl=document.getElementById('gn-'+tgt);
      if(!tgtEl)return;
      var tgtPos=positions[tgt]||{x:0,y:0};

      // Calculate port positions
      var optRowH=28; // approx height per option row
      var hdrH=n.title?58:30;
      var portY=srcPos.y+hdrH+(oi*optRowH)+(optRowH/2);
      var x1=srcPos.x+NODE_W;
      var y1=portY;

      // Input port on target — left center of node
      var tgtH=getTgtHeight(nodes[tgt]);
      var x2=tgtPos.x;
      var y2=tgtPos.y+(tgtH/2);

      var color=LAYER_COLOR[lyr]||'#4fc3f7';
      var cp=Math.abs(x2-x1)*0.5+40;

      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      var d='M'+x1+','+y1+' C'+(x1+cp)+','+y1+' '+(x2-cp)+','+y2+' '+x2+','+y2;
      path.setAttribute('d',d);
      path.setAttribute('stroke',color);
      path.setAttribute('stroke-width','1.5');
      path.setAttribute('fill','none');
      path.setAttribute('opacity','0.45');
      path.setAttribute('stroke-dasharray', id===selectedNode||tgt===selectedNode?'none':'4,3');
      svg.appendChild(path);

      // Arrow at end
      var angle=Math.atan2(y2-y1,x2-x1);
      var ax=x2,ay=y2;
      var aLen=7;
      var a1x=ax-aLen*Math.cos(angle-0.4),a1y=ay-aLen*Math.sin(angle-0.4);
      var a2x=ax-aLen*Math.cos(angle+0.4),a2y=ay-aLen*Math.sin(angle+0.4);
      var arr=document.createElementNS('http://www.w3.org/2000/svg','polyline');
      arr.setAttribute('points',a1x+','+a1y+' '+ax+','+ay+' '+a2x+','+a2y);
      arr.setAttribute('stroke',color);arr.setAttribute('stroke-width','1.5');arr.setAttribute('fill','none');
      arr.setAttribute('opacity','0.55');
      svg.appendChild(arr);
    });
  });
}

function getTgtHeight(node){
  var h=30;
  if(node.title)h+=28;
  h+=(node.options||[]).length*28;
  return Math.max(h,50);
}

function getNodeBounds(nodes){
  var maxX=0,maxY=0;
  Object.keys(nodes).forEach(function(id){
    var p=positions[id]||{x:0,y:0};
    maxX=Math.max(maxX,p.x+NODE_W);
    maxY=Math.max(maxY,p.y+getTgtHeight(nodes[id]));
  });
  return{maxX:maxX,maxY:maxY};
}

// ── SELECTION ─────────────────────────────────────────────────────────────────
function selectNode(id){
  selectedNode=id;
  render();
  showInfo(id);
}

function showInfo(id){
  var n=(arch&&arch.nodes&&arch.nodes[id]);
  if(!n){document.getElementById('info-body').innerHTML='<div id="info-empty">Select a node<br>to view details.</div>';return;}
  var lyr=n.layer||'l1_archive';
  var col=LAYER_COLOR[lyr]||'#4fc3f7';
  var opts=n.options||[];
  var connsIn=[];
  Object.keys(arch.nodes).forEach(function(sid){
    (arch.nodes[sid].options||[]).forEach(function(o){if(o.target===id)connsIn.push({from:sid,label:o.label});});
  });

  var h='';
  h+='<div class="if"><div class="il">NODE ID</div><div class="iv" style="color:'+col+';">'+esc(id)+'</div></div>';
  h+='<div class="if"><div class="il">LAYER</div><div class="iv">'+esc(LAYER_LABEL[lyr]||lyr)+'</div></div>';
  if(n.title)h+='<div class="if"><div class="il">TITLE</div><div class="iv">'+esc(n.title)+'</div></div>';
  h+='<div class="if"><div class="il">ROOT</div><div class="iv">'+(n.is_root?'YES':'NO')+'</div></div>';
  h+='<div class="if"><div class="il">FETCH ALLOWED</div><div class="iv">'+(n.fetch_allowed?'YES':'NO')+'</div></div>';
  h+='<div class="if"><div class="il">TYPE</div><div class="iv">'+esc(n.type||'standard')+'</div></div>';
  if(n.breadcrumb)h+='<div class="if"><div class="il">BREADCRUMB</div><div class="iv">'+esc(n.breadcrumb)+'</div></div>';

  if(opts.length){
    h+='<div class="if"><div class="il">COMMANDS OUT ('+opts.length+')</div><div class="conn-list">';
    opts.forEach(function(o){
      h+='<div class="conn-row">'+esc(o.label||'')+'<span class="conn-arrow">&#8594;</span>'+esc(o.target||'?')+'</div>';
    });
    h+='</div></div>';
  }
  if(connsIn.length){
    h+='<div class="if"><div class="il">INCOMING ('+connsIn.length+')</div><div class="conn-list">';
    connsIn.forEach(function(c){
      h+='<div class="conn-row">'+esc(c.from)+'<span class="conn-arrow">&#8594;</span>'+esc(c.label||'')+'</div>';
    });
    h+='</div></div>';
  }
  document.getElementById('info-body').innerHTML=h;
}

// ── TOOL ──────────────────────────────────────────────────────────────────────
function setTool(t){
  tool=t;
  document.getElementById('btn-select').classList.toggle('on',t==='select');
  document.getElementById('btn-pan').classList.toggle('on',t==='pan');
  document.getElementById('canvas-wrap').style.cursor=t==='pan'?'grab':'default';
}

function toggleLayer(lyr){
  layerVis[lyr]=!layerVis[lyr];
  document.getElementById('lf-'+lyr).classList.toggle('on',layerVis[lyr]);
  document.getElementById('lf-'+lyr).classList.toggle('off',!layerVis[lyr]);
  render();
}

function addNode(){
  if(!arch){toast('Open a nodes.json first');return;}
  if(!arch.nodes)arch.nodes={};
  var id='NEW_NODE_'+Date.now();
  arch.nodes[id]={layer:'l1_archive',is_root:false,fetch_allowed:false,type:'standard',parent:null,title:'NEW NODE',breadcrumb:'',footer:'',body:[],options:[]};
  var cx=(-pan.x/zoom)+200;var cy=(-pan.y/zoom)+200;
  positions[id]={x:cx,y:cy};
  render();selectNode(id);
  toast('Node added: '+id);
}

// ── DRAG NODES ────────────────────────────────────────────────────────────────
function startNodeDrag(e,id){
  if(tool==='pan')return;
  var pos=positions[id]||{x:0,y:0};
  drag={type:'node',nodeId:id,startX:e.clientX,startY:e.clientY,startNX:pos.x,startNY:pos.y};
  selectNode(id);
}

// ── CONNECT ───────────────────────────────────────────────────────────────────
function startConnect(e,nodeId,optIdx){
  var pos=positions[nodeId]||{x:0,y:0};
  var n=arch.nodes[nodeId];
  var hdrH=n.title?58:30;
  var portY=pos.y+hdrH+(optIdx*28)+14;
  var x1=pos.x+NODE_W;
  connecting={fromNode:nodeId,fromOptIdx:optIdx,x1:x1,y1:portY};
  document.getElementById('canvas-wrap').classList.add('connecting');
}

// ── PAN / ZOOM ────────────────────────────────────────────────────────────────
var panDrag=null;
document.getElementById('canvas-wrap').addEventListener('mousedown',function(e){
  if(connecting)return;
  if(e.target.classList.contains('out-port'))return;
  if(e.button===1||(e.button===0&&tool==='pan')){
    e.preventDefault();
    panDrag={startX:e.clientX,startY:e.clientY,startPX:pan.x,startPY:pan.y};
    document.getElementById('canvas-wrap').classList.add('grabbing');
  }
});

document.addEventListener('mousemove',function(e){
  if(drag&&drag.type==='node'){
    var dx=(e.clientX-drag.startX)/zoom;
    var dy=(e.clientY-drag.startY)/zoom;
    positions[drag.nodeId]={x:drag.startNX+dx,y:drag.startNY+dy};
    var el=document.getElementById('gn-'+drag.nodeId);
    if(el){el.style.left=positions[drag.nodeId].x+'px';el.style.top=positions[drag.nodeId].y+'px';}
    // Redraw connections only
    var svg=document.getElementById('svg-layer');
    svg.innerHTML='';
    drawConnections(arch.nodes,{});
    updateMinimap();
    return;
  }
  if(panDrag){
    pan.x=panDrag.startPX+(e.clientX-panDrag.startX);
    pan.y=panDrag.startPY+(e.clientY-panDrag.startY);
    document.getElementById('canvas').style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+zoom+')';
    updateMinimap();
    return;
  }
  if(connecting){
    // Draw temp wire on SVG
    var svg=document.getElementById('svg-layer');
    // Remove old temp
    var old=document.getElementById('tmp-wire');if(old)old.remove();
    var old2=document.getElementById('tmp-wire2');if(old2)old2.remove();
    var wrap=document.getElementById('canvas-wrap');
    var rect=wrap.getBoundingClientRect();
    var mx=(e.clientX-rect.left-pan.x)/zoom;
    var my=(e.clientY-rect.top-pan.y)/zoom;
    var x1=connecting.x1,y1=connecting.y1;
    var cp=Math.abs(mx-x1)*0.5+40;
    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.id='tmp-wire';
    path.setAttribute('d','M'+x1+','+y1+' C'+(x1+cp)+','+y1+' '+(mx-cp)+','+my+' '+mx+','+my);
    path.setAttribute('stroke','#4fc3f7');path.setAttribute('stroke-width','1.5');
    path.setAttribute('fill','none');path.setAttribute('opacity','0.5');
    path.setAttribute('stroke-dasharray','4,3');
    svg.appendChild(path);
    // Highlight potential targets
    document.querySelectorAll('.in-port').forEach(function(p){p.classList.remove('highlight');});
    var els=document.elementsFromPoint(e.clientX,e.clientY);
    els.forEach(function(el){if(el.classList.contains('gnode')||el.closest('.gnode')){var gn=el.closest('.gnode');if(gn){var inp=gn.querySelector('.in-port');if(inp)inp.classList.add('highlight');}}});
  }
});

document.addEventListener('mouseup',function(e){
  if(drag){drag=null;}
  if(panDrag){panDrag=null;document.getElementById('canvas-wrap').classList.remove('grabbing');}
  if(connecting){
    // Check if dropped on a node
    var els=document.elementsFromPoint(e.clientX,e.clientY);
    var targetEl=null;
    els.forEach(function(el){if(!targetEl&&(el.classList.contains('gnode')||el.closest('.gnode'))){targetEl=el.closest('.gnode');}});
    if(targetEl){
      var targetId=targetEl.id.replace('gn-','');
      if(targetId!==connecting.fromNode){
        // Set the connection
        var opts=arch.nodes[connecting.fromNode].options;
        if(opts[connecting.fromOptIdx]){
          opts[connecting.fromOptIdx].target=targetId;
          toast('Connected \u2192 '+targetId);
        }
      }
    }
    connecting=null;
    document.getElementById('canvas-wrap').classList.remove('connecting');
    document.querySelectorAll('.in-port').forEach(function(p){p.classList.remove('highlight');});
    var old=document.getElementById('tmp-wire');if(old)old.remove();
    render();
  }
});

document.getElementById('canvas-wrap').addEventListener('wheel',function(e){
  e.preventDefault();
  var rect=this.getBoundingClientRect();
  var mx=e.clientX-rect.left;var my=e.clientY-rect.top;
  var delta=e.deltaY>0?0.9:1.1;
  var newZoom=Math.max(0.15,Math.min(3,zoom*delta));
  pan.x=mx-(mx-pan.x)*(newZoom/zoom);
  pan.y=my-(my-pan.y)*(newZoom/zoom);
  zoom=newZoom;
  document.getElementById('canvas').style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+zoom+')';
  document.getElementById('zoom-info').textContent=Math.round(zoom*100)+'%';
  updateMinimap();
},{passive:false});

// ── FIT VIEW ──────────────────────────────────────────────────────────────────
function resetView(){
  if(!arch||!arch.nodes)return;
  var ids=Object.keys(arch.nodes).filter(function(id){return positions[id];});
  if(!ids.length)return;
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  ids.forEach(function(id){
    var p=positions[id];
    minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x+NODE_W);maxY=Math.max(maxY,p.y+150);
  });
  var wrap=document.getElementById('canvas-wrap');
  var ww=wrap.clientWidth,wh=wrap.clientHeight;
  var pad=60;
  var scaleX=(ww-pad*2)/(maxX-minX);var scaleY=(wh-pad*2)/(maxY-minY);
  zoom=Math.min(scaleX,scaleY,1.2);
  pan.x=pad-minX*zoom;pan.y=pad-minY*zoom;
  document.getElementById('canvas').style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+zoom+')';
  document.getElementById('zoom-info').textContent=Math.round(zoom*100)+'%';
  updateMinimap();
}

// ── MINIMAP ───────────────────────────────────────────────────────────────────
function updateMinimap(){
  if(!arch||!arch.nodes)return;
  var mc=document.getElementById('minimap-canvas');
  var ctx=mc.getContext('2d');
  ctx.clearRect(0,0,160,100);
  var ids=Object.keys(arch.nodes);
  if(!ids.length)return;
  var minX=Infinity,minY=Infinity,maxX=0,maxY=0;
  ids.forEach(function(id){var p=positions[id]||{x:0,y:0};minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x+NODE_W);maxY=Math.max(maxY,p.y+120);});
  var scX=140/(maxX-minX||1);var scY=80/(maxY-minY||1);var sc=Math.min(scX,scY);
  var offX=10,offY=10;
  ids.forEach(function(id){
    var n=arch.nodes[id];var p=positions[id]||{x:0,y:0};
    var lyr=n.layer||'l1_archive';
    if(!layerVis[lyr])return;
    var col=lyr==='l2'?'#bf7c0a':lyr==='l3'?'#e05050':'#4fc3f7';
    ctx.fillStyle=col;ctx.globalAlpha=id===selectedNode?0.9:0.4;
    ctx.fillRect(offX+(p.x-minX)*sc,offY+(p.y-minY)*sc,NODE_W*sc,40*sc);
    ctx.globalAlpha=1;
  });
  // Viewport indicator
  var wrap=document.getElementById('canvas-wrap');
  var ww=wrap.clientWidth,wh=wrap.clientHeight;
  var vx=offX+(-pan.x/zoom-minX)*sc;var vy=offY+(-pan.y/zoom-minY)*sc;
  var vw=(ww/zoom)*sc;var vh=(wh/zoom)*sc;
  var mv=document.getElementById('minimap-vp');
  mv.style.left=Math.max(0,vx)+'px';mv.style.top=Math.max(0,vy)+'px';
  mv.style.width=Math.min(160,vw)+'px';mv.style.height=Math.min(100,vh)+'px';
}

// ── KEYBOARD ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){connecting=null;document.getElementById('canvas-wrap').classList.remove('connecting');var old=document.getElementById('tmp-wire');if(old)old.remove();}
  if(e.key==='f'||e.key==='F')resetView();
  if(e.key==='Delete'&&selectedNode&&arch&&arch.nodes[selectedNode]){
    if(confirm('Delete node '+selectedNode+'?')){
      delete arch.nodes[selectedNode];delete positions[selectedNode];
      selectedNode=null;render();
      document.getElementById('info-body').innerHTML='<div id="info-empty">Select a node<br>to view details.</div>';
    }
  }
});

// ── TOAST / ESC ───────────────────────────────────────────────────────────────
var toastT=null;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},2600);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── INIT ──────────────────────────────────────────────────────────────────────
setTool('select');
</script>
</body>
</html>
