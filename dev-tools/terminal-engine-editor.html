<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO ENGINE LAB // v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--blue:#4fc3f7;--amber:#bf7c0a;--red:#e05050;--green:#6fb06f;--bg:#001220;--dark:#00080e;--dim:rgba(79,195,247,0.40);--bdr:rgba(79,195,247,0.10);}
html,body{height:100%;background:var(--dark);color:var(--blue);font-family:"Share Tech Mono",monospace;font-size:13px;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;}

/* HEADER */
#hdr{display:flex;justify-content:space-between;align-items:center;padding:7px 16px;border-bottom:1px solid var(--bdr);flex-shrink:0;background:rgba(0,4,10,0.98);gap:10px;flex-wrap:wrap;}
.htitle{font-size:12px;letter-spacing:0.14em;}
.hright{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);}
#as-ind{color:var(--green);opacity:0;transition:opacity 0.4s;}
#as-ind.show{opacity:1;}
#fstat{font-size:11px;padding:2px 8px;border:1px solid;letter-spacing:0.06em;}
#fstat.none{border-color:rgba(79,195,247,0.10);color:var(--dim);}
#fstat.ro{border-color:rgba(191,124,10,0.28);color:var(--amber);}
#fstat.rw{border-color:rgba(111,176,111,0.35);color:var(--green);}
.hbtn{background:transparent;border:1px solid rgba(79,195,247,0.16);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:0.07em;padding:3px 10px;cursor:pointer;transition:all 0.15s;}
.hbtn:hover{border-color:var(--blue);color:var(--blue);}

/* TOOLBAR */
#urbar{display:flex;align-items:center;gap:7px;padding:5px 13px;border-bottom:1px solid var(--bdr);flex-shrink:0;flex-wrap:wrap;}
#urinfo{font-size:11px;color:var(--dim);flex:1;min-width:60px;}

/* BODY */
#body{display:flex;flex:1;min-height:0;}
.drag-handle{width:5px;flex-shrink:0;cursor:col-resize;background:transparent;position:relative;transition:background 0.15s;border-left:1px solid var(--bdr);}
.drag-handle:hover,.drag-handle.dragging{background:rgba(79,195,247,0.08);}
.drag-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:40px;width:1px;background:rgba(79,195,247,0.20);}

/* LEFT: SECTION NAV */
#ncol{display:flex;flex-direction:column;overflow:hidden;min-width:160px;max-width:420px;}
.phdr{padding:7px 12px;font-size:12px;letter-spacing:0.12em;color:var(--dim);border-bottom:1px solid var(--bdr);flex-shrink:0;}
#seclist{flex:1;overflow-y:auto;}
.srow{padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(79,195,247,0.04);transition:background 0.1s;position:relative;}
.srow:hover{background:rgba(79,195,247,0.04);}
.srow.active{background:rgba(79,195,247,0.08);border-left:2px solid var(--blue);}
.srow-id{font-size:10px;color:var(--dim);letter-spacing:0.08em;}
.srow-label{font-size:12px;color:rgba(79,195,247,0.70);}
.srow-hint{font-size:10px;color:rgba(79,195,247,0.28);margin-top:2px;}

/* EDITOR */
#editor{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--bdr);}
.ephdr{padding:7px 12px;font-size:12px;letter-spacing:0.12em;color:var(--dim);border-bottom:1px solid var(--bdr);flex-shrink:0;}
#escroll{flex:1;overflow-y:auto;padding:11px 13px;display:flex;flex-direction:column;gap:10px;}
#no-sel{padding:30px 20px;color:var(--dim);font-size:12px;text-align:center;line-height:2.2;}

/* FIELDS */
.fg{display:flex;flex-direction:column;gap:5px;}
.fl{font-size:12px;letter-spacing:0.08em;color:rgba(79,195,247,0.46);}
.fr{display:flex;gap:6px;align-items:center;}
input[type=text],input[type=number],textarea,select{background:rgba(79,195,247,0.04);border:1px solid rgba(79,195,247,0.12);color:var(--blue);font-family:"Share Tech Mono",monospace;font-size:13px;letter-spacing:0.04em;padding:7px 9px;outline:none;transition:border-color 0.2s;width:100%;}
input:focus,textarea:focus,select:focus{border-color:rgba(79,195,247,0.35);}
select option{background:#001220;color:var(--blue);}
input[type=range]{-webkit-appearance:none;height:2px;background:rgba(79,195,247,0.18);outline:none;cursor:pointer;flex:1;accent-color:var(--blue);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--blue);cursor:pointer;}
.val{font-size:12px;color:var(--blue);min-width:48px;text-align:right;flex-shrink:0;}
.sec-div{border-top:1px solid rgba(79,195,247,0.07);padding-top:10px;margin-top:2px;}

/* BUTTONS */
.btn{background:transparent;border:1px solid rgba(79,195,247,0.17);color:var(--blue);font-family:"Share Tech Mono",monospace;font-size:12px;letter-spacing:0.07em;padding:5px 12px;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.btn:hover{border-color:var(--blue);background:rgba(79,195,247,0.05);}
.btn.g{border-color:rgba(111,176,111,0.28);color:var(--green);}
.btn.g:hover{border-color:var(--green);background:rgba(111,176,111,0.05);}
.btn.r{border-color:rgba(224,80,80,0.18);color:rgba(224,80,80,0.50);}
.btn.r:hover{border-color:var(--red);color:var(--red);background:rgba(224,80,80,0.05);}
.btn.a{border-color:rgba(191,124,10,0.24);color:var(--amber);}
.btn.a:hover{border-color:var(--amber);background:rgba(191,124,10,0.05);}
.btn.sm{font-size:11px;padding:3px 9px;}
.btn:disabled{opacity:0.28;cursor:not-allowed;}
#brow{display:flex;gap:6px;flex-wrap:wrap;}

/* LINE EDITOR (script/status/scan) */
.lned{display:flex;flex-direction:column;gap:4px;}
.lned-row{display:flex;gap:5px;align-items:center;}
.lned-row input.ltxt{flex:1;font-size:12px;padding:5px 8px;}
.lned-row select.lcls{width:82px;flex-shrink:0;font-size:11px;padding:4px 6px;}
.lned-row input.lpause{width:62px;flex-shrink:0;font-size:12px;padding:5px 7px;}
.lbtns{display:flex;gap:2px;flex-shrink:0;}
.rbtn{background:transparent;border:1px solid rgba(79,195,247,0.10);color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:10px;padding:2px 5px;cursor:pointer;transition:all 0.12s;line-height:1;}
.rbtn:hover{border-color:rgba(79,195,247,0.30);color:var(--blue);}
.rbtn.r:hover{border-color:var(--red);color:var(--red);}
.pause-hdr{font-size:10px;color:var(--dim);text-align:right;width:62px;flex-shrink:0;padding-right:4px;}

/* IDLE MESSAGES */
.idle-list{display:flex;flex-direction:column;gap:4px;}
.idle-row{display:flex;gap:5px;align-items:center;}
.idle-row input{flex:1;font-size:12px;padding:5px 8px;}

/* OSCILLATOR ROWS */
.osc-block{border:1px solid rgba(79,195,247,0.10);margin-bottom:5px;}
.osc-hdr{display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(79,195,247,0.03);cursor:pointer;user-select:none;}
.osc-label{flex:1;font-size:11px;color:rgba(79,195,247,0.55);letter-spacing:0.06em;}
.osc-type-badge{font-size:10px;padding:1px 5px;border:1px solid rgba(79,195,247,0.18);color:var(--dim);}
.osc-body{padding:8px;display:flex;flex-direction:column;gap:7px;}
.osc-row{display:flex;align-items:center;gap:8px;}
.osc-row label{font-size:11px;color:var(--dim);letter-spacing:0.06em;min-width:80px;flex-shrink:0;}
.adv-toggle{font-size:10px;color:rgba(79,195,247,0.28);cursor:pointer;letter-spacing:0.08em;padding:3px 0;user-select:none;transition:color 0.12s;}
.adv-toggle:hover{color:var(--blue);}
.adv-panel{padding:6px 0 2px;border-top:1px solid rgba(79,195,247,0.07);margin-top:4px;display:none;flex-direction:column;gap:6px;}
.adv-panel.open{display:flex;}

/* LEVEL SECTIONS */
.level-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:rgba(79,195,247,0.03);border:1px solid rgba(79,195,247,0.08);cursor:pointer;margin-bottom:4px;user-select:none;}
.level-hdr:hover{background:rgba(79,195,247,0.05);}
.lhdr-label{font-size:11px;letter-spacing:0.10em;}
.lhdr-arrow{font-size:10px;color:var(--dim);transition:transform 0.18s;}
.level-body{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.level-body.hidden{display:none;}
.level-body.hidden + .lhdr-arrow,.level-hdr.col .lhdr-arrow{transform:rotate(-90deg);}

/* RIGHT: PREVIEW */
#rcol{display:flex;flex-direction:column;min-width:200px;max-width:560px;}
#pw{flex:1;min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--bdr);}
.pvhdr{padding:7px 13px;font-size:12px;letter-spacing:0.12em;color:rgba(79,195,247,0.42);border-bottom:1px solid rgba(79,195,247,0.08);flex-shrink:0;display:flex;justify-content:space-between;align-items:center;}
#preview{flex:1;overflow-y:auto;padding:13px;line-height:1.9;font-size:13px;word-break:break-word;background:#00080e;}
#jw{height:170px;display:flex;flex-direction:column;flex-shrink:0;}
.jhdr{padding:7px 13px;font-size:12px;letter-spacing:0.12em;color:var(--dim);border-bottom:1px solid var(--bdr);flex-shrink:0;display:flex;justify-content:space-between;align-items:center;}
#jo{flex:1;overflow-y:auto;padding:9px 13px;color:rgba(79,195,247,0.58);line-height:1.6;white-space:pre;font-size:12px;}

::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(79,195,247,0.12);}
#toast{position:fixed;bottom:16px;right:16px;background:rgba(2,8,16,0.96);border:1px solid rgba(79,195,247,0.22);color:var(--blue);padding:6px 13px;font-size:12px;letter-spacing:0.05em;opacity:0;transition:opacity 0.22s;pointer-events:none;z-index:200;}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">

<div id="hdr">
  <span class="htitle">ECHO ENGINE LAB // v1.0</span>
  <div class="hright">
    <span id="as-ind">&#10003; AUTOSAVED</span>
    <span id="fstat" class="none">NO FILE OPEN</span>
    <button class="hbtn" onclick="openFile()">&#8213; OPEN FILE</button>
  </div>
</div>

<div id="urbar">
  <button class="btn sm" onclick="doUndo()" id="undo-btn" disabled>&#8617; UNDO</button>
  <button class="btn sm" onclick="doRedo()" id="redo-btn" disabled>&#8618; REDO</button>
  <span id="urinfo">No changes yet</span>
  <button class="btn sm g" onclick="saveSection()" id="save-btn" disabled>&#8629; SAVE SECTION</button>
  <button class="btn sm a" onclick="saveToFile()" id="stf-btn">&#8681; SAVE TO FILE</button>
  <button class="btn sm" onclick="dlJSON()">&#8595; DOWNLOAD</button>
</div>

<div id="body">

<div id="ncol" style="width:220px;">
  <div class="phdr">&#9658; SECTIONS</div>
  <div id="seclist"></div>
</div>

<div class="drag-handle" id="dh-l" onmousedown="startDrag(event,'l')"></div>

<div id="editor">
  <div class="ephdr" id="ed-hdr">&#9658; ENGINE EDITOR</div>
  <div id="escroll">
    <div id="no-sel">Select a section from the list to begin editing.</div>
    <div id="sec-form" style="display:none;flex-direction:column;gap:10px;"></div>
  </div>
</div>

<div class="drag-handle" id="dh-r" onmousedown="startDrag(event,'r')"></div>

<div id="rcol" style="width:310px;">
  <div id="pw">
    <div class="pvhdr"><span>&#9658; PREVIEW</span><span id="pv-label" style="font-size:10px;color:var(--dim);">&#8212;</span></div>
    <div id="preview"><span style="opacity:0.36;font-size:12px;">Select a section to preview.</span></div>
  </div>
  <div id="jw">
    <div class="jhdr"><span>&#9658; JSON SNIPPET</span><button class="btn sm" onclick="cpJSON()">COPY</button></div>
    <div id="jo">// Select a section to generate snippet</div>
  </div>
</div>

</div></div>
<input type="file" id="fi" accept=".json" style="display:none" onchange="onFileIn(event)">
<div id="toast"></div>

<script>
'use strict';

// ── SECTION DEFINITIONS ───────────────────────────────────────────────────────
var SECTIONS = [
  { id:'boot_script',    label:'BOOT SEQUENCE',       hint:'Opening terminal lines' },
  { id:'l2_intro',       label:'L2 INTRO SEQUENCE',   hint:'Echo Protocol transition' },
  { id:'l3_intro',       label:'L3 INTRO SEQUENCE',   hint:'Dev.Mode transition' },
  { id:'idle',           label:'IDLE BEHAVIOR',        hint:'Idle messages + timing' },
  { id:'behavior',       label:'BEHAVIOR FLAGS',       hint:'Slow words, self-destruct' },
  { id:'typing',         label:'TYPING SPEED',         hint:'Typewriter parameters' },
  { id:'audio',          label:'AUDIO',                hint:'Volume + ambient oscillators' },
  { id:'timing',         label:'VISUAL TIMING',        hint:'Fades, phosphor, crossfade' },
  { id:'l1_status_lines',label:'STATUS COMMAND',       hint:'[STATUS] output lines' },
  { id:'l1_scan_lines',  label:'SCAN COMMAND',         hint:'[SCAN] output lines' },
  { id:'power',          label:'POWER OVERLAY',        hint:'Button text, version string' }
];

// ── PREVIEW COLORS ────────────────────────────────────────────────────────────
var PVC = { full:'#4fc3f7', dim:'rgba(79,195,247,0.68)', lo:'rgba(79,195,247,0.38)', warn:'#E8732A', denied:'#ff003c', blank:'transparent' };

// ── STATE ─────────────────────────────────────────────────────────────────────
var cfg = null;
var curSec = null;
var hist = [], histIdx = -1;
var fileHandle = null;
// Working copies for current section (decoded from cfg when section is selected)
var curLines = [];    // for script/status/scan sections: [{text,cls,pause?}]
var curIdle  = [];    // strings
var curOscs  = { l1:[], l2:[], l3:[] }; // oscillator arrays
var advOpen  = {};    // osc advanced panels open state: 'l1-0', 'l2-1', etc.
var levelOpen = { l1:true, l2:true, l3:true };

// ── FAVICON ───────────────────────────────────────────────────────────────────
(function(){
  function mkSVG(c){var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><style>@keyframes f{0%,44%{opacity:1}46%,50%{opacity:0.07}52%,100%{opacity:1}}</style>';[{x:0,y:5,h:22,d:'0.0s'},{x:12,y:0,h:32,d:'0.35s'},{x:24,y:6,h:20,d:'0.7s'}].forEach(function(b){s+='<g style="animation:f 5s '+b.d+' infinite"><rect x="'+b.x+'" y="'+b.y+'" width="8" height="'+b.h+'" rx="2" fill="'+c+'" opacity="0.6"/><rect x="'+(b.x+1)+'" y="'+(b.y+1)+'" width="6" height="'+(b.h-2)+'" rx="1" fill="'+c+'"/></g>';});return s+'</svg>';}
  var el=document.createElement('link');el.rel='icon';el.type='image/svg+xml';
  el.href='data:image/svg+xml;base64,'+btoa(mkSVG('#4fc3f7'));
  document.head.appendChild(el);
})();

// ── FILE I/O ──────────────────────────────────────────────────────────────────
async function openFile(){
  if(window.showOpenFilePicker){
    try{
      var [h]=await window.showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      fileHandle=h; var f=await h.getFile();
      loadCfg(JSON.parse(await f.text()),f.name,'rw');
    }catch(e){if(e.name!=='AbortError')document.getElementById('fi').click();}
  }else document.getElementById('fi').click();
}
function onFileIn(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){try{loadCfg(JSON.parse(ev.target.result),f.name,'ro');}catch(ex){toast('Parse error: '+ex.message);}};
  r.readAsText(f);e.target.value='';
}
function loadCfg(raw,name,cls){
  cfg=raw; pushHist(); curSec=null;
  showNoSel(); renderSecList();
  setFstat(name,cls);
  document.getElementById('save-btn').disabled=true;
  toast('Opened: '+name);
}
function setFstat(name,cls){
  var el=document.getElementById('fstat');el.textContent=name;el.className=cls;
  document.getElementById('stf-btn').disabled=(cls==='ro');
}
async function saveToFile(){
  if(!fileHandle){dlJSON();return;}
  try{var w=await fileHandle.createWritable();await w.write(buildJSON());await w.close();showSaved();toast('Saved to file');}
  catch(e){toast('Save failed — downloading instead');dlJSON();}
}
function dlJSON(){
  var blob=new Blob([buildJSON()],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='engine_config.json';a.click();
  showSaved();toast('Downloaded engine_config.json');
}
function buildJSON(){return JSON.stringify(cfg,null,2);}
function showSaved(){var i=document.getElementById('as-ind');i.classList.add('show');setTimeout(function(){i.classList.remove('show');},1800);}

// ── UNDO / REDO ───────────────────────────────────────────────────────────────
function pushHist(){hist=hist.slice(0,histIdx+1);hist.push(JSON.parse(JSON.stringify(cfg)));if(hist.length>60)hist.shift();histIdx=hist.length-1;updUrUI();}
function doUndo(){if(histIdx<=0){toast('Nothing to undo');return;}histIdx--;cfg=JSON.parse(JSON.stringify(hist[histIdx]));if(curSec)loadSection(curSec);toast('Undo');}
function doRedo(){if(histIdx>=hist.length-1){toast('Nothing to redo');return;}histIdx++;cfg=JSON.parse(JSON.stringify(hist[histIdx]));if(curSec)loadSection(curSec);toast('Redo');}
function updUrUI(){
  document.getElementById('undo-btn').disabled=histIdx<=0;
  document.getElementById('redo-btn').disabled=histIdx>=hist.length-1;
  document.getElementById('urinfo').textContent=hist.length?(histIdx+1)+' / '+hist.length+' states':'No changes yet';
}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();doRedo();}
});

// ── SECTION LIST ──────────────────────────────────────────────────────────────
function renderSecList(){
  document.getElementById('seclist').innerHTML=SECTIONS.map(function(s){
    return '<div class="srow'+(s.id===curSec?' active':'')+'" onclick="selectSection(\''+s.id+'\')">'+
      '<div class="srow-id">'+s.id+'</div>'+
      '<div class="srow-label">'+s.label+'</div>'+
      '<div class="srow-hint">'+s.hint+'</div>'+
    '</div>';
  }).join('');
}
function selectSection(id){curSec=id;renderSecList();loadSection(id);}
function showNoSel(){
  document.getElementById('no-sel').style.display='';
  document.getElementById('sec-form').style.display='none';
  document.getElementById('save-btn').disabled=true;
  document.getElementById('preview').innerHTML='<span style="opacity:0.36;font-size:12px;">Select a section to preview.</span>';
  document.getElementById('jo').textContent='// Select a section to generate snippet';
}

// ── LOAD SECTION INTO EDITOR ──────────────────────────────────────────────────
function loadSection(id){
  if(!cfg){showNoSel();return;}
  document.getElementById('no-sel').style.display='none';
  document.getElementById('sec-form').style.display='flex';
  document.getElementById('save-btn').disabled=false;
  var sec=SECTIONS.find(function(s){return s.id===id;});
  document.getElementById('ed-hdr').textContent='▶ '+sec.label;

  var form=document.getElementById('sec-form');
  form.innerHTML='';

  if(id==='boot_script'||id==='l2_intro'||id==='l3_intro'||id==='l1_status_lines'||id==='l1_scan_lines'){
    var hasPause=(id==='boot_script');
    curLines=JSON.parse(JSON.stringify(cfg[id]||[]));
    form.appendChild(mkScriptEditor(hasPause));
    form.appendChild(mkBrow());
  } else if(id==='idle'){
    curIdle=(cfg.idle_messages||[]).slice();
    form.appendChild(mkIdleEditor());
    form.appendChild(mkBrow());
  } else if(id==='behavior'){
    form.appendChild(mkBehaviorEditor());
    form.appendChild(mkBrow());
  } else if(id==='typing'){
    form.appendChild(mkTypingEditor());
    form.appendChild(mkBrow());
  } else if(id==='audio'){
    curOscs={
      l1:JSON.parse(JSON.stringify((cfg.audio&&cfg.audio.ambient&&cfg.audio.ambient.l1&&cfg.audio.ambient.l1.oscillators)||[])),
      l2:JSON.parse(JSON.stringify((cfg.audio&&cfg.audio.ambient&&cfg.audio.ambient.l2&&cfg.audio.ambient.l2.oscillators)||[])),
      l3:JSON.parse(JSON.stringify((cfg.audio&&cfg.audio.ambient&&cfg.audio.ambient.l3&&cfg.audio.ambient.l3.oscillators)||[]))
    };
    form.appendChild(mkAudioEditor());
    form.appendChild(mkBrow());
  } else if(id==='timing'){
    form.appendChild(mkTimingEditor());
    form.appendChild(mkBrow());
  } else if(id==='power'){
    form.appendChild(mkPowerEditor());
    form.appendChild(mkBrow());
  }

  updPreview(id);
  updJSON(id);
}

// ── SAVE SECTION ─────────────────────────────────────────────────────────────
function saveSection(){
  if(!cfg||!curSec){return;}
  var id=curSec;

  if(id==='boot_script'||id==='l2_intro'||id==='l3_intro'||id==='l1_status_lines'||id==='l1_scan_lines'){
    cfg[id]=curLines.map(function(l){return id==='boot_script'?{text:l.text,cls:l.cls,pause:parseFloat(l.pause)||0}:{text:l.text,cls:l.cls};});
  } else if(id==='idle'){
    cfg.idle_messages=curIdle.slice();
    cfg.idle_delay_ms=parseInt(document.getElementById('idle-delay').value,10)||80000;
    cfg.idle_fade_ms =parseInt(document.getElementById('idle-fade').value,10)||8000;
  } else if(id==='behavior'){
    var slowRaw=document.getElementById('slow-inp').value;
    cfg.slow_words=slowRaw.split(',').map(function(s){return s.trim().toUpperCase();}).filter(Boolean);
    cfg.destruct_at=parseInt(document.getElementById('destruct-inp').value,10)||50;
  } else if(id==='typing'){
    cfg.typing={base_ms:parseFloat(document.getElementById('t-base').value)||38,slow_multiplier:parseFloat(document.getElementById('t-slow').value)||2.8,variance:parseFloat(document.getElementById('t-var').value)||0.6};
  } else if(id==='audio'){
    if(!cfg.audio)cfg.audio={};
    cfg.audio.master_volume=parseFloat(document.getElementById('a-vol').value)||0.18;
    if(!cfg.audio.ambient)cfg.audio.ambient={};
    ['l1','l2','l3'].forEach(function(lv){
      if(!cfg.audio.ambient[lv])cfg.audio.ambient[lv]={};
      cfg.audio.ambient[lv].target_volume=parseFloat(document.getElementById('tv-'+lv).value)||0.18;
      cfg.audio.ambient[lv].oscillators=JSON.parse(JSON.stringify(curOscs[lv]));
    });
  } else if(id==='timing'){
    cfg.timing={fade_ms:parseInt(document.getElementById('tm-fade').value,10)||380,layer_crossfade_ms:parseInt(document.getElementById('tm-xfade').value,10)||1100,phosphor_brightness:parseFloat(document.getElementById('tm-pbright').value)||2.4,phosphor_duration_ms:parseInt(document.getElementById('tm-pdur').value,10)||450};
  } else if(id==='power'){
    cfg.power_button_text=document.getElementById('pw-btn').value;
    cfg.version_string=document.getElementById('pw-ver').value;
  }

  pushHist(); showSaved(); updPreview(id); updJSON(id); toast('Section saved');
}

function rmOsc(lv,i){curOscs[lv].splice(i,1);rebuildOscs(lv);}
function moveOsc(lv,i,d){var j=i+d;if(j<0||j>=curOscs[lv].length)return;var t=curOscs[lv][i];curOscs[lv][i]=curOscs[lv][j];curOscs[lv][j]=t;rebuildOscs(lv);}

// ── TIMING EDITOR ─────────────────────────────────────────────────────────────
function mkTimingEditor(){
  var t=cfg.timing||{fade_ms:380,layer_crossfade_ms:1100,phosphor_brightness:2.4,phosphor_duration_ms:450};
  var wrap=document.createElement('div');
  function mkSliderField(label,id,min,max,step,val,unit){
    return '<div class="fg"><div class="fl">'+label+'</div><div class="fr"><input type="range" id="'+id+'-r" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" oninput="document.getElementById(\''+id+'\').value=this.value;document.getElementById(\''+id+'-v\').textContent=this.value+\''+unit+'\';"><span class="val" id="'+id+'-v">'+val+unit+'</span></div><input type="number" id="'+id+'" value="'+val+'" step="'+step+'" min="'+min+'" oninput="document.getElementById(\''+id+'-r\').value=this.value;document.getElementById(\''+id+'-v\').textContent=this.value+\''+unit+'\';" style="margin-top:4px;"></div>';
  }
  wrap.innerHTML=
    mkSliderField('PAGE FADE DURATION (ms)','tm-fade',50,1000,10,t.fade_ms,' ms')+
    '<div class="sec-div">'+
    mkSliderField('LAYER CROSSFADE DURATION (ms) — L1→L2, L2→L3 color transition','tm-xfade',200,3000,50,t.layer_crossfade_ms,' ms')+
    '</div><div class="sec-div">'+
    mkSliderField('PHOSPHOR BRIGHTNESS (peak brightness multiplier)','tm-pbright',1,5,0.1,t.phosphor_brightness,'×')+
    '</div><div class="sec-div">'+
    mkSliderField('PHOSPHOR DURATION (ms)','tm-pdur',100,1500,50,t.phosphor_duration_ms,' ms')+
    '</div>';
  return wrap;
}

// ── PREVIEW ───────────────────────────────────────────────────────────────────
function updPvCur(){if(curSec)updPreview(curSec);}

function updPreview(id){
  var pv=document.getElementById('preview');
  var lbl=document.getElementById('pv-label');

  if(id==='boot_script'||id==='l2_intro'||id==='l3_intro'||id==='l1_status_lines'||id==='l1_scan_lines'){
    lbl.textContent='RENDERED OUTPUT';
    var lines=curLines.length?curLines:(cfg[id]||[]);
    pv.innerHTML=lines.map(function(l){
      if(l.cls==='blank')return '<div style="min-height:1.9em;"></div>';
      var col=PVC[l.cls]||PVC.full;
      return '<div style="color:'+col+';line-height:1.9;font-size:13px;">'+esc(l.text||'')+'</div>';
    }).join('');
  } else if(id==='idle'){
    lbl.textContent='IDLE MESSAGE POOL';
    pv.innerHTML=curIdle.map(function(m){
      return '<div style="color:rgba(79,195,247,0.38);line-height:1.9;font-size:13px;">'+esc(m)+'</div>';
    }).join('');
  } else if(id==='behavior'){
    lbl.textContent='CURRENT VALUES';
    var sw=(cfg.slow_words||[]).join(', ');
    pv.innerHTML='<div style="color:rgba(79,195,247,0.46);font-size:11px;margin-bottom:8px;letter-spacing:0.08em;">SLOW WORDS</div>'+
      '<div style="color:var(--blue);line-height:1.9;">'+esc(sw||'(none)')+'</div>'+
      '<div style="color:rgba(79,195,247,0.46);font-size:11px;margin-top:12px;margin-bottom:4px;letter-spacing:0.08em;">SELF-DESTRUCT AT INPUT #</div>'+
      '<div style="color:var(--blue);line-height:1.9;">'+(cfg.destruct_at||50)+'</div>';
  } else if(id==='typing'){
    var t=cfg.typing||{};
    lbl.textContent='TIMING AT DEFAULT SPEED';
    var charTime=(t.base_ms||38);
    pv.innerHTML='<div style="color:rgba(79,195,247,0.46);font-size:11px;margin-bottom:8px;letter-spacing:0.08em;">BASE: '+charTime+'ms/char — SLOW: '+(charTime*(t.slow_multiplier||2.8)).toFixed(0)+'ms/char — VARIANCE: ±'+(Math.round((t.variance||0.6)*100))+'%</div>'+
      '<div style="color:rgba(79,195,247,0.46);font-size:11px;margin-bottom:8px;">Typical 20-char response takes: ~'+(charTime*20/1000).toFixed(1)+'s–'+(charTime*20*(1+(t.variance||0.6))/1000).toFixed(1)+'s</div>';
  } else if(id==='audio'){
    lbl.textContent='OSCILLATOR STACK';
    var html='<div style="color:rgba(79,195,247,0.46);font-size:11px;letter-spacing:0.08em;margin-bottom:8px;">MASTER VOL: '+Math.round(((cfg.audio&&cfg.audio.master_volume)||0.18)*100)+'%</div>';
    ['l1','l2','l3'].forEach(function(lv){
      var ld=(cfg.audio&&cfg.audio.ambient&&cfg.audio.ambient[lv])||{};
      var lvColors={l1:'#4fc3f7',l2:'#bf7c0a',l3:'#e05050'};
      html+='<div style="color:'+lvColors[lv]+';font-size:11px;letter-spacing:0.08em;margin-top:10px;">'+lv.toUpperCase()+' — TARGET: '+Math.round((ld.target_volume||0)*100)+'%</div>';
      (curOscs[lv]||[]).forEach(function(osc){
        html+='<div style="color:rgba(79,195,247,0.55);font-size:12px;margin-left:8px;line-height:1.9;">'+
          (osc.type==='noise'?'NOISE':''+osc.freq+' Hz')+' · '+osc.type+' · vol '+Math.round((osc.volume||0)*100)+'%'+
          (osc.lfo_rate?(' · LFO '+osc.lfo_rate+' Hz'):'')+(osc.filter_type&&osc.filter_type!=='none'?(' · '+osc.filter_type+' @'+osc.filter_freq+' Hz'):'')+'</div>';
      });
    });
    pv.innerHTML=html;
  } else if(id==='timing'){
    var tm=cfg.timing||{};
    lbl.textContent='TIMING VALUES';
    pv.innerHTML=[
      {l:'Page fade',v:(tm.fade_ms||380)+'ms'},
      {l:'Layer crossfade',v:(tm.layer_crossfade_ms||1100)+'ms'},
      {l:'Phosphor peak',v:(tm.phosphor_brightness||2.4)+'×'},
      {l:'Phosphor duration',v:(tm.phosphor_duration_ms||450)+'ms'}
    ].map(function(r){
      return '<div style="display:flex;justify-content:space-between;color:rgba(79,195,247,0.55);font-size:12px;line-height:2.2;border-bottom:1px solid rgba(79,195,247,0.06);">'+
        '<span>'+r.l+'</span><span style="color:var(--blue);">'+r.v+'</span></div>';
    }).join('');
  } else if(id==='power'){
    lbl.textContent='BUTTON PREVIEW';
    var bt=cfg.power_button_text||'[ Power On / Initialize ]';
    var vs=cfg.version_string||'v1.0';
    pv.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 0;">'+
      '<button style="background:transparent;border:1px solid rgba(79,195,247,0.45);color:#4fc3f7;font-family:\'Share Tech Mono\',monospace;font-size:14px;padding:16px 32px;letter-spacing:0.12em;cursor:default;">'+esc(bt)+'</button>'+
      '<div style="font-size:11px;color:rgba(79,195,247,0.28);letter-spacing:0.16em;">'+esc(vs)+'</div>'+
    '</div>';
  }
}

// ── JSON SNIPPET ──────────────────────────────────────────────────────────────
function updJSON(id){
  if(!cfg)return;
  var snippet={};
  if(id==='idle'){snippet={idle_messages:cfg.idle_messages,idle_delay_ms:cfg.idle_delay_ms,idle_fade_ms:cfg.idle_fade_ms};}
  else if(id==='behavior'){snippet={slow_words:cfg.slow_words,destruct_at:cfg.destruct_at};}
  else if(id==='typing'){snippet={typing:cfg.typing};}
  else if(id==='audio'){snippet={audio:cfg.audio};}
  else if(id==='timing'){snippet={timing:cfg.timing};}
  else if(id==='power'){snippet={power_button_text:cfg.power_button_text,version_string:cfg.version_string};}
  else{snippet[id]=cfg[id];}
  document.getElementById('jo').textContent=JSON.stringify(snippet,null,2);
}
function cpJSON(){navigator.clipboard.writeText(document.getElementById('jo').textContent).then(function(){toast('Copied');}).catch(function(){toast('Copy failed');});}

// ── RESIZE PANELS ─────────────────────────────────────────────────────────────
var dragState=null;
function startDrag(e,side){e.preventDefault();var col=side==='l'?document.getElementById('ncol'):document.getElementById('rcol');var h=document.getElementById('dh-'+side);dragState={side:side,startX:e.clientX,startW:col.offsetWidth,col:col,h:h};h.classList.add('dragging');document.addEventListener('mousemove',onDrag);document.addEventListener('mouseup',stopDrag);}
function onDrag(e){if(!dragState)return;var dx=e.clientX-dragState.startX;if(dragState.side==='r')dx=-dx;dragState.col.style.width=Math.max(160,Math.min(540,dragState.startW+dx))+'px';}
function stopDrag(){if(dragState){dragState.h.classList.remove('dragging');dragState=null;}document.removeEventListener('mousemove',onDrag);document.removeEventListener('mouseup',stopDrag);}

// ── TOAST ─────────────────────────────────────────────────────────────────────
var toastT=null;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},2400);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById('stf-btn').disabled=true;
renderSecList();
updUrUI();
</script>
